<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172554">
<title>تفاصيل المشروع — مناقصة</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Cairo:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,sans-serif;background:#f0f5ff;color:#1e293b;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit}
.top{height:62px;background:#172554;border-bottom:3px solid #0ea5e9;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff;position:sticky;top:0;z-index:20}
.top b{font-size:21px;font-weight:900}.top b i{color:#38bdf8;font-style:normal}
.top a{color:#fff;text-decoration:none;font-size:13px;font-weight:800;opacity:.85}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 110px;display:flex;flex-direction:column;gap:14px}
.h1{font-size:22px;font-weight:900;color:#172554}.mu{color:#64748b;font-size:12.5px;font-weight:700}
.card{background:#fff;border:1px solid #e6eefb;border-radius:18px;box-shadow:0 2px 10px rgba(30,58,138,.05);padding:18px}
.h3{font-size:15px;font-weight:900;color:#172554}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 15px;font-weight:800;font-size:13.5px;border:0;cursor:pointer;white-space:nowrap;text-decoration:none}
.pri{background:#1e3a8a;color:#fff}.sec{background:#fff;border:1.5px solid #e2e8f0;color:#1e293b}.wa{background:#16a34a;color:#fff}.dan{background:#fff;border:1.5px solid #fecdca;color:#b42318}.gold{background:#fffbeb;border:1.5px solid #fde68a;color:#1e3a8a}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sb{justify-content:space-between}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1.5px solid #e2e8f0;background:#fff;color:#475467;border-radius:99px;padding:7px 13px;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:#172554;color:#fff;border-color:#172554}
.pill{display:inline-flex;align-items:center;gap:4px;height:23px;border-radius:99px;padding:0 10px;font-size:11.5px;font-weight:800;white-space:nowrap}
.p-b{background:#eff4ff;color:#1e3a8a}.p-g{background:#ecfdf3;color:#067647}.p-gr{background:#f2f4f7;color:#475467}.p-y{background:#fffaeb;color:#b54708}.p-r{background:#fef3f2;color:#b42318}
.ql{display:flex;flex-direction:column;gap:10px}
.qi{display:flex;gap:12px;align-items:center;cursor:pointer;text-align:right;width:100%;border:1px solid #e6eefb;background:#fff;border-radius:16px;padding:14px;color:inherit}
.qi:hover{border-color:#bfd3fe}
.qi .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.qi b{font-size:14.5px;color:#172554}
.amt{font-family:Cairo,sans-serif;font-weight:900;color:#172554;white-space:nowrap}
.f label{display:block;font-size:12.5px;font-weight:800;color:#334766;margin-bottom:5px}
.f input,.f textarea,.f select{width:100%;border:1.5px solid #e2e8f0;border-radius:11px;padding:10px 12px;font-size:14.5px;background:#fff;color:#1e293b}
.f textarea{min-height:80px;resize:vertical}
.grid2{display:flex;gap:12px}.grid2>*{flex:1;min-width:0}
.ed{display:flex;gap:16px;align-items:flex-start}.ed .main{flex:1.7;min-width:0;display:flex;flex-direction:column;gap:14px}.ed .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;position:sticky;top:76px}
.seg{display:flex;background:#e2e8f0;border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:800;font-size:13px;color:#64748b;cursor:pointer}
.seg button.on{background:#fff;color:#172554;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.opt{border:1.5px solid #e2e8f0;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.opt.rec{border-color:#1e3a8a;background:#f8faff}
.it{display:flex;gap:6px;align-items:center}
.it input{border:1.5px solid #e2e8f0;border-radius:10px;padding:9px 10px;font-size:14px;min-width:0;background:#fff}
.it .t{flex:1}.it .q{width:58px;text-align:center}.it .p{width:96px}
.x{border:0;background:#fef3f2;color:#b42318;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:16px;flex:none}
.chk{display:flex;gap:8px;font-size:13px;font-weight:700;align-items:flex-start;line-height:1.6}
.sheet-ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.sheet-ov{align-items:center}}
.sheet{background:#fff;width:min(480px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
@media(min-width:700px){.sheet{border-radius:20px}}
.bar{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid #e2e8f0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:15;box-shadow:0 -6px 20px rgba(30,58,138,.08)}
.bar .in{max-width:1180px;margin:0 auto;display:flex;gap:8px;align-items:center}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#172554;color:#fff;padding:11px 18px;border-radius:12px;font-weight:800;font-size:13.5px;z-index:99;display:none}
.empty{text-align:center;padding:40px 16px}
@media(max-width:820px){.ed{flex-direction:column}.ed .side{position:static;width:100%}.ed .main{width:100%}.grid2{flex-direction:column}}
.steps{display:flex;align-items:flex-start}.steps div{flex:1;text-align:center;font-size:11.5px;font-weight:800;color:#94a3b8;position:relative;padding-top:24px}.steps div:before{content:'';position:absolute;top:6px;left:50%;width:100%;height:3px;background:#e2e8f0}.steps div:first-child:before{display:none}.steps div i{position:absolute;top:0;right:calc(50% - 8px);width:16px;height:16px;border-radius:50%;background:#e2e8f0;z-index:1}.steps div.on{color:#1e3a8a}.steps div.on i,.steps div.on:before{background:#1e3a8a}
.ck{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #f1f5f9;font-size:14px;font-weight:700}.ck .b{width:28px;height:28px;border-radius:8px;border:2px solid #cbd5e1;background:#fff;flex:none;color:#fff;font-size:15px;cursor:pointer;font-weight:900}.ck.done .b{background:#16a34a;border-color:#16a34a}.ck.done .t{color:#94a3b8;text-decoration:line-through}
.phs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ph{width:84px;height:84px;border-radius:12px;background:#e2e8f0 center/cover;position:relative;display:block}.ph span{position:absolute;bottom:4px;right:4px;background:rgba(15,23,42,.7);color:#fff;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px}
.stars{display:flex;gap:6px;justify-content:center}.stars button{border:0;background:none;font-size:34px;color:#e2e8f0;cursor:pointer;line-height:1}.stars button.on{color:#f59e0b}
.wrap{max-width:680px}
</style>
</head>
<body>
<div class="top"><b>مناقصة <i>•</i></b><a href="/dashboard-client.html">‹ لوحة التحكم</a></div>
<div class="wrap" id="app"><div class="mu">جارٍ التحميل…</div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
var TOK=''; try{TOK=localStorage.getItem('token')||'';}catch(e){}
var A=document.getElementById('app'), id=parseInt(new URLSearchParams(location.search).get('id'))||0, J=null;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function login(){ try{localStorage.setItem('_after_login',location.pathname+location.search);}catch(e){} location.href='/auth.html'; }
if(!TOK){ login(); return; }
function api(p,o){o=o||{};o.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+TOK},o.headers||{});
  return fetch(p,o).then(function(r){ if(r.status===401){ login(); throw 0; } return r.json().then(function(j){ if(!r.ok){ throw new Error(j.message||'حدث خطأ'); } return j; }); });}
function toast(t){ var e=document.getElementById('toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){e.style.display='none';},2600); }
function m(v){ return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:2}); }
function _LC(){ var l=(document.cookie.match(/(?:^|; )mnq_lang=(\w+)/)||[])[1]; if(!l){ try{ l=localStorage.getItem('mnq_lang'); }catch(e){} } return l==='en'?'en-GB':l==='ur'?'ur-PK':'ar-SA'; }
function dt(x){ if(!x)return ''; try{ return new Date(x).toLocaleString(_LC()+'-u-nu-latn-ca-gregory',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } }
function wa(ph){ ph=String(ph||'').replace(/\D/g,''); if(ph.indexOf('05')===0)ph='966'+ph.slice(1); else if(ph.length===9&&ph[0]==='5')ph='966'+ph; return ph; }
var STEPS=[['موافقة','new'],['موعد','scheduled'],['قيد التنفيذ','active'],['تسليم','delivered'],['مكتمل','done']];
function steps(st){ var k=['new','scheduled','active','delivered','done'].indexOf(st); return '<div class="steps">'+STEPS.map(function(s,i){ return '<div class="'+(i<=k?'on':'')+'"><i></i>'+s[0]+'</div>'; }).join('')+'</div>'; }
function _mqb(m,o){ var W=window,D=document; function go(){ if(W.MQMAP) W.MQMAP.base(m,o); else L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m); } if(W.MQMAP) return go(); if(!W._mqmP) W._mqmP=new Promise(function(ok){ var s=D.createElement('script'); s.src='/mqmap.js?v=1'; s.onload=ok; s.onerror=ok; D.head.appendChild(s); }); W._mqmP.then(go); }
function _ll(){ if(window.L) return Promise.resolve(); if(window._llP) return window._llP; window._llP=new Promise(function(ok,no){ var c=document.createElement('link'); c.rel='stylesheet'; c.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(c); var s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); return window._llP; }
function _ago(x){ var s=Math.max(0,Math.round((Date.now()-new Date(x))/1000)); return s<60?'قبل '+s+' ثانية':'قبل '+Math.round(s/60)+' دقيقة'; }
var _jm=null,_jmk=null,_jt=null;
function load(){ api('/api/cjobs/'+id).then(function(j){ J=j; draw(); if(/[?&]resched=1/.test(location.search)&&!load._rs&&['new','scheduled'].indexOf(j.status)>=0&&!j.arrived_at&&!j.resched_req){ load._rs=1; _cRes(); } }).catch(function(e){ if(e) A.innerHTML='<div class="card empty"><b>'+esc(e.message)+'</b></div>'; }); }
function draw(){
  var j=J, dn=j.tasks.filter(function(t){return t.done;}).length, tot=(j.value||0)+(j.extra_total||0);
  var h='<div class="card" style="display:flex;gap:12px;align-items:center"><span style="width:46px;height:46px;border-radius:13px;background:#1e3a8a;color:#fff;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;flex:none">'+esc((j.provider_name||'م')[0])+'</span><div style="flex:1;min-width:0"><b style="font-size:15.5px;color:#172554">'+esc(j.provider_name)+'</b><div class="mu">'+esc(j.title)+' · <span class="amt">'+m(j.vat?tot*1.15:tot)+'</span> ر.س'+(j.vat?' شامل الضريبة':'')+'</div></div>'+(j.provider_phone?'<a class="btn wa" style="padding:9px 12px" target="_blank" rel="noopener" href="https://wa.me/'+wa(j.provider_phone)+'">واتساب</a>':'')+'</div>';
  h+='<div class="card">'+steps(j.status==='cancelled'?'new':j.status)+'</div>';
  if(j.noshow_at&&j.status==='new'&&!j.resched_req) h+='<div class="card" style="background:#fffaeb;border-color:#fde68a;display:flex;flex-direction:column;gap:8px"><b style="color:#93370d;font-size:15.5px">🚪 الفني وصل وما لقاك</b><div class="mu">'+dt(j.noshow_at)+'</div><div class="mu">اختر موعد جديد يناسبك ونرسله للمزوّد.</div><button class="btn pri" onclick="_cRes()">اختر موعد جديد</button></div>';
  if(j.resched_req) h+='<div class="card" style="background:#eff4ff;border-color:#bfd3fe;display:flex;flex-direction:column;gap:6px"><b style="color:#1e3a8a">⏳ طلبت تغيير الموعد إلى '+dt(j.resched_req.at)+'</b><div class="mu">بانتظار تأكيد المزوّد — يوصلك إشعار.</div><button class="btn sec" style="align-self:flex-start" onclick="_cResX()">إلغاء الطلب</button></div>';
  if(j.status==='scheduled'||j.status==='new') h+='<div class="card"><b style="color:#172554">'+(j.sched_at?'🗓 الموعد: '+dt(j.sched_at):'المزوّد يحدد الموعد قريباً')+'</b>'+(j.tech_name?'<div class="mu" style="margin-top:4px">الفني: '+esc(j.tech_name)+'</div>':'')+'</div>'+(j.sched_at&&!j.arrived_at&&!j.resched_req&&!j.enroute_at?'<div class="row" style="margin-top:10px"><button class="btn sec" onclick="_cRes()">🗓 طلب تغيير الموعد</button><button class="btn" style="background:transparent;color:#b42318" onclick="_cCancel()">إلغاء الزيارة</button></div>'+(j.cancel_h?'<div class="mu" style="margin-top:6px">الإلغاء أو التغيير مجاناً قبل الموعد بـ'+j.cancel_h+' ساعات</div>':''):'');
  if(j.enroute_at&&!j.arrived_at&&['new','scheduled','active'].indexOf(j.status)>=0) h+='<div class="card" style="background:#eff4ff;border-color:#bfd3fe;display:flex;flex-direction:column;gap:8px"><b style="color:#1e3a8a;font-size:15.5px">🚗 الفني '+esc(j.tech_name||'')+' في الطريق إليك</b>'+(j.live?'<div id="cmap" style="height:220px;border-radius:12px;overflow:hidden;background:#e2e8f0"></div><span class="mu">آخر تحديث '+_ago(j.live.at)+'</span>':'<span class="mu">'+(j.map_on?'ننتظر أول تحديث لموقعه…':'يوصلك إشعار لما يوصل')+'</span>')+'</div>';
  if(j.status==='active') h+='<div class="card" style="background:#f6fef9;border-color:#a6f4c5"><b style="color:#067647">'+(j.tech_name?'الفني '+esc(j.tech_name)+' في الموقع':'العمل جارٍ')+'</b><div class="mu" style="margin-top:4px">'+(j.arrived_at?'وصل '+dt(j.arrived_at)+' · ':'')+'أنهى '+dn+' من '+j.tasks.length+' مهام</div></div>';
  (j.extras||[]).filter(function(e){return e.status==='sent';}).forEach(function(e){ h+='<div class="card" style="background:#fffcf5;border-color:#fedf89;display:flex;flex-direction:column;gap:10px"><b style="color:#b54708;font-size:15px">عمل إضافي يحتاج موافقتك</b><div class="row" style="flex-wrap:nowrap;gap:10px">'+(e.photo?'<a href="'+esc(e.photo)+'" target="_blank" rel="noopener"><img src="'+esc(e.photo)+'" style="width:64px;height:64px;object-fit:cover;border-radius:10px"></a>':'')+'<div><b style="font-size:14px">'+esc(e.descr)+'</b><div class="amt" style="font-size:19px">'+m(J.vat?e.price*1.15:e.price)+' <small class="mu">ر.س</small></div>'+(J.vat?'<div class="mu">'+m(e.price)+' + ضريبة 15% '+m(e.price*0.15)+'</div>':'')+'</div></div><div class="row" style="flex-wrap:nowrap"><button class="btn pri" style="flex:1" onclick="_cEx('+e.id+',true,this)">أوافق</button><button class="btn sec" style="flex:1" onclick="_cEx('+e.id+',false,this)">ما أبيه</button></div></div>'; });
  if(j.status==='delivered') h+='<div class="card" style="display:flex;flex-direction:column;gap:10px;border-color:#bfd3fe"><b style="color:#172554;font-size:16px">سلّمك '+esc(j.provider_name)+' المشروع</b><div class="mu">أكّد الاستلام وقيّم الخدمة</div><div class="stars" id="stars">'+[1,2,3,4,5].map(function(n){ return '<button data-n="'+n+'" onclick="_cStar('+n+')">★</button>'; }).join('')+'</div><textarea id="c-cm" maxlength="600" placeholder="كلمة عن الخدمة (اختياري)" style="width:100%;border:1.5px solid #e2e8f0;border-radius:12px;padding:10px 12px;font-size:14.5px;min-height:70px"></textarea><button class="btn pri" id="c-ok" onclick="_cConfirm()">أكّد الاستلام</button><div class="mu">إذا ما أكّدت خلال 3 أيام يتأكد تلقائياً.</div></div>';
  if(j.status==='done') h+='<div class="card" style="background:#f6fef9;border-color:#a6f4c5"><b style="color:#067647">✅ اكتمل المشروع'+(j.rating?' · قيّمته '+j.rating+' من 5':'')+'</b></div>';
  h+='<div class="card"><div class="row sb" style="margin-bottom:4px"><span class="h3">المهام</span><span class="pill p-b">'+dn+' من '+j.tasks.length+'</span></div>'+j.tasks.map(function(t){ return '<div class="ck'+(t.done?' done':'')+'"><span class="b" style="display:flex;align-items:center;justify-content:center">'+(t.done?'✓':'')+'</span><span class="t" style="flex:1">'+esc(t.t)+'</span></div>'; }).join('')+'</div>';
  if(j.photos.length) h+='<div class="card"><span class="h3">الصور</span><div class="phs">'+j.photos.map(function(p){ return '<a href="'+esc(p.url)+'" target="_blank" rel="noopener" class="ph" style="background-image:url(&quot;'+esc(p.url)+'&quot;)"><span>'+(p.kind==='before'?'قبل':'بعد')+'</span></a>'; }).join('')+'</div></div>';
  (j.extras||[]).filter(function(e){return e.status!=='sent';}).forEach(function(e){ h+='<div class="row sb card" style="padding:12px 14px;font-size:13.5px;font-weight:700"><span>عمل إضافي: '+esc(e.descr)+' — '+m(J.vat?e.price*1.15:e.price)+' ر.س'+(J.vat?' شامل الضريبة':'')+'</span><span class="pill '+(e.status==='approved'?'p-g':'p-r')+'">'+(e.status==='approved'?'وافقت':'رفضت')+'</span></div>'; });
  A.innerHTML=h;
  _jm=null; if(j.live) _ll().then(function(){ var el=document.getElementById('cmap'); if(!el||!window.L) return; _jm=L.map(el,{zoomControl:false,attributionControl:true}).setView([j.live.lat,j.live.lng],14); _mqb(_jm,{def:'std'}); _jmk=L.marker([j.live.lat,j.live.lng],{icon:L.divIcon({className:'',html:'<div style="width:34px;height:34px;border-radius:50%;background:#1e3a8a;color:#fff;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-weight:900">🚗</div>',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(_jm); }).catch(function(){});
  clearTimeout(_jt); if(j.enroute_at&&!j.arrived_at) _jt=setTimeout(load,20000);
}
var RT=0;
window._cStar=function(n){ RT=n; document.querySelectorAll('#stars button').forEach(function(b){ b.classList.toggle('on',parseInt(b.dataset.n)<=n); }); };
window._cEx=function(eid,ok,b){ var __go=()=>{ b.disabled=true; api('/api/cjobs/'+id,{method:'POST',body:JSON.stringify({act:'extra',eid:eid,ok:ok})}).then(function(){ toast(ok?'وافقت — بلّغنا المزوّد':'بلّغنا المزوّد'); load(); }).catch(function(e){ b.disabled=false; if(e)toast(e.message); }); }; if((!ok)){ MQ.ask('ترفض العمل الإضافي؟').then((__y)=>{ if(__y)__go(); }); return; } return __go();};
// ── طلب تغيير الموعد: أوقات فاضية فعلاً من جدول الفني ──
window._cRes=function(){ var o=document.createElement('div'); o.className='sheet-ov'; o.onclick=function(e){ if(e.target===o)o.remove(); };
  o.innerHTML='<div class="sheet f" style="gap:12px"><b style="font-size:17px;color:#172554">اختر موعد جديد</b><div class="mu">أوقات الفني الفاضية — المزوّد يأكد الموعد ويوصلك إشعار.</div><div id="rs-b" class="mu">جاري تحميل الأوقات…</div><textarea id="rs-n" maxlength="300" placeholder="ملاحظة للمزوّد (اختياري)" style="border:1.5px solid #d3deef;border-radius:12px;padding:10px 12px;font-family:inherit;font-size:14px;min-height:60px"></textarea><button class="btn pri" id="rs-go" style="padding:13px" disabled>أرسل الطلب</button></div>';
  document.body.appendChild(o); var SEL=null, B=o.querySelector('#rs-b'), go=o.querySelector('#rs-go');
  var DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  function tm(iso){ return new Date(iso).toLocaleTimeString(_LC()+'-u-nu-latn',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Riyadh'}); }
  function dl(y){ var p=y.split('-'), d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); try{ return d.toLocaleDateString(_LC()+'-u-nu-latn-ca-gregory',{weekday:'long',day:'numeric',month:'numeric',timeZone:'UTC'}); }catch(e){ return DN[d.getUTCDay()]+' '+(+p[2])+'/'+(+p[1]); } }
  api('/api/cjobs/'+id+'/slots').then(function(r){ if(!r.days.length){ B.innerHTML='ما فيه أوقات فاضية خلال 10 أيام — تواصل مع المزوّد.'; return; }
    B.innerHTML=r.days.map(function(d){ return '<div style="margin-bottom:10px"><b style="display:block;color:#172554;font-size:13.5px;margin-bottom:6px">'+dl(d.day)+'</b><div style="display:flex;flex-wrap:wrap;gap:6px">'+d.slots.map(function(s){ return '<button type="button" class="btn sec rs-s" data-s="'+s+'" style="padding:8px 12px;min-height:38px;font-size:13px">'+tm(s)+'</button>'; }).join('')+'</div></div>'; }).join('');
    B.style.maxHeight='46vh'; B.style.overflow='auto';
  }).catch(function(e){ B.textContent=(e&&e.message)||'تعذّر التحميل'; });
  B.addEventListener('click',function(e){ var b=e.target.closest('.rs-s'); if(!b)return; [].forEach.call(B.querySelectorAll('.rs-s'),function(x){ x.classList.remove('pri'); x.classList.add('sec'); x.style.color=''; }); b.classList.remove('sec'); b.classList.add('pri'); SEL=b.getAttribute('data-s'); go.disabled=false; });
  go.onclick=function(){ go.disabled=true; api('/api/cjobs/'+id,{method:'POST',body:JSON.stringify({act:'resched',at:SEL,note:o.querySelector('#rs-n').value})}).then(function(r){ o.remove(); toast(r.message||'وصل طلبك'); load(); }).catch(function(e){ go.disabled=false; if(e)toast(e.message); }); };
};
window._cCancel=function(){ var j=J, ch=j.cancel_h||0, late=ch&&j.sched_at&&(new Date(j.sched_at)-Date.now())<ch*3600e3;
  MQ.prompt({icon:'⚠️',title:'تلغي الزيارة؟',msg:(late?'باقي على الموعد أقل من '+ch+' ساعات — ينحسب «إلغاء متأخر» عند المزوّد. ':'')+'لو تبي وقت ثاني استخدم «طلب تغيير الموعد» بدل الإلغاء.',placeholder:'سبب الإلغاء (اختياري)',ok:'إلغاء الزيارة',cancel:'رجوع'}).then(function(w){ if(w===null)return;
    api('/api/cjobs/'+id,{method:'POST',body:JSON.stringify({act:'cancel',reason:w})}).then(function(r){ toast(r.message||'انلغت'); load(); }).catch(function(e){ if(e)toast(e.message); }); }); };
window._cResX=function(){ api('/api/cjobs/'+id,{method:'POST',body:JSON.stringify({act:'resched_cancel'})}).then(function(){ toast('انلغى الطلب'); load(); }).catch(function(e){ if(e)toast(e.message); }); };
window._cConfirm=function(){ var b=document.getElementById('c-ok'); b.disabled=true; api('/api/cjobs/'+id,{method:'POST',body:JSON.stringify({act:'confirm',rating:RT,comment:document.getElementById('c-cm').value})}).then(function(){ toast('شكراً لك'); load(); }).catch(function(e){ b.disabled=false; if(e)toast(e.message); }); };
if(!id){ A.innerHTML='<div class="card empty"><b>الرابط غير صحيح</b></div>'; return; }
load();
})();
