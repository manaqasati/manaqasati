<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172554">
<title>عملائي — مناقصة</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Cairo:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,sans-serif;background:#f0f5ff;color:#1e293b;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit}
.top{height:62px;background:#172554;border-bottom:3px solid #0ea5e9;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff;position:sticky;top:0;z-index:20}
.top b{font-size:21px;font-weight:900}.top b i{color:#38bdf8;font-style:normal}
.top a{color:#fff;text-decoration:none;font-size:13px;font-weight:800;opacity:.85}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 110px;display:flex;flex-direction:column;gap:14px}
.h1{font-size:22px;font-weight:900;color:#172554}.mu{color:#64748b;font-size:12.5px;font-weight:700}
.card{background:#fff;border:1px solid #e6eefb;border-radius:18px;box-shadow:0 2px 10px rgba(30,58,138,.05);padding:18px}
.h3{font-size:15px;font-weight:900;color:#172554}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 15px;font-weight:800;font-size:13.5px;border:0;cursor:pointer;white-space:nowrap;text-decoration:none}
.pri{background:#1e3a8a;color:#fff}.sec{background:#fff;border:1.5px solid #e2e8f0;color:#1e293b}.wa{background:#16a34a;color:#fff}.dan{background:#fff;border:1.5px solid #fecdca;color:#b42318}.gold{background:#fffbeb;border:1.5px solid #fde68a;color:#1e3a8a}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sb{justify-content:space-between}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1.5px solid #e2e8f0;background:#fff;color:#475467;border-radius:99px;padding:7px 13px;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:#172554;color:#fff;border-color:#172554}
.pill{display:inline-flex;align-items:center;gap:4px;height:23px;border-radius:99px;padding:0 10px;font-size:11.5px;font-weight:800;white-space:nowrap}
.p-b{background:#eff4ff;color:#1e3a8a}.p-g{background:#ecfdf3;color:#067647}.p-gr{background:#f2f4f7;color:#475467}.p-y{background:#fffaeb;color:#b54708}.p-r{background:#fef3f2;color:#b42318}
.ql{display:flex;flex-direction:column;gap:10px}
.qi{display:flex;gap:12px;align-items:center;cursor:pointer;text-align:right;width:100%;border:1px solid #e6eefb;background:#fff;border-radius:16px;padding:14px;color:inherit}
.qi:hover{border-color:#bfd3fe}
.qi .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.qi b{font-size:14.5px;color:#172554}
.amt{font-family:Cairo,sans-serif;font-weight:900;color:#172554;white-space:nowrap}
.f label{display:block;font-size:12.5px;font-weight:800;color:#334766;margin-bottom:5px}
.f input,.f textarea,.f select{width:100%;border:1.5px solid #e2e8f0;border-radius:11px;padding:10px 12px;font-size:14.5px;background:#fff;color:#1e293b}
.f textarea{min-height:80px;resize:vertical}
.grid2{display:flex;gap:12px}.grid2>*{flex:1;min-width:0}
.ed{display:flex;gap:16px;align-items:flex-start}.ed .main{flex:1.7;min-width:0;display:flex;flex-direction:column;gap:14px}.ed .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;position:sticky;top:76px}
.seg{display:flex;background:#e2e8f0;border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:800;font-size:13px;color:#64748b;cursor:pointer}
.seg button.on{background:#fff;color:#172554;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.opt{border:1.5px solid #e2e8f0;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.opt.rec{border-color:#1e3a8a;background:#f8faff}
.it{display:flex;gap:6px;align-items:center}
.it input{border:1.5px solid #e2e8f0;border-radius:10px;padding:9px 10px;font-size:14px;min-width:0;background:#fff}
.it .t{flex:1}.it .q{width:58px;text-align:center}.it .p{width:96px}
.x{border:0;background:#fef3f2;color:#b42318;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:16px;flex:none}
.chk{display:flex;gap:8px;font-size:13px;font-weight:700;align-items:flex-start;line-height:1.6}
.sheet-ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.sheet-ov{align-items:center}}
.sheet{background:#fff;width:min(480px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
@media(min-width:700px){.sheet{border-radius:20px}}
.bar{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid #e2e8f0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:15;box-shadow:0 -6px 20px rgba(30,58,138,.08)}
.bar .in{max-width:1180px;margin:0 auto;display:flex;gap:8px;align-items:center}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#172554;color:#fff;padding:11px 18px;border-radius:12px;font-weight:800;font-size:13.5px;z-index:99;display:none}
.empty{text-align:center;padding:40px 16px}
@media(max-width:820px){.ed{flex-direction:column}.ed .side{position:static;width:100%}.ed .main{width:100%}.grid2{flex-direction:column}}
.kp{display:flex;gap:12px}.kp .k{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}.kp .v{font-family:Cairo,sans-serif;font-size:24px;font-weight:900;color:#172554;line-height:1.3}
.hr{display:flex;gap:11px;align-items:center;padding:11px 0;border-top:1px solid #f1f5f9}.hr .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.hr b{font-size:14px;color:#172554}.hi{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
@media(max-width:820px){.kp{flex-wrap:wrap}.kp .k{flex:1 1 40%}.kp .v{font-size:20px}}
</style>
</head>
<body>
<div class="top"><b>مناقصة <i>•</i></b><a href="/dashboard-provider.html">‹ لوحتي</a></div>
<div class="wrap" id="app"><div class="mu">جارٍ التحميل…</div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
var TOK=''; try{TOK=localStorage.getItem('token')||'';}catch(e){}
if(!TOK){ try{localStorage.setItem('_after_login',location.pathname+location.search);}catch(e){} location.href='/auth.html'; return; }
var A=document.getElementById('app'), P=new URLSearchParams(location.search), S={f:'',q:'',items:[],live:false,c:null};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function api(p,o){o=o||{};o.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+TOK},o.headers||{});
  return fetch(p,o).then(function(r){ if(r.status===401){ try{localStorage.setItem('_after_login',location.pathname+location.search);}catch(e){} location.href='/auth.html'; throw 0; } return r.json().then(function(j){ if(!r.ok){ throw new Error(j.message||'حدث خطأ'); } return j; }); });}
function toast(t){ var e=document.getElementById('toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){e.style.display='none';},2600); }
function m(v){ return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:2}); }
function d(x){ if(!x)return ''; x=new Date(x); return x.getDate()+'/'+(x.getMonth()+1)+'/'+x.getFullYear(); }
function wa(ph){ ph=String(ph||'').replace(/\D/g,''); if(ph.indexOf('05')===0)ph='966'+ph.slice(1); else if(ph.length===9&&ph[0]==='5')ph='966'+ph; return ph; }
function setUrl(q){ try{ history.replaceState(null,'',q?'?'+q:location.pathname); }catch(e){} }
var COL=['#1e3a8a','#0e9384','#6941c6','#c4320a','#475467'];
function av(n,i,sz){ sz=sz||38; return '<span style="width:'+sz+'px;height:'+sz+'px;border-radius:'+Math.round(sz/3.2)+'px;background:'+COL[i%5]+';color:#fff;font-weight:900;font-size:'+Math.round(sz/2.4)+'px;display:flex;align-items:center;justify-content:center;flex:none">'+esc((n||'ع')[0])+'</span>'; }
function ro(){ return S.live?'':'<div class="card" style="background:#fffaeb;border-color:#fde68a;padding:12px 16px"><b style="color:#b54708">دفترك محفوظ — للعرض فقط</b><div class="mu" style="margin-top:3px">الإضافة والتعديل مع الاشتراك. <a href="/plan.html" style="color:#1e3a8a">اشتراكي</a></div></div>'; }
// ───── القائمة ─────
function list(){
  setUrl(''); S.c=null;
  var qs='?f='+encodeURIComponent(S.f)+(S.q?'&q='+encodeURIComponent(S.q):'');
  api('/api/customers'+qs).then(function(r){ S.items=r.items||[]; S.live=!!r.live; S.total=r.total||0; draw(); }).catch(function(e){ if(e) A.innerHTML='<div class="card empty"><b>'+esc(e.message)+'</b></div>'; });
}
function draw(){
  var h='<div class="row sb"><div class="h1">عملائي <span class="mu">('+S.total+')</span></div>'+(S.live?'<button class="btn pri" onclick="_cAdd()">+ عميل</button>':'')+'</div>'+ro();
  h+='<input id="cq" type="search" maxlength="40" placeholder="🔍 بحث بالاسم أو الجوال" value="'+esc(S.q)+'" style="width:100%;border:1.5px solid #e2e8f0;border-radius:12px;padding:11px 13px;font-size:15px;font-family:inherit;background:#fff">';
  h+='<div class="tabs">'+[['','الكل'],['repeat','متكررين'],['open','عندهم مشروع مفتوح'],['idle','ما تعاملوا من 6 شهور']].map(function(t){ return '<button class="'+(S.f===t[0]?'on':'')+'" onclick="_cF(\''+t[0]+'\')">'+t[1]+'</button>'; }).join('')+'</div>';
  if(!S.items.length) h+='<div class="card empty"><div style="font-size:38px">👥</div><b style="display:block;margin-top:6px">'+(S.total?'ما فيه نتائج':'دفترك فاضي')+'</b><div class="mu" style="margin-top:6px">كل عميل ترسل له عرض سعر أو تسوي له مشروع ينضاف تلقائياً.</div></div>';
  else h+='<div class="ql">'+S.items.map(function(c,i){ var tag=c.open_n?'<span class="pill p-y">مشروع مفتوح</span>':(c.q_wait?'<span class="pill p-b">عرض بانتظاره</span>':(c.jobs_n>=2?'<span class="pill p-g">متكرر</span>':''));
    var sub=(c.jobs_n?c.jobs_n+' مشروع':'')+(c.total?' · '+m(c.total)+' ر.س':'')+(c.last_at?' · آخر تعامل '+d(c.last_at):'');
    return '<button class="qi" onclick="_cOpen('+c.id+')">'+av(c.name,i)+'<div class="c"><b>'+esc(c.name||'عميل')+'</b><span class="mu">'+(sub.replace(/^ · /,'')||(c.manual?'أُضيف يدوي':''))+'</span></div>'+tag+'</button>'; }).join('')+'</div>';
  A.innerHTML=h;
  var q=document.getElementById('cq'), t; q.oninput=function(){ clearTimeout(t); t=setTimeout(function(){ S.q=q.value.trim(); list(); setTimeout(function(){ var n=document.getElementById('cq'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },60); },350); };
}
window._cF=function(f){ S.f=f; list(); };
function sheet(inner){ var o=document.createElement('div'); o.className='sheet-ov'; o.id='sh'; o.onclick=function(e){ if(e.target===o)o.remove(); }; o.innerHTML='<div class="sheet f">'+inner+'</div>'; document.body.appendChild(o); return o; }
window._cAdd=function(){ var o=sheet('<b style="font-size:17px;color:#172554">عميل جديد</b><div><label for="a-n">الاسم</label><input id="a-n" maxlength="80"></div><div><label for="a-p">الجوال</label><input id="a-p" dir="ltr" inputmode="tel" maxlength="15" placeholder="05xxxxxxxx" style="text-align:right"></div><div><label for="a-e">الإيميل (اختياري)</label><input id="a-e" type="email" dir="ltr" maxlength="120" style="text-align:right"></div><div><label for="a-a">العنوان (اختياري)</label><input id="a-a" maxlength="200"></div><button class="btn pri" id="a-go">إضافة</button><button class="btn" style="background:transparent;color:#64748b" onclick="document.getElementById(\'sh\').remove()">رجوع</button>');
  document.getElementById('a-go').onclick=function(){ var b=this; b.disabled=true; api('/api/customers',{method:'POST',body:JSON.stringify({name:document.getElementById('a-n').value,phone:document.getElementById('a-p').value,address:document.getElementById('a-a').value,email:document.getElementById('a-e').value})}).then(function(r){ o.remove(); toast('انضاف'); _cOpen(r.id); }).catch(function(e){ b.disabled=false; if(e)toast(e.message); }); }; };
// ───── ملف العميل ─────
window._cOpen=function(id){ setUrl('id='+id); api('/api/customers/'+id).then(function(r){ S.c=r; S.live=!!r.live; prof(); }).catch(function(e){ if(e){ toast(e.message); list(); } }); };
var QST={sent:['بانتظار العميل','p-b'],change:['طلب تعديل','p-y'],accepted:['وافق','p-g'],declined:['اعتذر','p-r'],expired:['انتهى','p-gr']};
function prof(){
  var R=S.c, c=R.customer, st=R.stats;
  var h='<div class="row" style="gap:8px"><button class="btn sec" style="padding:7px 11px" onclick="_cBack()">‹ عملائي</button></div>'+ro();
  h+='<div class="card" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">'+av(c.name,c.id,60)+'<div style="flex:1;min-width:180px"><div class="h1">'+esc(c.name)+'</div><div class="mu" style="margin-top:3px"><span dir="ltr">'+esc(c.phone)+'</span>'+(c.email?' · <a href="mailto:'+esc(c.email)+'" dir="ltr" style="color:#1e3a8a">'+esc(c.email)+'</a>':'')+(c.address?' · '+esc(c.address):'')+' · عميل من '+d(c.created_at)+'</div><div class="row" style="gap:6px;margin-top:6px">'+(st.jobs_n>=2?'<span class="pill p-g">عميل متكرر</span>':'')+(c.client_id?'<span class="pill p-b">له حساب في مناقصة</span>':'')+'</div></div><div class="row"><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+wa(c.phone)+'">واتساب</a><a class="btn sec" href="tel:'+esc(c.phone)+'">اتصال</a>'+(S.live?'<a class="btn pri" href="/quotes.html?new=1&n='+encodeURIComponent(c.name)+'&p='+encodeURIComponent(c.phone)+'">+ عرض سعر</a>':'')+'</div></div>';
  h+='<div class="kp">'+[['إجمالي التعامل',m(st.total),'ر.س (مشاريع مكتملة)'],['المشاريع',st.jobs_n,st.done_n+' مكتملة'+(st.open_n?' · '+st.open_n+' مفتوحة':'')],['عروض الأسعار',st.quotes_n,st.quotes_ok+' موافقة'],['تقييمه لك',st.rating?st.rating+' ★':'—',st.rating_n?'من '+st.rating_n+' تقييم':'ما قيّم للحين']].map(function(k){ return '<div class="card k"><span class="mu">'+k[0]+'</span><div class="v">'+k[1]+'</div><span class="mu">'+k[2]+'</span></div>'; }).join('')+'</div>';
  h+='<div class="ed"><div class="main">';
  // السجل
  var H=[]; R.jobs.forEach(function(j){ H.push({at:j.created_at,h:'<div class="hr"><span class="hi" style="background:#ecfdf3">🧰</span><div class="c"><b>مشروع: '+esc(j.title)+'</b><span class="mu">'+esc(j.status_t)+' · '+m(j.value+j.extra_total)+' ر.س'+(j.rating?' · قيّمك '+j.rating+' ★':'')+' · '+d(j.created_at)+'</span></div><a class="btn sec" style="padding:7px 12px" href="/jobs.html?id='+j.id+'">افتح</a></div>'}); });
  R.quotes.forEach(function(q){ var s=QST[q.status]||['','p-gr']; H.push({at:q.created_at,h:'<div class="hr"><span class="hi" style="background:#eff4ff">📄</span><div class="c"><b>عرض سعر رقم '+q.no+': '+esc(q.title)+'</b><span class="mu"><span class="pill '+s[1]+'">'+s[0]+'</span> · '+m(q.total)+' ر.س · '+d(q.created_at)+'</span></div><a class="btn sec" style="padding:7px 12px" href="/quotes.html?id='+q.id+'">افتح</a></div>'}); });
  R.qreqs.forEach(function(q){ H.push({at:q.created_at,h:'<div class="hr"><span class="hi" style="background:#f4f3ff">📝</span><div class="c"><b>طلب تسعيرة من صفحتك</b><span class="mu">'+esc(q.service||'')+' · '+d(q.created_at)+'</span></div></div>'}); });
  H.sort(function(a,b){ return new Date(b.at)-new Date(a.at); });
  h+='<div class="card"><div class="row sb" style="margin-bottom:4px"><span class="h3">السجل</span><span class="mu">الأحدث أولاً</span></div>'+(H.length?H.map(function(x){return x.h;}).join(''):'<div class="mu" style="padding:10px 0">ما فيه تعامل للحين</div>')+'</div>';
  // الأجهزة
  h+='<div class="card"><div class="row sb" style="margin-bottom:4px"><span class="h3">الأجهزة والمواقع</span>'+(S.live?'<div class="row"><button class="btn sec" style="padding:7px 12px;font-size:12.5px" onclick="_dEd(0,\'device\')">+ جهاز</button><button class="btn sec" style="padding:7px 12px;font-size:12.5px" onclick="_dEd(0,\'site\')">+ موقع</button></div>':'')+'</div>'+(R.devices.length?R.devices.map(function(x){ return '<div class="hr"><span class="hi" style="background:#f2f4f7">'+(x.kind==='site'?'📍':'⚙️')+'</span><div class="c"><b>'+esc(x.name)+(x.qty>1?' × '+x.qty:'')+(x.place?' — '+esc(x.place):'')+'</b><span class="mu">'+[x.brand?esc(x.brand):'',x.last_service?'آخر صيانة '+d(x.last_service):'',x.added_by&&x.added_by!=='المؤسسة'?'سجّله '+esc(x.added_by):'',x.notes?esc(x.notes):''].filter(Boolean).join(' · ')+'</span></div>'+(x.maps?'<a class="btn sec" style="padding:7px 10px" target="_blank" rel="noopener" href="'+esc(x.maps)+'">الموقع</a>':'')+(S.live?'<button class="btn sec" style="padding:7px 10px" onclick="_dEd('+x.id+')">تعديل</button>':'')+'</div>'; }).join(''):'<div class="mu" style="padding:10px 0">سجّل أجهزة العميل ومواقعه — تفيدك في الصيانة الدورية. الفني يقدر يسجّلها من الموقع.</div>')+'</div>';
  h+='</div><div class="side">';
  h+='<div class="card f" style="display:flex;flex-direction:column;gap:8px"><span class="h3">ملاحظاتي (خاصة)</span><textarea id="c-nt" maxlength="1500" placeholder="مثال: يفضّل المواعيد بعد العصر · البوابة الخلفية"'+(S.live?'':' disabled')+'>'+esc(c.notes)+'</textarea><span class="mu">ما يشوفها العميل ولا الفني</span>'+(S.live?'<button class="btn sec" id="c-sv" onclick="_cSave()">حفظ الملاحظات</button>':'')+'</div>';
  if(S.live) h+='<div class="card f" style="display:flex;flex-direction:column;gap:8px"><span class="h3">بيانات العميل</span><div><label for="c-n">الاسم</label><input id="c-n" maxlength="80" value="'+esc(c.name)+'"></div><div><label for="c-e">الإيميل (اختياري)</label><input id="c-e" type="email" dir="ltr" maxlength="120" value="'+esc(c.email||'')+'" style="text-align:right"></div><div><label for="c-a">العنوان</label><input id="c-a" maxlength="200" value="'+esc(c.address||'')+'"></div><button class="btn sec" onclick="_cSave(1)">حفظ</button></div>';
  h+='</div></div>';
  A.innerHTML=h;
}
window._cBack=function(){ list(); };
window._cSave=function(all){ var b={notes:document.getElementById('c-nt').value}; if(all){ b.name=document.getElementById('c-n').value; b.address=document.getElementById('c-a').value; b.email=document.getElementById('c-e').value; }
  api('/api/customers/'+S.c.customer.id,{method:'PUT',body:JSON.stringify(b)}).then(function(){ toast('انحفظ'); _cOpen(S.c.customer.id); }).catch(function(e){ if(e)toast(e.message); }); };
window._dEd=function(id,kind){ var x=id?S.c.devices.find(function(z){return z.id===id;}):{kind:kind}; kind=x.kind; var site=kind==='site';
  var o=sheet('<b style="font-size:17px;color:#172554">'+(id?'تعديل':(site?'موقع جديد':'جهاز جديد'))+'</b><div><label for="d-n">'+(site?'اسم الموقع':'نوع الجهاز')+'</label><input id="d-n" maxlength="100" value="'+esc(x.name||'')+'" placeholder="'+(site?'مثال: فيلا النرجس':'مثال: مكيف سبليت')+'"></div>'
    +(site?'<div><label for="d-m">رابط الموقع (قوقل ماب)</label><input id="d-m" dir="ltr" maxlength="400" value="'+esc(x.maps||'')+'"></div>':'<div class="grid2"><div><label for="d-b">الماركة / الموديل</label><input id="d-b" maxlength="60" value="'+esc(x.brand||'')+'"></div><div><label for="d-q">العدد</label><input id="d-q" inputmode="numeric" maxlength="3" value="'+esc(x.qty||1)+'"></div></div><div class="grid2"><div><label for="d-p">المكان</label><input id="d-p" maxlength="80" value="'+esc(x.place||'')+'" placeholder="مثال: الصالة"></div><div><label for="d-l">آخر صيانة</label><input id="d-l" type="date" value="'+esc(x.last_service?String(x.last_service).slice(0,10):'')+'"></div></div>')
    +'<div><label for="d-x">ملاحظة</label><input id="d-x" maxlength="300" value="'+esc(x.notes||'')+'"></div><button class="btn pri" id="d-go">حفظ</button>'+(id?'<button class="btn dan" id="d-del">حذف</button>':'')+'<button class="btn" style="background:transparent;color:#64748b" onclick="document.getElementById(\'sh\').remove()">رجوع</button>');
  var g=function(i){ var e=document.getElementById(i); return e?e.value:undefined; };
  document.getElementById('d-go').onclick=function(){ var b=this; b.disabled=true; var cid=S.c.customer.id;
    api('/api/customers/'+cid+'/devices'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify({kind:kind,name:g('d-n'),brand:g('d-b'),qty:g('d-q'),place:g('d-p'),last_service:g('d-l'),maps:g('d-m'),notes:g('d-x')})}).then(function(){ o.remove(); toast('انحفظ'); _cOpen(cid); }).catch(function(e){ b.disabled=false; if(e)toast(e.message); }); };
  if(id) document.getElementById('d-del').onclick=function(){ if(!confirm('تحذف؟'))return; var cid=S.c.customer.id; api('/api/customers/'+cid+'/devices/'+id,{method:'DELETE'}).then(function(){ o.remove(); _cOpen(cid); }).catch(function(e){ if(e)toast(e.message); }); };
};
var id=parseInt(P.get('id')), ph=P.get('ph');
if(id) _cOpen(id);
else if(ph) api('/api/customers/by-phone/'+encodeURIComponent(ph)).then(function(r){ _cOpen(r.id); }).catch(function(e){ if(e)toast(e.message); list(); });
else list();
})();
</script>
