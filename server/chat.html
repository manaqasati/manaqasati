<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>
/* حارس فوري — يمنع ومضة الصفحة */
(function(){
  try{
    var t=localStorage.getItem('token');
    var u=JSON.parse(localStorage.getItem('user')||'{}');
    if(!t||!u||!u.id){ document.documentElement.style.visibility='hidden'; location.replace('/auth.html'); }
  }catch(e){}
})();
</script>

<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,interactive-widget=resizes-content">
<meta name="apple-itunes-app" content="app-id=6764307611">
<meta name="theme-color" content="#1e3a8a">
<title>المحادثات — مناقصة</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --p:#1e3a8a;--p2:#2563eb;--p-light:#dbeafe;--p-mid:#bfdbfe;
  --text:#1e293b;--muted:#64748b;--hint:#94a3b8;
  --border:#e6eefb;--bg:#f0f5ff;--white:#fff;
  --green:#16a34a;--red:#dc2626;--tick:#53bdeb;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;height:100%;overflow:hidden}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}

/* ═══ الهيكل: شاشة كاملة ثابتة ═══ */
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}

/* ═══ الرأس ═══ */
.hd{flex:0 0 auto;background:var(--p);color:#fff;padding:13px 15px;display:flex;align-items:center;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 13px);box-shadow:0 2px 8px rgba(15,23,42,.12);z-index:5}
.hd-btn{background:rgba(255,255,255,.13);border:none;color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.hd-btn:active{transform:scale(.92)}
.hd-info{flex:1;min-width:0}
.hd-t{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-s{font-size:10.5px;opacity:.68;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.hd-av{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;overflow:hidden}
.hd-av img{width:100%;height:100%;object-fit:cover}

/* ═══ الشاشات ═══ */
.screen{flex:1 1 auto;min-height:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}

/* ═══ قائمة المحادثات ═══ */
#listBody{flex:1 1 auto;min-height:0;overflow-y:auto;background:var(--white)}
.conv{display:flex;align-items:center;gap:13px;padding:13px 15px;cursor:pointer;border-bottom:1px solid var(--border);transition:.13s}
.conv:active{background:var(--bg)}
.conv-av{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0;overflow:hidden}
.conv-av img{width:100%;height:100%;object-fit:cover}
.conv-body{flex:1;min-width:0}
.conv-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.conv-name{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-time{font-size:10.5px;color:var(--hint);flex-shrink:0;font-weight:600}
.conv-last{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv-proj{font-size:10.5px;color:var(--p);font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-badge{background:var(--green);color:#fff;font-size:11px;font-weight:800;min-width:21px;height:21px;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0}

/* ═══ المحادثة ═══ */
#msgs{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:3px;background:var(--bg)}
.bub{max-width:78%;padding:10px 13px;font-size:14.5px;font-weight:500;line-height:1.72;word-break:break-word;overflow-wrap:anywhere;position:relative}

.me{align-self:flex-start;background:var(--p);color:#fff;border-radius:16px 16px 16px 5px}
.you{align-self:flex-end;background:var(--white);border:1px solid var(--border);border-radius:16px 16px 5px 16px}
.bub-who{font-size:10.5px;font-weight:800;opacity:.6;margin-bottom:2px}
.bub-meta{font-size:10px;opacity:.6;margin-top:3px;text-align:left;display:flex;align-items:center;justify-content:flex-end;gap:3px}
.tick{font-weight:900;letter-spacing:-2.5px;font-size:11.5px}
.bub-del{opacity:.55;font-style:italic}
.bub-q{background:rgba(0,0,0,.09);border-inline-start:3px solid currentColor;border-radius:7px;padding:5px 8px;margin-bottom:6px;font-size:11.5px;opacity:.85}
.bub-q-who{font-weight:800;margin-bottom:1px}
.bub-q-tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.bub img{max-width:100%;border-radius:11px;display:block;cursor:pointer}
.bub-file{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.08);border-radius:10px;padding:9px 11px;text-decoration:none;color:inherit;font-size:12.5px}
.daysep{align-self:center;background:rgba(30,58,138,.08);color:var(--muted);font-size:10.5px;font-weight:800;padding:4px 13px;border-radius:20px;margin:8px 0}
.projsep{align-self:center;max-width:92%;background:var(--white);color:var(--p);font-size:11px;font-weight:800;padding:6px 14px;border-radius:20px;margin:16px 0 6px;border:1px solid var(--p-mid);box-shadow:0 1px 4px rgba(30,58,138,.06);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}

/* ═══ شريط الرد ═══ */
#replyBar{display:none;align-items:center;gap:9px;background:var(--white);border-top:1px solid var(--border);padding:8px 13px;flex:0 0 auto}
#replyBar .rb-body{flex:1;min-width:0;border-inline-start:3px solid var(--p);padding-inline-start:9px}
#replyBar .rb-who{font-size:11px;font-weight:800;color:var(--p)}
#replyBar .rb-tx{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ═══ صندوق الإدخال ═══ */
#inputBar{flex:0 0 auto;display:flex;gap:9px;align-items:flex-end;background:var(--white);border-top:1px solid var(--border);padding:9px 12px calc(env(safe-area-inset-bottom,0px) + 9px)}
#inp{flex:1;padding:12px 16px;border:1.5px solid var(--border);border-radius:22px;font-family:inherit;font-size:14.5px;outline:none;background:var(--bg);resize:none;max-height:110px;line-height:1.5;transition:.16s}
#inp:focus{border-color:var(--p);background:var(--white);box-shadow:0 0 0 3px rgba(30,58,138,.07)}
.ib-btn{width:46px;height:46px;flex-shrink:0;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.16s;border:none}
.ib-attach{background:var(--bg);border:1.5px solid var(--border);color:var(--muted)}
.ib-mic{background:var(--p);border:none;color:#fff}
.voicep{display:flex;align-items:center;gap:9px;min-width:200px;max-width:240px;padding:2px 0}
.voicep .vp-btn{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;background:var(--p);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.voicep.me .vp-btn{background:#fff;color:var(--p)}
.voicep .vp-wave{flex:1;display:flex;align-items:center;gap:2px;height:30px}
.voicep .vp-wave i{flex:1;min-width:2px;border-radius:2px;background:#bcd0f0;transition:background .1s}
.voicep.me .vp-wave i{background:rgba(255,255,255,.4)}
.voicep .vp-wave i.on{background:var(--p)}
.voicep.me .vp-wave i.on{background:#fff}
.voicep .vp-t{flex-shrink:0;font-size:11px;font-variant-numeric:tabular-nums;opacity:.7;min-width:30px}
.ib-mic:active{transform:scale(.92)}
@keyframes recpulse{0%,100%{opacity:1}50%{opacity:.3}}
.ib-attach:active{transform:scale(.92);background:var(--p-light);color:var(--p)}
.ib-send{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 3px 11px rgba(30,58,138,.3)}
.ib-send:active{transform:scale(.92)}
.ib-send:disabled{opacity:.5;transform:none}

/* ═══ قائمة الإجراءات (ضغط مطوّل) ═══ */
#sheet{position:fixed;inset:0;z-index:400;background:rgba(15,23,42,.4);display:none;align-items:flex-end;justify-content:center;animation:fade .15s}
#sheet.on{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-card{background:var(--white);width:100%;max-width:470px;border-radius:22px 22px 0 0;overflow:hidden;animation:up .22s cubic-bezier(.4,0,.2,1);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px)}
.sheet-grip{width:38px;height:4px;background:var(--border);border-radius:3px;margin:10px auto}
.sheet-btn{display:flex;align-items:center;gap:13px;width:100%;padding:15px 20px;background:none;border:none;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-align:right;color:var(--text);border-bottom:1px solid var(--border)}
.sheet-btn:active{background:var(--bg)}
.sheet-btn.danger{color:var(--red)}
.sheet-btn.cancel{border-bottom:none;justify-content:center;color:var(--muted)}

/* ═══ حالات ═══ */
.empty{text-align:center;padding:50px 26px;color:var(--muted);font-size:13.5px;line-height:1.9;margin:auto}
.empty-ic{font-size:38px;margin-bottom:10px}
.empty-t{font-weight:800;color:var(--text);font-size:15px;margin-bottom:4px}
.load{text-align:center;padding:34px;color:var(--muted);font-size:13px}
.sk{height:70px;background:linear-gradient(90deg,var(--bg) 25%,#e8eefb 50%,var(--bg) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:12px;margin:9px 14px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ═══ توست ═══ */
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:700;z-index:600;opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--green)}
#toast.err{background:var(--red)}
/* ── الكمبيوتر: القائمة يمين والمحادثة جنبها ── */
#dkEmpty{display:none}
@media(min-width:1024px){
  #app{flex-direction:row;gap:16px;padding:18px;background:#eef3fb;box-sizing:border-box}
  #scList{display:flex!important;flex:0 0 380px;border-radius:20px;border:1px solid var(--border);overflow:hidden;background:var(--white,#fff)}
  #scChat,#scNew{flex:1 1 auto;border-radius:20px;border:1px solid var(--border);overflow:hidden;background:var(--white,#fff)}
  #scChat:not(.on),#scNew:not(.on){display:none}
  #dkEmpty{display:flex;flex:1 1 auto;border-radius:20px;border:1px dashed #c9d6ea;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#64748b;font-weight:800;font-size:15px;background:rgba(255,255,255,.5)}
  #scChat.on~#dkEmpty,#scNew.on~#dkEmpty{display:none}
  #scChat .hd .hd-btn:first-child{display:none}
  .conv.dk-on{background:#eff6ff!important}
}
[data-theme="dark"] #app{background:#0b1220}
/* ═══ محادثة «فريق مناقصة» ═══ */
.sup-av{background:linear-gradient(135deg,#0f2544,#1e3a8a)!important;color:#fff!important;font-family:Cairo,Tajawal,sans-serif;font-weight:900}
.sup-pin{background:#f5f9ff;border-bottom:1px solid var(--p-mid)!important;box-shadow:inset -3px 0 0 var(--p2)}
.sup-tag{font-size:9.5px;font-weight:800;color:#1d4ed8;background:#eaf1fe;padding:1px 7px;border-radius:10px;vertical-align:middle}
.sup-sys{max-width:90%;text-align:center;line-height:1.6;white-space:normal}
.sup-sys.ok{background:#dcfce7;color:#166534}
.sup-hello{max-width:86%}
.sup-chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end;margin:6px 0 4px;align-self:flex-end;max-width:94%}
.sup-chips button{border:1.5px solid var(--p-mid);background:var(--white);color:var(--p2);border-radius:999px;padding:9px 14px;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer}
.sup-chips button:active{transform:scale(.96);background:var(--p-light)}
.sup-hint{align-self:center;font-size:11.5px;color:var(--muted);font-weight:700;text-align:center;margin:8px 10px}
.sup-img{max-width:240px!important;max-height:260px;object-fit:cover;border-radius:11px;display:block;cursor:zoom-in}
.sup-file{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.06);border-radius:12px;padding:9px 10px;text-decoration:none;color:inherit;min-width:210px;max-width:260px}
.me .sup-file{background:rgba(255,255,255,.14)}
.sf-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10.5px;flex-shrink:0}
.sf-tx{display:flex;flex-direction:column;min-width:0}.sf-tx b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sf-tx small{font-size:10.5px;opacity:.75}
.sup-tx{white-space:pre-wrap}
.sup-prog{height:5px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden;margin-top:7px}.sup-prog i{display:block;height:5px;background:#fff;border-radius:9px;transition:width .15s}
.sup-pend{opacity:.92}.sup-pend.fail{background:#fee2e2!important;color:#7f1d1d!important}
.sup-failbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px;font-weight:800}
.sup-failbar button{border:0;border-radius:8px;padding:5px 11px;font-family:inherit;font-weight:900;font-size:12px;cursor:pointer;background:#b91c1c;color:#fff}
.sup-failbar button+button{background:#fff;color:#7f1d1d;border:1px solid #fecaca}
.sup-rate{align-self:center;background:var(--white);border:1px solid var(--border);border-radius:16px;padding:12px 16px;text-align:center;font-weight:800;font-size:13px;margin:8px 0}
.sup-rate-b{display:flex;gap:8px;margin-top:8px}.sup-rate-b button{border:1px solid var(--border);background:var(--bg);border-radius:11px;padding:8px 14px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;color:var(--text)}
.sup-sh-t{font-weight:900;font-size:16px;padding:2px 20px 10px}
.sup-sh-h{font-size:11.5px;font-weight:800;color:var(--muted);padding:10px 20px 2px}
.sup-opts{display:flex;justify-content:space-around;padding:4px 10px 12px}
.sup-opt{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font-family:inherit;font-size:12px;font-weight:800;color:var(--text);cursor:pointer;width:78px}
.sup-opt span{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.sup-sh-n{margin:0 16px 8px;background:var(--bg);border-radius:12px;padding:9px 12px;font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.8}
#supWa{flex:0 0 auto;text-align:center;font-size:11.5px;color:var(--muted);font-weight:700;background:var(--white);padding:0 12px calc(env(safe-area-inset-bottom,0px) + 7px);margin-top:-4px}
#supWa button{background:none;border:0;color:#16a34a;font-family:inherit;font-weight:900;font-size:11.5px;text-decoration:underline;cursor:pointer;padding:0}
.sup-light{position:fixed;inset:0;z-index:700;background:rgba(2,6,23,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.sup-light img{max-width:94vw;max-height:80vh;border-radius:10px}
.sup-light a{color:#fff;font-weight:800;font-size:14px;background:rgba(255,255,255,.14);padding:8px 18px;border-radius:10px;text-decoration:none}
.sup-light button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:18px;cursor:pointer}
body.emb #scList,body.emb #dkEmpty,body.emb #scNew{display:none!important}
body.emb #app{padding:0!important;background:var(--bg)!important}
body.emb #scChat{display:flex!important;border-radius:0!important;border:0!important}
/* ═══ الوضع الليلي ═══ */
[data-theme="dark"]{--text:#e6edf8;--muted:#9fb0cc;--hint:#7b8cab;--border:#24365e;--bg:#0b1428;--white:#16233f;--p-light:#1d2c4d;--p-mid:#2b4377;--card:#16233f}
[data-theme="dark"] body{background:#0b1428}
[data-theme="dark"] .hd{background:#0f1a33}
[data-theme="dark"] .daysep{background:#1d2c4d;color:#c7d2fe}
[data-theme="dark"] .projsep{background:#16233f;color:#93c5fd}
[data-theme="dark"] .me{background:#2563eb}
[data-theme="dark"] .sup-pin{background:#13213d}
[data-theme="dark"] .sup-sys.ok{background:#14532d;color:#bbf7d0}
[data-theme="dark"] .sup-chips button{color:#93c5fd}
[data-theme="dark"] .sup-tag{background:#1d2c4d;color:#93c5fd}
</style>
<script src="/wafix.js?v=1"></script>
</head>
<body>
<div id="app">

  <!-- ══ شاشة قائمة المحادثات ══ -->
  <div class="screen on" id="scList">
    <div class="hd">
      <button class="hd-btn" onclick="goBackDash()" title="رجوع">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="hd-info"><div class="hd-t">المحادثات</div><div class="hd-s" id="listSub">جاري التحميل...</div></div>
      <button class="hd-btn" onclick="openNew()" title="محادثة جديدة">
        <svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <div id="listBody"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  </div>

  <!-- ══ شاشة محادثة جديدة (بحث) ══ -->
  <div class="screen" id="scNew">
    <div class="hd">
      <button class="hd-btn" onclick="closeNew()" title="رجوع">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="hd-info"><div class="hd-t">محادثة جديدة</div><div class="hd-s">ابحث عن مزوّد بالاسم أو التخصص</div></div>
    </div>
    <div style="flex:0 0 auto;padding:12px 14px;background:var(--white);border-bottom:1px solid var(--border)">
      <input id="searchInp" placeholder="اكتب اسم المزوّد أو التخصص..." style="width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:22px;font-family:inherit;font-size:14.5px;outline:none;background:var(--bg)">
    </div>
    <div id="searchBody" style="flex:1 1 auto;min-height:0;overflow-y:auto;background:var(--white)">
      <div class="empty"><div class="empty-ic">🔍</div><div class="empty-t">ابحث عن مزوّد</div><div>اكتب اسمه أو تخصصه (مثل: زجاج، كهرباء)</div></div>
    </div>
  </div>

  <!-- ══ شاشة المحادثة ══ -->
  <div class="screen" id="scChat">
    <div class="hd">
      <button class="hd-btn" onclick="backToList()" title="رجوع">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="hd-av" id="chAv">؟</div>
      <div class="hd-info"><div class="hd-t" id="chName">—</div><div class="hd-s" id="chProj"></div></div>
      <button class="hd-btn" id="blockBtn" onclick="toggleBlock()" title="حظر">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
      </button>
    </div>

<div id="toast"></div>

<script>
'use strict';
var API='';
var token=localStorage.getItem('token')||'';
var user={};
try{ user=JSON.parse(localStorage.getItem('user')||'{}'); }catch(e){}
if(!token||!user.id){ location.replace('/auth.html'); }
// الدور الفعلي: يحترم الوضع النشط (activeMode) لأصحاب الحسابين — نفس منطق effRole في باقي الصفحات
var isProvider=(function(u){ var m=null; try{m=(localStorage.getItem('activeMode')||((JSON.parse(localStorage.getItem('user')||'{}')||{}).last_mode)||'');}catch(e){} if(m==='provider'&&(u.role==='provider'||u.can_provide))return true; if(m==='client'&&(u.role==='client'||u.can_request))return false; return u.role==='provider'; })(user);

var convs=[], msgs=[], curReq=null, curWith=null, curName='', curProj='';
var replyCtx=null, pendAttach=null, sending=false, poll=null, blocked=false, _openedReq=0, _msgsSig='';

function hdr(){ return {headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},cache:'no-store'}; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
// رابط آمن فقط (http/https أو مسار داخلي أو صورة data)
function _safeUrl(u){u=String(u==null?'':u).trim();return /^(https?:\/\/|\/(?!\/)|data:image\/)/i.test(u)&&!/["'<>`\s]/.test(u)?u:'';}
// نص آمن كوسيط JS داخل onclick (بدون علامات تنصيص حوله)
function _jsa(s){return esc(JSON.stringify(String(s==null?'':s)));}
function toast(m,t){ var e=document.getElementById('toast'); if(!e)return; e.textContent=m; e.className='on '+(t||''); setTimeout(function(){e.className='';},2400); }
function api(path,opts){
  return fetch(API+path,Object.assign({},hdr(),opts||{})).then(function(r){
    if(r.status===401){ toast('انتهت جلستك','err'); setTimeout(function(){ try{localStorage.removeItem('token');localStorage.removeItem('user');}catch(e){} try{ if(window.ReactNativeWebView&&window.ReactNativeWebView.postMessage) window.ReactNativeWebView.postMessage(JSON.stringify({type:'AUTH_LOGOUT'})); }catch(e){} location.replace('/auth.html');},1200); throw new Error('401'); }
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  });
}
function ago(d){
  if(!d)return'';
  var s=Math.floor((Date.now()-new Date(d).getTime())/1000);
  if(s<60)return'الآن';
  if(s<3600)return Math.floor(s/60)+' د';
  if(s<86400)return Math.floor(s/3600)+' س';
  if(s<604800)return Math.floor(s/86400)+' يوم';
  return new Date(d).toLocaleDateString('ar-SA-u-nu-latn-ca-gregory',{day:'numeric',month:'short'});
}
function dayLabel(d){
  var dt=new Date(d),now=new Date();
  var f=function(x){return new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();};
  var diff=(f(now)-f(dt))/86400000;
  if(diff===0)return'اليوم';
  if(diff===1)return'أمس';
  return dt.toLocaleDateString('ar-SA-u-nu-latn-ca-gregory',{day:'numeric',month:'long'});
}
function goBackDash(){
  // ارجع لنقطة الانطلاق (تفاصيل المشروع الذي جئت منه) إن وُجدت
  var back='';
  try{ back=sessionStorage.getItem('mnq_chat_back')||''; }catch(e){}
  if(back){ try{sessionStorage.removeItem('mnq_chat_back');}catch(e){} location.href=back; return; }
  var dash=isProvider?'/dashboard-provider.html':'/dashboard-client.html';
  var r=parseInt(_openedReq)||curReq||0;
  if(r&&!isProvider){ location.href=dash+'#detail/'+r; return; }
  location.href=dash;
}

/* ═══ قائمة المحادثات ═══ */
function loadList(){
  loadSupPin();
  api(isProvider?'/api/provider/conversations':'/api/client/conversations').then(function(d){
    convs=Array.isArray(d)?d:[];
    renderList();
  }).catch(function(){
    document.getElementById('listBody').innerHTML='<div class="empty"><div class="empty-ic">📡</div><div class="empty-t">تعذّر التحميل</div><div>تحقّق من اتصالك</div><button onclick="loadList()" style="margin-top:14px;background:var(--p);color:#fff;border:none;padding:10px 24px;border-radius:10px;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer">حاول مرة ثانية</button></div>';
  });
}
function renderList(){
  var el=document.getElementById('listBody');
  var sub=document.getElementById('listSub');
  if(!convs.length){
    if(sub)sub.textContent='لا توجد محادثات';
    el.innerHTML='<div class="empty"><div class="empty-ic">💬</div><div class="empty-t">لا توجد محادثات بعد</div><div>'+(isProvider?'قدّم عرضاً على مشروع لبدء محادثة مع العميل':'ستظهر هنا محادثاتك مع المزوّدين')+'</div></div>';
    _paintSupPin();
    return;
  }
  var unreadTotal=convs.reduce(function(a,c){return a+(parseInt(c.unread)||0);},0);
  if(sub)sub.textContent=convs.length+' محادثة'+(unreadTotal?' · '+unreadTotal+' غير مقروءة':'');
  el.innerHTML=convs.map(function(c){
    var isAdm=(!isProvider && !!c.is_admin);
    var nm=isProvider?(c.client_name||'عميل'):(c.provider_name||'مزوّد');
    var img=isProvider?c.client_image:c.provider_image;
    var wid=isProvider?c.client_id:c.provider_id;
    var un=parseInt(c.unread)||0;
    var av=isAdm?'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>':((img&&/^(https?:|data:)/.test(img))?'<img loading="lazy" src="'+esc(img)+'">':esc(nm.charAt(0)||'؟'));
    return '<div class="conv" onclick="openChat('+c.request_id+','+wid+','+_jsa(nm)+','+_jsa(c.request_title||'')+')">'
      +'<div class="conv-av"'+(isAdm?' style="background:linear-gradient(135deg,#1e3a8a,#1d4ed8);color:#fff"':'')+'>'+av+'</div>'
      +'<div class="conv-body">'
        +'<div class="conv-top"><div class="conv-name">'+esc(nm)+(isAdm?' <span style="font-size:9px;font-weight:800;color:#1d4ed8;background:#eaf1fe;padding:1px 6px;border-radius:10px">رسمي</span>':'')+'</div><div class="conv-time">'+ago(c.last_time)+'</div></div>'
        +'<div class="conv-last">'+esc(String(c.last_message||'لا رسائل بعد').slice(0,58))+'</div>'
        +'<div class="conv-proj">'+(isAdm?'🛡️ رسالة من إدارة المنصة':'📁 '+esc(c.request_title||'مشروع'))+'</div>'
      +'</div>'
      +(un?'<div class="conv-badge">'+un+'</div>':'')
    +'</div>';
  }).join('');
  _paintSupPin();
}

/* ═══ محادثة جديدة: بحث عن مزوّد ═══ */
var searchTimer=null;
function openNew(){
  document.getElementById('scList').classList.remove('on');
  document.getElementById('scNew').classList.add('on');
  history.pushState({v:'new'},'','#new');
  setTimeout(function(){ var s=document.getElementById('searchInp'); if(s)s.focus(); },120);
}
function closeNew(){
  document.getElementById('scNew').classList.remove('on');
  document.getElementById('scList').classList.add('on');
  if(location.hash)history.replaceState(null,'',location.pathname);
}
function doSearch(q){
  var body=document.getElementById('searchBody');
  if(!q||q.length<2){ body.innerHTML='<div class="empty"><div class="empty-ic">🔍</div><div class="empty-t">ابحث عن مزوّد</div><div>اكتب حرفين على الأقل</div></div>'; return; }
  body.innerHTML='<div class="load">جاري البحث...</div>';
  api('/api/providers?q='+encodeURIComponent(q)).then(function(d){
    var list=Array.isArray(d)?d.slice(0,30):[];
    if(!list.length){ body.innerHTML='<div class="empty"><div class="empty-ic">🤷</div><div class="empty-t">لا نتائج</div><div>جرّب كلمة أخرى (اسم أو تخصص)</div></div>'; return; }
    body.innerHTML=list.map(function(p){
      var av=(p.profile_image&&/^(https?:|data:)/.test(p.profile_image))?'<img loading="lazy" src="'+esc(p.profile_image)+'">':esc((p.name||'؟').charAt(0));
      var spec=(p.specialties&&p.specialties.length)?p.specialties.slice(0,2).join(' · '):'';
      var rate=(p.avg_rating>0)?('⭐ '+p.avg_rating.toFixed(1)+' ('+p.review_count+')'):'مزوّد جديد';
      return '<div class="conv" onclick="startNew('+p.id+','+_jsa(p.name||'مزوّد')+')">'
        +'<div class="conv-av">'+av+'</div>'
        +'<div class="conv-body">'
          +'<div class="conv-name">'+esc(p.name||'مزوّد')+'</div>'
          +(spec?'<div class="conv-proj">'+esc(spec)+'</div>':'')
          +'<div class="conv-last">'+esc(p.city||'')+(p.city&&rate?' · ':'')+rate+'</div>'
        +'</div>'
        +'<svg width="16" height="16" fill="none" stroke="var(--p)" stroke-width="2.5" viewBox="0 0 24 24" style="flex-shrink:0"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>'
      +'</div>';
    }).join('');
  }).catch(function(){ body.innerHTML='<div class="empty"><div class="empty-ic">📡</div><div class="empty-t">تعذّر البحث</div><div>تحقّق من اتصالك</div></div>'; });
}
// بدء محادثة مع مزوّد — يفتح المحادثة القائمة إن وُجدت، وإلا يبدأ جديدة
function startNew(provId,provName){
  if(isProvider){ toast('المزوّدون يراسلون العملاء عبر المشاريع','err'); return; }
  // 1) هل بيننا محادثة قائمة؟ افتحها مباشرة (بدل إنشاء مكرّرة)
  var existing=convs.filter(function(c){ return String(c.provider_id)===String(provId); });
  if(existing.length===1){
    closeNew();
    openChat(existing[0].request_id,provId,provName,existing[0].request_title||'');
    return;
  }
  if(existing.length>1){
    // عدة محادثات مع نفس المزوّد (مشاريع مختلفة) → اختر
    var s=document.getElementById('sheet');
    s.innerHTML='<div class="sheet-card"><div class="sheet-grip"></div>'
      +'<div style="padding:6px 20px 10px;font-size:12.5px;color:var(--muted);font-weight:700">لديكما محادثات على عدة مشاريع — اختر:</div>'
      +existing.slice(0,8).map(function(c){
        return '<button class="sheet-btn" onclick="closeSheet();closeNew();openChat('+c.request_id+','+provId+','+_jsa(provName)+','+_jsa(c.request_title||'')+')"><span style="font-size:17px">💬</span> '+esc(String(c.request_title||'مشروع').slice(0,40))+'</button>';
      }).join('')
      +'<button class="sheet-btn cancel" onclick="closeSheet()">إلغاء</button></div>';
    s.classList.add('on');
    return;
  }
  // 2) لا توجد محادثة سابقة → ابدأ جديدة على أحد مشاريعك
  api('/api/requests/my').then(function(rs){
    var open=(Array.isArray(rs)?rs:[]).filter(function(r){return r.status==='open'||r.status==='in_progress';});
    if(!open.length){
      if(confirm('لبدء محادثة تحتاج مشروعاً منشوراً.\nهل تريد نشر مشروع الآن؟')) location.href='/dashboard-client.html#new';
      return;
    }
    if(open.length===1){ location.href='/chat?req='+open[0].id+'&with='+provId+'&name='+encodeURIComponent(provName); return; }
    // أكثر من مشروع → اختر
    var s=document.getElementById('sheet');
    var btns=open.slice(0,8).map(function(r){
      return '<button class="sheet-btn" onclick="location.href=\'/chat?req='+r.id+'&with='+provId+'&name='+encodeURIComponent(provName).replace(/'/g,'%27')+'\'"><span style="font-size:17px">📁</span> '+esc(String(r.title||'مشروع').slice(0,40))+'</button>';
    }).join('');
    s.innerHTML='<div class="sheet-card"><div class="sheet-grip"></div>'
      +'<div style="padding:6px 20px 10px;font-size:12.5px;color:var(--muted);font-weight:700">اختر المشروع الذي تريد مراسلته بشأنه:</div>'
      +btns+'<button class="sheet-btn cancel" onclick="closeSheet()">إلغاء</button></div>';
    s.classList.add('on');
  }).catch(function(){ toast('تعذّر جلب مشاريعك','err'); });
}
(function(){
  var s=document.getElementById('searchInp');
  if(s)s.addEventListener('input',function(){ var v=this.value.trim(); clearTimeout(searchTimer); searchTimer=setTimeout(function(){doSearch(v);},350); });
})();

/* ═══ فتح محادثة ═══ */
function openChat(reqId,withId,name,proj){
  if(supMode)closeSupport();
  try{ [].forEach.call(document.querySelectorAll('.conv'),function(e){ e.classList.toggle('dk-on', (e.getAttribute('onclick')||'').indexOf('openChat('+reqId+','+withId+',')===0); }); }catch(_e){}
  window._recovered=false; _msgsSig='';
  curReq=reqId; curWith=withId; curName=name||''; curProj=proj||''; window._remindedBid=false;
  var _bb=document.getElementById('bidBar');
  if(_bb){
    _bb.innerHTML='';
    if(isProvider&&(reqId||withId)){
      var _rid=reqId, _cid=withId;
      api('/api/provider/chat-bid-context?req='+(reqId||'')+'&client='+(withId||'')).then(function(ctx){
        if(curReq!==_rid||curWith!==_cid)return; // تغيّرت المحادثة
        if(!ctx||ctx.action==='none'){ _bb.innerHTML=''; return; }
        var label,bg='#1e3a8a';
        if(ctx.action==='edit'){ label='✓ عرضك مقدّم على هذا المشروع — عدّله'; bg='#0f766e'; }
        else if(ctx.action==='bid'){ label='قدّم عرض سعر على هذا المشروع'; }
        else if(ctx.action==='bid_other'){ label='قدّم عرض على مشروعه المفتوح: '+esc(String(ctx.title||'مشروع').slice(0,26)); }
        else { _bb.innerHTML=''; return; }
        _bb.innerHTML='<button onclick="location.href=\'/dashboard-provider.html?bid='+ctx.req_id+'\'" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:'+bg+';color:#fff;border:none;padding:13px;font-family:Tajawal,sans-serif;font-weight:800;font-size:13.5px;cursor:pointer;border-top:1px solid rgba(255,255,255,.1)"><svg width="17" height="17" fill="none" stroke="#fff" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg><span>'+label+'</span></button>';
      }).catch(function(){ _bb.innerHTML=''; });
    } else if(!isProvider&&(reqId||withId)){
      var _r2=reqId,_c2=withId;
      api('/api/client/quote-context?req='+(reqId||'')+'&provider='+(withId||'')).then(function(ctx){
        if(curReq!==_r2||curWith!==_c2)return;
        window._qctx=ctx||{open:[]};
        if(ctx&&ctx.cur_open&&!ctx.cur_bid){
          _bb.innerHTML='<div style="background:#fff7ed;border-top:1px solid #fed7aa;padding:11px 14px;display:flex;align-items:center;gap:10px"><div style="flex:1;font-size:12.5px;color:#9a3412;font-weight:700">هذا المزوّد لم يقدّم عرضاً رسمياً على مشروعك بعد</div><button onclick="askQuote()" style="background:#ea580c;color:#fff;border:none;border-radius:9px;padding:8px 14px;font-family:Tajawal,sans-serif;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap">ذكّره بالعرض</button></div>';
        } else if(ctx&&(ctx.open||[]).length){
          _bb.innerHTML='<button onclick="askQuote()" style="display:flex;align-items:center;justify-content:center;gap:7px;width:100%;background:var(--card);color:var(--p);border:none;border-top:1px solid var(--border);padding:11px;font-family:Tajawal,sans-serif;font-weight:800;font-size:13px;cursor:pointer">📋 ذكّره يقدّم عرضه رسمياً على مشروع</button>';
        } else { _bb.innerHTML=''; }
      }).catch(function(){ _bb.innerHTML=''; });
    }
  }
  document.getElementById('chName').textContent=curName;
  var _cp=curProj||'';
  var _cpDirect=(_cp==='محادثة مباشرة')||/^محادثة مع/.test(_cp);
  document.getElementById('chProj').textContent=(_cp&&!_cpDirect)?('📁 '+_cp):'';
  var av=document.getElementById('chAv');
  var c=convs.filter(function(x){return x.request_id==reqId;})[0];
  var img=c?(isProvider?c.client_image:c.provider_image):null;
  av.innerHTML=(img&&/^(https?:|data:)/.test(img))?'<img src="'+esc(img)+'">':esc((curName||'؟').charAt(0));
  document.getElementById('scList').classList.remove('on');
  document.getElementById('scChat').classList.add('on');
  history.pushState({v:'chat',req:reqId,w:withId},'','#c'+reqId+'-'+withId);
  msgs=[]; document.getElementById('msgs').innerHTML='<div class="load">جاري التحميل...</div>';
  loadMsgs(); checkBlock();
  clearInterval(poll);
  poll=setInterval(function(){ if(document.hidden||!curReq)return; if(window._wsLive&&(++_pollTick%5))return; loadMsgs(true); },6000);
}
function backToList(){
  if(_isEmbed){ supEmbedClose(); return; }
  if(supMode)closeSupport();
  clearInterval(poll); curReq=null; curWith=null; cancelReply();
  document.getElementById('scChat').classList.remove('on');
  document.getElementById('scList').classList.add('on');
  if(location.hash)history.replaceState(null,'',location.pathname);
  loadList();
}
window.addEventListener('popstate',function(ev){
  // رجوع من نافذة منبثقة (up.js) يرجّعنا لنفس المحادثة — لا نطلع للقائمة
  var st=(ev&&ev.state)||{};
  if(supMode&&st.v==='sup')return;
  if(curReq&&st.v==='chat'&&String(st.req)===String(curReq))return;
  if(document.getElementById('scChat').classList.contains('on'))backToList();
  else if(document.getElementById('scNew').classList.contains('on'))closeNew();
  else goBackDash();

function extractWaveform(blob,cb){
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC){cb('');return;}
    var ac=new AC(); var fr=new FileReader();
    fr.onload=function(e){
      ac.decodeAudioData(e.target.result,function(buf){
        var data=buf.getChannelData(0), N=40, block=Math.max(1,Math.floor(data.length/N)), peaks=[];
        for(var i=0;i<N;i++){ var st=i*block,sum=0; for(var j=0;j<block;j++){ var v=data[st+j]||0; sum+=v*v; } peaks.push(Math.sqrt(sum/block)); }
        var mx=Math.max.apply(null,peaks)||1;
        try{ac.close();}catch(_){}
        cb(peaks.map(function(x){return Math.round(x/mx*100);}).join(','));
      },function(){ try{ac.close();}catch(_){}; cb(''); });
    };
    fr.readAsArrayBuffer(blob);
  }catch(e){ cb(''); }
}
function vpHtml(url,wave,isMe){
  var bars=String(wave||'').split(',').filter(function(x){return x!==''&&!isNaN(x);});
  if(bars.length<6) bars='15,35,55,25,45,70,40,60,30,50,65,45,35,55,70,50,40,30,45,60,35,50,40,55,30,45,60,40,50,35,45,60,50,35,40,55,45,30,40,50'.split(',');
  var dim=isMe?'rgba(255,255,255,.4)':'#bcd0f0';
  var barsHtml=bars.map(function(hh){return '<i style="height:'+Math.max(12,parseInt(hh))+'%"></i>';}).join('');
  return '<div class="voicep'+(isMe?' me':'')+'" data-url="'+esc(url)+'" onclick="vpToggle(this,event)"><button class="vp-btn" type="button">▶</button><div class="vp-wave">'+barsHtml+'</div><span class="vp-t">0:00</span></div>';
}
var _vpAudio=null,_vpCur=null;
function vpToggle(el,ev){
  if(ev)ev.stopPropagation();
  var url=el.getAttribute('data-url');
  if(_vpCur&&_vpCur!==el){ _vpStop(_vpCur); }
  if(el.classList.contains('playing')){ if(_vpAudio)_vpAudio.pause(); return; }
  if(!_vpAudio||_vpCur!==el){ if(_vpAudio){try{_vpAudio.pause();}catch(_){}} _vpAudio=new Audio(url); _vpCur=el;
    _vpAudio.onended=function(){ _vpStop(el); };
    _vpAudio.ontimeupdate=function(){ _vpProg(el,_vpAudio.currentTime,_vpAudio.duration||0); };
  }
  el.classList.add('playing'); el.querySelector('.vp-btn').textContent='⏸';
  _vpAudio.play().catch(function(){});
}
function _vpStop(el){ el.classList.remove('playing'); var b=el.querySelector('.vp-btn'); if(b)b.textContent='▶'; _vpProg(el,0,0); }
function _vpProg(el,cur,dur){
  var pct=dur>0?(cur/dur):0; var bars=el.querySelectorAll('.vp-wave i');
  for(var i=0;i<bars.length;i++){ bars[i].classList.toggle('on', (i/bars.length)<=pct); }
  var t=el.querySelector('.vp-t'); if(t){ var sec=Math.floor(cur||0); t.textContent=Math.floor(sec/60)+':'+('0'+(sec%60)).slice(-2); }
  if(el.classList.contains('playing')&&_vpAudio&&_vpAudio.paused){ el.classList.remove('playing'); var b=el.querySelector('.vp-btn'); if(b)b.textContent='▶'; }
}
var _rec=null,_recChunks=[],_recTimer=null,_recStart=0,_recStream=null;
function toggleSendMic(){
  var hasText=((document.getElementById('inp')||{}).value||'').trim().length>0;
  var sb=document.getElementById('sendBtn'), mb=document.getElementById('micBtn');

function startRec(){
  if(!navigator.mediaDevices||!window.MediaRecorder){ toast('التسجيل الصوتي غير مدعوم في متصفحك','err'); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    _recStream=stream; _recChunks=[];
    var mime=(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/webm'))?'audio/webm':((MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/mp4'))?'audio/mp4':'');
    try{ _rec=new MediaRecorder(stream, mime?{mimeType:mime}:undefined); }catch(e){ _rec=new MediaRecorder(stream); }
    _rec.ondataavailable=function(e){ if(e.data&&e.data.size>0)_recChunks.push(e.data); };
    _rec.start(); _recStart=Date.now();
    var ib=document.getElementById('inputBar'), rb=document.getElementById('recBar');
    if(ib)ib.style.display='none'; if(rb)rb.style.display='flex';
    _recTimer=setInterval(function(){
      var sec=Math.floor((Date.now()-_recStart)/1000);
      var t=document.getElementById('recTime'); if(t)t.textContent=Math.floor(sec/60)+':'+('0'+(sec%60)).slice(-2);
      if(sec>=300) stopRec(true);
    },300);
  }).catch(function(){ toast('تعذّر الوصول للميكروفون — فعّل الإذن','err'); });
}
function _recCleanup(){
  clearInterval(_recTimer); _recTimer=null;
  if(_recStream){ _recStream.getTracks().forEach(function(t){t.stop();}); _recStream=null; }
  var ib=document.getElementById('inputBar'), rb=document.getElementById('recBar');
  if(rb)rb.style.display='none'; if(ib)ib.style.display='flex';
}
function cancelRec(){ try{ if(_rec&&_rec.state!=='inactive'){ _rec.onstop=function(){}; _rec.stop(); } }catch(e){} _recCleanup(); }
function stopRec(send){
  if(!_rec||_rec.state==='inactive'){ _recCleanup(); return; }
  var dur=Math.floor((Date.now()-_recStart)/1000);
  _rec.onstop=function(){
    _recCleanup();
    if(!send||!_recChunks.length) return;
    if(dur<1){ toast('التسجيل قصير جداً','err'); return; }
    var blob=new Blob(_recChunks,{type:(_recChunks[0]&&_recChunks[0].type)||'audio/webm'});
    var ext=(blob.type.indexOf('mp4')>=0)?'m4a':'webm';
    extractWaveform(blob,function(wf){
      var rd=new FileReader();
      rd.onload=function(e){ pendAttach={data:e.target.result,type:blob.type||'audio/webm',name:'voice-'+dur+'s.'+ext,waveform:wf}; sendMsg(); };
      rd.readAsDataURL(blob);
    });
  };
  try{ _rec.stop(); }catch(e){ _recCleanup(); }
}
function attachFile(inp){
  var f=inp.files&&inp.files[0]; inp.value='';
  if(!f)return;
  if(f.size>10*1024*1024){ toast('الحجم الأقصى 10MB','err'); return; }
  toast('جاري الرفع...');
  var go=function(d){ pendAttach={data:d,type:f.type||'application/octet-stream',name:f.name}; sendMsg(); };
  if(/^image\//.test(f.type))compressImg(f,go);
  else { var r=new FileReader(); r.onload=function(e){go(e.target.result);}; r.readAsDataURL(f); }
}
function compressImg(file,cb){
  var r=new FileReader();
  r.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var max=1280,w=img.width,h=img.height;
      if(w>max||h>max){ if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;} }
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      try{ cb(c.toDataURL('image/jpeg',0.8)); }catch(err){ cb(e.target.result); }
    };
    img.onerror=function(){cb(e.target.result);};
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

  s.innerHTML='<div class="sheet-card"><div class="sheet-grip"></div><div class="sup-sh-t">أرسل لفريق مناقصة</div><div class="sup-opts">'
    +opt(I.img,'#e0f2fe','#0369a1','صور',"closeSheet();document.getElementById('supImg').click()")
    +opt(I.cam,'#f1f5f9','#334155','كاميرا',"closeSheet();document.getElementById('supCam').click()")
    +opt(I.file,'#e0e7ff','#3730a3','ملف أو مخطط',"closeSheet();document.getElementById('supFile').click()")
    +(hasLinks?opt(I.link,'#dcfce7','#166534','اربط مشروع','supLinkSheet()'):'')
    +'</div><div class="sup-sh-n">يقبل: صور · PDF · مخططات DWG/DXF · Excel · Word<br>لين 10 ملفات مرة وحدة · كل ملف لين 30 ميجا</div>'
    +'<button class="sheet-btn cancel" onclick="closeSheet()">إلغاء</button></div>';
  s.classList.add('on');
}
function supLinkSheet(){
  var L=sup.links||{}, s=document.getElementById('sheet'), cur=sup.thread||{};
  var row=function(k,x,ic){ var on=cur.link_kind===k&&String(cur.link_id)===String(x.id); return '<button class="sheet-btn" onclick="supLink(\''+k+'\','+x.id+')"><span style="font-size:17px">'+ic+'</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(String(x.title||'').slice(0,50))+'</span>'+(on?'<span style="color:var(--green);font-weight:900;font-size:12px">مربوطة ✓</span>':'')+'</button>'; };
  var h='<div class="sheet-card" style="max-height:80vh;overflow-y:auto"><div class="sheet-grip"></div><div class="sup-sh-t">اربط المحادثة بـ</div>';
  if((L.req||[]).length)h+='<div class="sup-sh-h">مشاريعي</div>'+L.req.map(function(x){return row('req',x,'📁');}).join('');
  if((L.bid||[]).length)h+='<div class="sup-sh-h">عروضي</div>'+L.bid.map(function(x){return row('bid',x,'💼');}).join('');
  if((L.sub||[]).length)h+='<div class="sup-sh-h">طلبات «مقاول باطن»</div>'+L.sub.map(function(x){return row('sub',x,'🤝');}).join('');
  s.innerHTML=h+'<button class="sheet-btn cancel" onclick="closeSheet()">إلغاء</button></div>'; s.classList.add('on');
}
function supLink(k,id){ closeSheet(); api('/api/support/link',{method:'POST',body:JSON.stringify({kind:k,id:id})}).then(function(){ toast('انربطت ✓','ok'); _supSig=''; loadSup(true); }).catch(function(){ toast('تعذّر الربط','err'); }); }
function supPickFiles(inp){
  var fs=[].slice.call(inp.files||[]); inp.value='';
  if(!fs.length)return;
  if(fs.length>10){ toast('لين 10 ملفات مرة وحدة — أرسلنا أول 10','err'); fs=fs.slice(0,10); }
  fs.forEach(function(f){
    if(f.size>30*1024*1024){ toast('«'+f.name+'» أكبر من 30 ميجا','err'); return; }
    var go=function(d){ supQueue('',{name:f.name,type:f.type||'application/octet-stream',data:d,size:f.size}); };
    if(/^image\/(jpeg|png|webp)$/.test(f.type)&&f.size>600*1024) compressImg(f,function(d){ go(d); });
    else { var r=new FileReader(); r.onload=function(e){ go(e.target.result); }; r.onerror=function(){ toast('تعذّر قراءة الملف','err'); }; r.readAsDataURL(f); }
  });
}
/* ── عرض الصور ── */
function supLight(src){
  var o=document.createElement('div'); o.className='sup-light'; o.onclick=function(){ o.remove(); };
  o.innerHTML='<img src="'+esc(_safeUrl(src))+'" alt=""><a href="'+esc(_safeUrl(src))+'" target="_blank" rel="noopener" download onclick="event.stopPropagation()">تحميل</a><button aria-label="إغلاق">✕</button>';
  document.body.appendChild(o);
}
function supWaOpen(){
  var go=function(n){ if(!n){ toast('الواتساب غير متاح حالياً','err'); return; } window.open('https://wa.me/'+n,'_blank'); };
  if(_supWa!==null)return go(_supWa);
  api('/api/support-contact').then(function(d){ var n=String(d&&d.whatsapp||'').replace(/[^0-9]/g,''); if(n.charAt(0)==='0')n='966'+n.slice(1); else if(n&&n.slice(0,3)!=='966')n='966'+n; _supWa=n; go(n); }).catch(function(){ go(''); });
}
function supEmbedClose(){ try{ parent.postMessage({type:'mnq_sup_close'},location.origin); }catch(e){} }

/* ═══ بدء ═══ */
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&curReq)loadMsgs(true); if(!document.hidden&&supMode)loadSup(true); });
loadList();
// فتح محادثة مباشرة عبر الرابط: ?req=123&with=456 (تعمل حتى لو المحادثة جديدة)
(function(){
  var p=new URLSearchParams(location.search);
  var r=parseInt(p.get('req')), w=parseInt(p.get('with'));
  if(p.get('support')==='1'||location.hash==='#support'){
    if(_isEmbed){ document.body.classList.add('emb'); var _hb=document.querySelector('#scChat .hd-btn'); if(_hb){ _hb.title='إغلاق'; _hb.setAttribute('aria-label','إغلاق'); _hb.innerHTML='<svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'; } }
    _supBoot={link:p.get('link')||'',topic:p.get('topic')||''};
    if(!_isEmbed)history.replaceState({v:'list'},'','/chat');
    openSupport(_isEmbed);
    return;
  }
  if(!r||!w)return;
  _openedReq=r;   // احفظ المشروع الذي فُتحت منه المحادثة (للرجوع إليه)
  // ضع مدخل "القائمة" في التاريخ أولاً — فزر الرجوع يرجّع للقائمة لا لخارج الصفحة
  history.replaceState({v:'list'},'','/chat');
  var nameParam=p.get('name')||'';
  var tries=0;
  var t=setInterval(function(){
    tries++;
    var listReady=convs.length||document.getElementById('listBody').querySelector('.empty');
    if(listReady||tries>25){
      clearInterval(t);
      var c=convs.filter(function(x){return x.request_id==r&&(isProvider?x.client_id==w:x.provider_id==w);})[0];
      var nm=c?(isProvider?c.client_name:c.provider_name):(nameParam||'محادثة جديدة');
      var pj=c?c.request_title:(p.get('proj')||'');
      openChat(r,w,nm,pj);
    }
  },180);
})();
</script>
<script>
/* ═══ اتصال لحظي: الرسائل توصل فوراً بدل الانتظار ═══ */
var _pollTick=0;
(function(){
  var _ws=null,_alive=false,_t=null,_RC=3000,_last=0,_stop=false,_rt=null,_lt=null;
  function _tok(){ try{ return localStorage.getItem('token')||''; }catch(e){ return ''; } }
  function _handle(m){
    if(m.type==='support_msg'||m.type==='support_read'){
      if(supMode){ clearTimeout(_rt); _rt=setTimeout(function(){ loadSup(true); },250); }
      else { loadSupPin(); if(m.type==='support_msg'&&document.getElementById('scChat').classList.contains('on')&&typeof toast==='function')toast('💬 فريق مناقصة رد عليك'); }
      return;
    }
    var other=m.type==='new_message'?m.sender_id:m.type==='messages_read'?m.reader_id:m.type==='message_deleted'?m.sender_id:m.type==='message_sent'?(m.message&&m.message.receiver_id):null;
    if(other==null)return;
    var onChat=document.getElementById('scChat')&&document.getElementById('scChat').classList.contains('on');
    if(onChat&&curReq&&String(curWith)===String(other)){ clearTimeout(_rt); _rt=setTimeout(function(){ loadMsgs(true); },250); }
    else if(m.type==='new_message'){
      var onList=document.getElementById('scList')&&document.getElementById('scList').classList.contains('on');
      if(onList){ clearTimeout(_lt); _lt=setTimeout(function(){ try{ loadList(); }catch(e){} },300); }
      else if(typeof toast==='function') toast('💬 رسالة جديدة'+(m.sender_name?' من '+m.sender_name:''));
    }
  }
  function _c(){
    if(_stop||!_tok()) return;
    if(_ws&&(_ws.readyState===0||_ws.readyState===1)) return;
    try{ _ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host); }catch(e){ _r(); return; }
    _ws.onopen=function(){ _last=Date.now(); try{ _ws.send(JSON.stringify({type:'auth',token:_tok()})); }catch(e){} };
    _ws.onmessage=function(ev){ _last=Date.now(); var m; try{ m=JSON.parse(ev.data); }catch(e){ return; } if(!m||m.type==='pong')return; if(m.type==='connected'){ _alive=true; window._wsLive=true; _RC=3000; return; } try{ _handle(m); }catch(e){} };
    _ws.onclose=function(ev){ _alive=false; window._wsLive=false; var c=ev&&ev.code; if(c===4003){ _stop=true; return; } if(c===4008) return; _r(c===4001?60000:0); };
    _ws.onerror=function(){ try{ _ws.close(); }catch(e){} };
  }
  function _r(min){ clearTimeout(_t); var d=Math.max(min||0,_RC)+Math.random()*1500; _RC=Math.min(_RC*2,30000); _t=setTimeout(_c,d); }
  setInterval(function(){ if(!_ws||_ws.readyState!==1)return; if(Date.now()-_last>70000){ try{ _ws.close(); }catch(e){} return; } try{ _ws.send('{"type":"ping"}'); }catch(e){} },25000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&!_alive){ _RC=3000; _c(); } });
  window.addEventListener('online',function(){ if(!_alive){ _RC=3000; _c(); } });
  setTimeout(_c,600);
})();
</script>
