<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172554">
<title>عروض الأسعار — مناقصة</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Cairo:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,sans-serif;background:#f0f5ff;color:#1e293b;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit}
.top{height:62px;background:#172554;border-bottom:3px solid #0ea5e9;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff;position:sticky;top:0;z-index:20}
.top b{font-size:21px;font-weight:900}.top b i{color:#38bdf8;font-style:normal}
.top a{color:#fff;text-decoration:none;font-size:13px;font-weight:800;opacity:.85}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 110px;display:flex;flex-direction:column;gap:14px}
.h1{font-size:22px;font-weight:900;color:#172554}.mu{color:#64748b;font-size:12.5px;font-weight:700}
.card{background:#fff;border:1px solid #e6eefb;border-radius:18px;box-shadow:0 2px 10px rgba(30,58,138,.05);padding:18px}
.h3{font-size:15px;font-weight:900;color:#172554}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 15px;font-weight:800;font-size:13.5px;border:0;cursor:pointer;white-space:nowrap;text-decoration:none}
.pri{background:#1e3a8a;color:#fff}.sec{background:#fff;border:1.5px solid #e2e8f0;color:#1e293b}.wa{background:#16a34a;color:#fff}.dan{background:#fff;border:1.5px solid #fecdca;color:#b42318}.gold{background:#fffbeb;border:1.5px solid #fde68a;color:#1e3a8a}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sb{justify-content:space-between}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1.5px solid #e2e8f0;background:#fff;color:#475467;border-radius:99px;padding:7px 13px;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:#172554;color:#fff;border-color:#172554}
.pill{display:inline-flex;align-items:center;gap:4px;height:23px;border-radius:99px;padding:0 10px;font-size:11.5px;font-weight:800;white-space:nowrap}
.p-b{background:#eff4ff;color:#1e3a8a}.p-g{background:#ecfdf3;color:#067647}.p-gr{background:#f2f4f7;color:#475467}.p-y{background:#fffaeb;color:#b54708}.p-r{background:#fef3f2;color:#b42318}
.ql{display:flex;flex-direction:column;gap:10px}
.qi{display:flex;gap:12px;align-items:center;cursor:pointer;text-align:right;width:100%;border:1px solid #e6eefb;background:#fff;border-radius:16px;padding:14px;color:inherit}
.qi:hover{border-color:#bfd3fe}
.qi .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.qi b{font-size:14.5px;color:#172554}
.amt{font-family:Cairo,sans-serif;font-weight:900;color:#172554;white-space:nowrap}
.f label{display:block;font-size:12.5px;font-weight:800;color:#334766;margin-bottom:5px}
.f input,.f textarea,.f select{width:100%;border:1.5px solid #e2e8f0;border-radius:11px;padding:10px 12px;font-size:14.5px;background:#fff;color:#1e293b}
.f textarea{min-height:80px;resize:vertical}
.grid2{display:flex;gap:12px}.grid2>*{flex:1;min-width:0}
.ed{display:flex;gap:16px;align-items:flex-start}.ed .main{flex:1.7;min-width:0;display:flex;flex-direction:column;gap:14px}.ed .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;position:sticky;top:76px}
.seg{display:flex;background:#e2e8f0;border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:800;font-size:13px;color:#64748b;cursor:pointer}
.seg button.on{background:#fff;color:#172554;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.opt{border:1.5px solid #e2e8f0;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.opt.rec{border-color:#1e3a8a;background:#f8faff}
.it{display:flex;gap:6px;align-items:center}
.it input{border:1.5px solid #e2e8f0;border-radius:10px;padding:9px 10px;font-size:14px;min-width:0;background:#fff}
.it .t{flex:1}.it .q{width:58px;text-align:center}.it .p{width:96px}
.x{border:0;background:#fef3f2;color:#b42318;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:16px;flex:none}
.chk{display:flex;gap:8px;font-size:13px;font-weight:700;align-items:flex-start;line-height:1.6}
.sheet-ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.sheet-ov{align-items:center}}
.sheet{background:#fff;width:min(480px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
@media(min-width:700px){.sheet{border-radius:20px}}
.bar{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid #e2e8f0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:15;box-shadow:0 -6px 20px rgba(30,58,138,.08)}
.bar .in{max-width:1180px;margin:0 auto;display:flex;gap:8px;align-items:center}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#172554;color:#fff;padding:11px 18px;border-radius:12px;font-weight:800;font-size:13.5px;z-index:99;display:none}
.empty{text-align:center;padding:40px 16px}
@media(max-width:820px){.ed{flex-direction:column}.ed .side{position:static;width:100%}.ed .main{width:100%}.grid2{flex-direction:column}}
</style>
</head>
<body>
<div class="top"><b>مناقصة <i>•</i></b><a href="/dashboard-provider.html">‹ لوحتي</a></div>
<div class="wrap" id="app"><div class="mu">جارٍ التحميل…</div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
var TOK=''; try{TOK=localStorage.getItem('token')||'';}catch(e){}
if(!TOK){ try{localStorage.setItem('_after_login',location.pathname+location.search);}catch(e){} location.href='/auth.html'; return; }
var A=document.getElementById('app'), P=new URLSearchParams(location.search);
var S={tab:'all', items:[], live:false, cust:null, view:'list', q:null};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function api(p,o){o=o||{};o.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+TOK},o.headers||{});
  return fetch(p,o).then(function(r){ if(r.status===401){ try{localStorage.setItem('_after_login',location.pathname+location.search);}catch(e){} location.href='/auth.html'; throw 0; } return r.json().then(function(j){ if(!r.ok){ var e=new Error(j.message||'حدث خطأ'); e.j=j; e.s=r.status; throw e; } return j; }); });}
function toast(t){ var e=document.getElementById('toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){e.style.display='none';},2600); }
function m(v){ return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:2}); }
function d(x){ if(!x)return ''; x=new Date(x); return x.getDate()+'/'+(x.getMonth()+1)+'/'+x.getFullYear(); }
function nd(s){ return String(s==null?'':s).replace(/[٠-٩]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'.indexOf(c);}).replace(/[^\d.]/g,''); }
function wa(ph){ ph=String(ph||'').replace(/\D/g,''); if(ph.indexOf('05')===0)ph='966'+ph.slice(1); else if(ph.length===9&&ph[0]==='5')ph='966'+ph; return ph; }
var ST={draft:['مسودة','p-gr'],sent:['بانتظار العميل','p-b'],change:['طلب تعديل','p-y'],accepted:['وافق العميل','p-g'],declined:['اعتذر العميل','p-r'],expired:['انتهت صلاحيته','p-gr']};
function setUrl(q){ try{ history.replaceState(null,'',q?'?'+q:location.pathname); }catch(e){} }

function load(){
  return api('/api/quotes').then(function(r){ S.items=r.items||[]; S.live=!!r.live; }).catch(function(e){ if(e===0)throw e; S.err=e.message; });
}
function lockCard(){ return '<div class="card" style="background:linear-gradient(135deg,#172554,#1e3a8a);color:#fff;border:0"><div style="font-size:17px;font-weight:900">عروض الأسعار من مزايا الاشتراك</div><div style="font-size:13.5px;opacity:.85;font-weight:700;line-height:1.9;margin-top:6px">سوّ عرض سعر باسمك وشعارك، فيه حتى 3 خيارات، وأرسله لعميلك برابط — يختار ويوافق من جواله.</div><a class="btn" style="background:#fbbf24;color:#172554;margin-top:12px" href="/plan.html">اشتراكي</a></div>'; }

// ───── القائمة ─────
function rng(q){ var t=(q.options||[]).map(function(o){return o.total;}); if(!t.length)return '—'; var a=Math.min.apply(null,t), b=Math.max.apply(null,t); return a===b?m(a):m(a)+' – '+m(b); }
function list(){
  S.view='list'; setUrl(S.tab==='cust'?'tab=cust':'');
  var cnt={all:S.items.length}; S.items.forEach(function(q){ cnt[q.status]=(cnt[q.status]||0)+1; });
  var tabs=[['all','الكل'],['sent','بانتظار العميل'],['change','طلب تعديل'],['accepted','وافق العميل'],['draft','مسودات'],['cust','عملائي']];
  var h='<div class="row sb"><div><div class="h1">عروض الأسعار</div><div class="mu" style="margin-top:3px">عرض باسمك فيه حتى 3 خيارات — العميل يختار ويوافق من جواله</div></div>'+(S.live?'<button class="btn pri" onclick="_qNew()">+ عرض سعر جديد</button>':'')+'</div>';
  if(!S.live) h+=lockCard();
  h+='<div class="tabs">'+tabs.map(function(t){ var n=t[0]==='cust'?'':(cnt[t[0]]?' ('+cnt[t[0]]+')':''); return '<button class="'+(S.tab===t[0]?'on':'')+'" onclick="_qTab(\''+t[0]+'\')">'+t[1]+n+'</button>'; }).join('')+'</div>';
  if(S.tab==='cust'){ A.innerHTML=h+'<div id="cust"><div class="mu">جارٍ التحميل…</div></div>'; custs(); return; }
  var L=S.items.filter(function(q){ return S.tab==='all'||q.status===S.tab; });
  if(!L.length) h+='<div class="card empty"><div style="font-size:38px">📄</div><b style="display:block;margin-top:6px">'+(S.items.length?'ما فيه عروض هنا':'ما سوّيت عروض أسعار للحين')+'</b><div class="mu" style="margin-top:6px">العرض بخيارات (أساسي · متوسط · شامل) يخلي العميل يختار الأنسب له — وغالباً يختار الأعلى.</div>'+(S.live?'<button class="btn pri" style="margin-top:12px" onclick="_qNew()">سوّ أول عرض</button>':'')+'</div>';
  else h+='<div class="ql">'+L.map(function(q){ var s=ST[q.status]||['','']; var ch=q.status==='accepted'&&q.options[q.chosen];
    return '<button class="qi" onclick="_qOpen('+q.id+')"><div class="c"><div class="row" style="gap:6px"><b>'+esc(q.title||'بدون عنوان')+'</b><span class="pill '+s[1]+'">'+s[0]+'</span>'+(q.status==='sent'&&q.viewed_at?'<span class="pill p-g">👁 فتحه</span>':'')+(q.status==='sent'&&!q.viewed_at?'<span class="pill p-gr">ما فتحه</span>':'')+'</div><span class="mu">'+esc(q.client_name||'—')+' · رقم '+q.no+' · '+d(q.updated_at)+(q.options.length>1?' · '+q.options.length+' خيارات':'')+'</span>'+(q.status==='change'&&q.client_note?'<span class="mu" style="color:#b54708">«'+esc(q.client_note)+'»</span>':'')+'</div><div class="amt">'+(ch?m(ch.total):rng(q))+' <small style="font-size:11px;color:#64748b">ر.س</small></div></button>'; }).join('')+'</div>';
  A.innerHTML=h;
}
window._qTab=function(t){ if(t==='cust'){ location.href='/customers.html'; return; } S.tab=t; list(); };
function custs(){
  api('/api/quotes/customers').then(function(r){ var L=r.items||[], el=document.getElementById('cust'); if(!el)return;
    if(!L.length){ el.innerHTML='<div class="card empty"><div style="font-size:38px">👥</div><b style="display:block;margin-top:6px">عملاؤك يظهرون هنا</b><div class="mu" style="margin-top:6px">كل عميل ترسل له عرض سعر ينضاف تلقائياً.</div></div>'; return; }
    el.innerHTML='<div class="ql">'+L.map(function(c){ return '<div class="qi" style="cursor:default"><span style="width:38px;height:38px;border-radius:12px;background:#eff4ff;color:#1e3a8a;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none">'+esc((c.name||'ع')[0])+'</span><div class="c"><b>'+esc(c.name||'عميل')+'</b><span class="mu" dir="ltr" style="text-align:right">'+esc(c.phone||'')+'</span><span class="mu">'+c.quotes_n+' عرض · '+c.accepted_n+' موافقة · آخر تعامل '+d(c.last_at)+'</span></div><div class="row">'+(c.phone?'<a class="btn wa" style="padding:8px 12px" target="_blank" rel="noopener" href="https://wa.me/'+wa(c.phone)+'">واتساب</a>':'')+(S.live?'<button class="btn sec" style="padding:8px 12px" onclick="_qNewFor(\''+esc(c.name||'').replace(/'/g,'')+'\',\''+esc(c.phone||'')+'\')">عرض جديد</button>':'')+'</div></div>'; }).join('')+'</div>';
  }).catch(function(e){ if(e)toast(e.message); });
}

// ───── المحرّر ─────
function blank(n){ return {n:['أساسي','متوسط','شامل'][n]||'', items:[{t:'',q:1,p:''}], days:'', warranty:'', rec:n===1}; }
window._qNew=function(){ edit({title:'',client_name:'',client_phone:'',options:[blank(0)],notes:'',deposit_pct:0,valid_days:14,status:'draft'}); };
window._qNewFor=function(n,p){ edit({title:'',client_name:n,client_phone:p,options:[blank(0)],notes:'',deposit_pct:0,valid_days:14,status:'draft'}); };
window._qOpen=function(id){ var q=S.items.find(function(x){return x.id===id;}); if(!q)return; if(q.status==='accepted'||q.status==='declined') view(q); else edit(JSON.parse(JSON.stringify(q))); };
function edit(q){
  S.view='edit'; S.q=q; if(!q.options.length)q.options=[blank(0)];
  q.options.forEach(function(o){ if(!o.items||!o.items.length)o.items=[{t:'',q:1,p:''}]; });
  setUrl(q.id?'id='+q.id:(q.qreq_id?'qreq='+q.qreq_id:'new=1'));
  draw();
}
function tot(o){ return (o.items||[]).reduce(function(a,x){ return a+(parseInt(x.q)||1)*(parseFloat(nd(x.p))||0); },0); }
function checks(q){
  var O=q.options, C=[];
  if(O.length>1){ var asc=O.every(function(o,i){ return i===0||tot(o)>=tot(O[i-1]); }); C.push([asc,'الخيارات مرتبة من الأرخص للأغلى']); }
  C.push([O.every(function(o){return (o.days||'').trim();}),'كل خيار فيه مدة التنفيذ']);
  C.push([O.every(function(o){return (o.warranty||'').trim();}),'كل خيار فيه ضمان']);
  if(O.length===1) C.push([false,'جرّب خيارين أو 3 — العميل غالباً يختار الوسط']);
  C.push([!!(q.title||'').trim()&&!!(q.client_name||'').trim(),'العنوان واسم العميل مكتوبين']);
  return C;
}
function draw(){
  var q=S.q, sent=q.status&&q.status!=='draft', ex=q.status==='expired';
  var h='<div class="row sb"><div><div class="row" style="gap:8px"><button class="btn sec" style="padding:7px 11px" onclick="_qBack()">‹ رجوع</button><span class="h1" style="font-size:19px">'+(q.id?'عرض سعر رقم '+q.no:'عرض سعر جديد')+'</span>'+(q.status?'<span class="pill '+(ST[q.status]||['','p-gr'])[1]+'">'+(ST[q.status]||[''])[0]+'</span>':'')+'</div></div>'+(q.id&&sent?'<a class="btn gold" target="_blank" rel="noopener" href="/q/'+esc(q.token)+'">👁 معاينة</a>':'')+'</div>';
  if(!S.live) h+=lockCard();
  if(q.status==='change') h+='<div class="card" style="background:#fffaeb;border-color:#fde68a"><b style="color:#b54708">العميل طلب تعديل:</b><div style="margin-top:4px;font-weight:700;white-space:pre-wrap">'+esc(q.client_note||'')+'</div><div class="mu" style="margin-top:6px">عدّل العرض واضغط «أرسل التحديث» — يوصله إشعار بالنسخة الجديدة.</div></div>';
  if(ex) h+='<div class="card" style="background:#f8fafc"><b>انتهت صلاحية العرض</b><div class="mu" style="margin-top:4px">حدّثه وأرسله من جديد — تبدأ صلاحية جديدة.</div></div>';
  if(q._reprice) h+='<div class="card" style="background:#fffaeb;border-color:#fde68a"><b style="color:#b54708">تعديل السعر بعد موافقة العميل</b><div class="mu" style="margin-top:4px;line-height:1.8">عدّل وأرسل — يوصل العميل يوافق على الجديد أو يبقى على السابق. لين يرد يبقى السعر الحالي.</div></div>';
  else if(q.reaccept&&q.status==='sent') h+='<div class="card" style="background:#fffaeb;border-color:#fde68a;padding:12px 16px"><b style="color:#b54708">بانتظار موافقة العميل على السعر المعدّل</b></div>';
  else if(sent&&q.status==='sent') h+='<div class="mu">أي تعديل تحفظه يوصل العميل كنسخة محدّثة (النسخة '+q.version+' الحين).</div>';
  h+='<div class="ed"><div class="main">';
  h+='<div class="card f" style="display:flex;flex-direction:column;gap:12px"><div class="grid2"><div><label for="q-cn">اسم العميل</label><input id="q-cn" data-k="client_name" maxlength="80" value="'+esc(q.client_name||'')+'" placeholder="مثال: أبو سعد"></div><div><label for="q-cp">جوال العميل</label><input id="q-cp" data-k="client_phone" dir="ltr" inputmode="tel" maxlength="15" value="'+esc(q.client_phone||'')+'" placeholder="05xxxxxxxx" style="text-align:right"></div></div>'
    +'<div><label for="q-t">عنوان العرض</label><input id="q-t" data-k="title" maxlength="120" value="'+esc(q.title||'')+'" placeholder="مثال: صيانة مكيفات فيلا"></div></div>';
  h+='<div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="row sb"><span class="h3">الخيارات</span><div class="seg" style="min-width:260px">'+[1,2,3].map(function(n){ return '<button class="'+(q.options.length===n?'on':'')+'" onclick="_qN('+n+')">'+(n===1?'خيار واحد':n===2?'خياران':'3 خيارات')+'</button>'; }).join('')+'</div></div>';
  q.options.forEach(function(o,i){
    h+='<div class="opt'+(o.rec&&q.options.length>1?' rec':'')+'"><div class="row sb"><input data-o="'+i+'" data-k="n" maxlength="30" value="'+esc(o.n)+'" placeholder="اسم الخيار" style="border:1.5px solid #e2e8f0;border-radius:10px;padding:8px 10px;font-weight:900;font-size:15px;width:150px">'+(q.options.length>1?'<label class="row" style="gap:5px;font-size:12.5px;font-weight:800;cursor:pointer"><input type="radio" name="rec" '+(o.rec?'checked':'')+' onchange="_qRec('+i+')"> ننصح فيه</label>':'')+'</div>';
    h+='<div class="it mu" style="font-size:11.5px"><span style="flex:1">البند</span><span style="width:58px;text-align:center">الكمية</span><span style="width:96px">السعر (ر.س)</span><span style="width:32px"></span></div>';
    o.items.forEach(function(x,j){ h+='<div class="it"><input class="t" data-o="'+i+'" data-j="'+j+'" data-k="t" maxlength="120" value="'+esc(x.t)+'" placeholder="مثال: تنظيف مكيف سبليت"><input class="q" data-o="'+i+'" data-j="'+j+'" data-k="q" inputmode="numeric" maxlength="4" value="'+esc(x.q||1)+'"><input class="p" data-o="'+i+'" data-j="'+j+'" data-k="p" inputmode="decimal" maxlength="9" value="'+esc(x.p===0?'0':(x.p||''))+'" placeholder="0"><button class="x" title="حذف" onclick="_qDelIt('+i+','+j+')">×</button></div>'; });
    h+='<div class="row sb"><button class="btn sec" style="padding:7px 12px;font-size:12.5px" onclick="_qAddIt('+i+')">+ بند</button><span>الإجمالي: <b class="amt" id="tot'+i+'">'+m(tot(o))+'</b> ر.س</span></div>';
    h+='<div class="grid2 f"><div><label>مدة التنفيذ</label><input data-o="'+i+'" data-k="days" maxlength="40" value="'+esc(o.days||'')+'" placeholder="مثال: يوم واحد"></div><div><label>الضمان</label><input data-o="'+i+'" data-k="warranty" maxlength="60" value="'+esc(o.warranty||'')+'" placeholder="مثال: 90 يوم على العمل"></div></div></div>';
  });
  h+='</div>';
  h+='<div class="card f" style="display:flex;flex-direction:column;gap:12px"><div class="grid2"><div><label for="q-v">صلاحية العرض</label><select id="q-v" data-k="valid_days">'+[7,14,30].map(function(v){return '<option value="'+v+'"'+(parseInt(q.valid_days)===v?' selected':'')+'>'+v+' يوم</option>';}).join('')+'</select></div><div><label for="q-dp">دفعة مقدمة (اختياري)</label><select id="q-dp" data-k="deposit_pct">'+[0,10,20,25,30,50].map(function(v){return '<option value="'+v+'"'+(parseInt(q.deposit_pct)===v?' selected':'')+'>'+(v?v+'%':'بدون')+'</option>';}).join('')+'</select></div></div>'
    +'<div><label for="q-nt">ملاحظات وشروط (اختياري)</label><textarea id="q-nt" data-k="notes" maxlength="1500" placeholder="مثال: السعر يشمل المواد · الموعد بالتنسيق">'+esc(q.notes||'')+'</textarea></div><div class="mu">الدفع بينك وبين العميل مباشرة — المنصة ما تستلم مبالغ العرض.</div></div>';
  h+='</div><div class="side"><div class="card" id="chk"></div><div class="card" id="pv"></div></div></div>';
  h+='<div class="bar"><div class="in">'+(q.id&&q.status==='draft'?'<button class="btn dan" onclick="_qDel()">حذف</button>':'')+'<span style="flex:1"></span>'+(!sent?'<button class="btn sec" id="b-draft" onclick="_qSave(false)">حفظ مسودة</button>':'')+'<button class="btn pri" id="b-send" onclick="_qSave(true)"'+(S.live?'':' disabled')+'>'+(q._reprice?'أرسل التعديل':(sent?'أرسل التحديث':'أرسل العرض'))+'</button></div></div>';
  A.innerHTML=h; side();
}
function side(){
  var q=S.q, C=checks(q), ok=C.filter(function(c){return c[0];}).length;
  var c=document.getElementById('chk'); if(c) c.innerHTML='<div class="row sb" style="margin-bottom:8px"><span class="h3">افحص عرضك</span><span class="pill '+(ok===C.length?'p-g':'p-y')+'">'+ok+' من '+C.length+'</span></div>'+C.map(function(x){ return '<div class="chk"><span style="color:'+(x[0]?'#067647':'#b54708')+'">'+(x[0]?'✓':'!')+'</span><span>'+x[1]+'</span></div>'; }).join('');
  var p=document.getElementById('pv'); if(p) p.innerHTML='<span class="mu">اللي يشوفه العميل</span><div style="margin-top:8px;border:1px solid #e6eefb;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px"><b style="font-size:14px;color:#172554">'+esc(q.title||'عنوان العرض')+'</b><div class="row" style="gap:6px;flex-wrap:nowrap">'+q.options.map(function(o){ return '<div style="flex:1;min-width:0;text-align:center;padding:8px 4px;border-radius:10px;border:1.5px solid '+(o.rec&&q.options.length>1?'#1e3a8a':'#e9ecf1')+'"><div style="font-size:11.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(o.n||'—')+'</div><b class="amt" style="font-size:13.5px">'+m(tot(o))+'</b></div>'; }).join('')+'</div><span class="mu" style="font-size:11.5px">صالح '+(q.valid_days||14)+' يوم'+(parseInt(q.deposit_pct)?' · دفعة مقدمة '+q.deposit_pct+'%':'')+'</span></div>';
}
document.addEventListener('input',function(e){ var t=e.target, q=S.q; if(S.view!=='edit'||!q||!t.dataset||!t.dataset.k)return;
  var k=t.dataset.k, v=t.value;
  if(k==='p'||k==='q'){ var c=k==='q'?nd(v).replace(/\./g,''):nd(v); if(c!==v){ t.value=c; } v=c; }
  if(t.dataset.j!=null){ q.options[t.dataset.o].items[t.dataset.j][k]=v; var tt=document.getElementById('tot'+t.dataset.o); if(tt)tt.textContent=m(tot(q.options[t.dataset.o])); }
  else if(t.dataset.o!=null){ q.options[t.dataset.o][k]=v; }
  else q[k]=v;
  side();
});
document.addEventListener('change',function(e){ var t=e.target; if(S.view==='edit'&&t.tagName==='SELECT'&&t.dataset.k){ S.q[t.dataset.k]=parseInt(t.value)||0; side(); } });
window._qN=function(n){ var O=S.q.options; while(O.length<n)O.push(blank(O.length)); if(O.length>n)O.length=n; if(n>1&&!O.some(function(o){return o.rec;}))O[1].rec=true; draw(); };
window._qRec=function(i){ S.q.options.forEach(function(o,k){o.rec=k===i;}); draw(); };
window._qAddIt=function(i){ S.q.options[i].items.push({t:'',q:1,p:''}); draw(); var L=document.querySelectorAll('input[data-o="'+i+'"][data-k="t"]'); if(L.length)L[L.length-1].focus(); };
window._qDelIt=function(i,j){ var it=S.q.options[i].items; it.splice(j,1); if(!it.length)it.push({t:'',q:1,p:''}); draw(); };
window._qBack=function(){ S.view='list'; load().then(list); };
window._qDel=function(){ if(!confirm('تحذف المسودة؟'))return; api('/api/quotes/'+S.q.id,{method:'DELETE'}).then(function(){ toast('انحذفت'); _qBack(); }).catch(function(e){ if(e)toast(e.message); }); };
window._qSave=function(send){
  var q=S.q, b=document.getElementById(send?'b-send':'b-draft'); if(b){ b.disabled=true; }
  var body={id:q.id||undefined, qreq_id:q.qreq_id||undefined, client_name:q.client_name, client_phone:q.client_phone, title:q.title, notes:q.notes, deposit_pct:q.deposit_pct, valid_days:q.valid_days, send:!!send,
    options:q.options.map(function(o){ return {n:o.n, rec:!!o.rec, days:o.days, warranty:o.warranty, items:o.items.map(function(x){ return {t:x.t, q:parseInt(x.q)||1, p:parseFloat(nd(x.p))||0}; })}; })};
  api('/api/quotes',{method:'POST',body:JSON.stringify(body)}).then(function(r){
    var was=q.status&&q.status!=='draft'; S.q=r.quote; S.q.options.forEach(function(o){ if(!o.items.length)o.items=[{t:'',q:1,p:''}]; });
    var i=S.items.findIndex(function(x){return x.id===r.quote.id;}); if(i>=0)S.items[i]=r.quote; else S.items.unshift(r.quote);
    draw(); if(send) shareSheet(r.quote, was); else toast('انحفظت المسودة');
  }).catch(function(e){ if(b)b.disabled=false; if(e)toast(e.message); });
};
function shareSheet(q, upd){
  var pn=''; try{ pn=(JSON.parse(localStorage.getItem('user')||'{}').business_name)||''; }catch(e){}
  var msg='السلام عليكم '+(q.client_name||'')+'،\n'+(upd?'حدّثت لك عرض السعر':'هذا عرض السعر')+' «'+(q.title||'')+'»'+(q.options.length>1?' — فيه '+q.options.length+' خيارات تختار منها':'')+':\n'+q.link+'\n\nتفتحه وتوافق عليه من جوالك.';
  var o=document.createElement('div'); o.className='sheet-ov'; o.id='sh'; o.onclick=function(e){ if(e.target===o)o.remove(); };
  o.innerHTML='<div class="sheet"><div style="text-align:center"><div style="font-size:40px">✅</div><b style="font-size:18px;color:#172554">'+(upd?'انحفظ التحديث':'العرض جاهز')+'</b><div class="mu" style="margin-top:6px;line-height:1.8">'+(q.client_id?'وصل للعميل إشعار في مناقصة. ':'')+'أرسل له الرابط بالواتساب — يفتحه بعد تسجيل الدخول.</div></div>'
    +(q.client_phone?'<a class="btn wa" style="padding:13px" target="_blank" rel="noopener" href="https://wa.me/'+wa(q.client_phone)+'?text='+encodeURIComponent(msg)+'">أرسل بالواتساب لـ '+esc(q.client_name||'العميل')+'</a>':'')
    +'<button class="btn sec" onclick="_qCopy(\''+esc(q.link)+'\')">نسخ الرابط</button><a class="btn sec" target="_blank" rel="noopener" href="/q/'+esc(q.token)+'">معاينة العرض</a><button class="btn" style="background:transparent;color:#64748b" onclick="document.getElementById(\'sh\').remove()">تم</button></div>';
  document.body.appendChild(o);
}
window._qCopy=function(u){ (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){toast('انسخ الرابط');}).catch(function(){ prompt('انسخ الرابط:',u); }); };
window._qReprice=function(){ var q=JSON.parse(JSON.stringify(S.items.find(function(x){return x.id===S.cur;})||{})); if(!q.id)return; q._reprice=true; edit(q); };
// عرض منتهي (وافق/اعتذر)
function view(q){
  S.view='view'; S.cur=q.id; setUrl('id='+q.id);
  var ch=q.status==='accepted'?q.options[q.chosen]:null;
  var h='<div class="row" style="gap:8px"><button class="btn sec" style="padding:7px 11px" onclick="_qBack()">‹ رجوع</button><span class="h1" style="font-size:19px">عرض سعر رقم '+q.no+'</span><span class="pill '+ST[q.status][1]+'">'+ST[q.status][0]+'</span></div>';
  h+='<div class="card" style="display:flex;flex-direction:column;gap:10px'+(ch?';border-color:#a6f4c5;background:#f6fef9':'')+'"><b style="font-size:16px;color:#172554">'+esc(q.title)+'</b><span class="mu">'+esc(q.client_name)+' · <span dir="ltr">'+esc(q.client_phone)+'</span> · '+d(q.decided_at)+'</span>';
  if(ch) h+='<div style="font-size:15px;font-weight:800">اختار: '+esc(ch.n)+' — <span class="amt">'+m(ch.total)+'</span> ر.س</div>'+(q.saai?'<div class="mu" style="color:#b54708">العميل تعامل معك في السوق خلال 90 يوم — انسجّل سعي المنصة في صفحة السعي.</div>':'');
  if(q.client_note) h+='<div style="background:#f8fafc;border-radius:12px;padding:10px 12px;font-weight:700;white-space:pre-wrap">'+(q.status==='declined'?'سبب الاعتذار: ':'ملاحظة العميل: ')+esc(q.client_note)+'</div>';
  h+='<div class="row">'+(q.job_id?'<a class="btn pri" href="/jobs.html?id='+(parseInt(q.job_id)||0)+'">افتح المشروع</a>':'')+(q.status==='accepted'&&S.live?'<button class="btn gold" onclick="_qReprice()">عدّل السعر</button>':'')+(q.client_phone?'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+wa(q.client_phone)+'">واتساب العميل</a><a class="btn sec" href="tel:'+esc(q.client_phone)+'">اتصال</a>':'')+'<a class="btn sec" target="_blank" rel="noopener" href="/q/'+esc(q.token)+'">العرض / PDF</a>'+(S.live?'<button class="btn sec" onclick="_qNewFor(\''+esc(q.client_name||'').replace(/'/g,'')+'\',\''+esc(q.client_phone||'')+'\')">عرض جديد لنفس العميل</button>':'')+'</div></div>';
  A.innerHTML=h;
}
// البداية
load().then(function(){
  if(S.err&&!S.items.length){ A.innerHTML='<div class="card empty"><b>'+esc(S.err)+'</b><div style="margin-top:12px"><a class="btn sec" href="/dashboard-provider.html">رجوع</a></div></div>'; return; }
  var id=parseInt(P.get('id')), qr=parseInt(P.get('qreq'));
  if(id){ var q=S.items.find(function(x){return x.id===id;}); if(q){ _qOpen(id); return; } }
  if(qr&&S.live){ edit({title:P.get('t')||'',client_name:P.get('n')||'',client_phone:'',qreq_id:qr,options:[blank(0)],notes:'',deposit_pct:0,valid_days:14,status:'draft'}); return; }
  if(P.get('new')&&S.live){ if(P.get('n')||P.get('p')) _qNewFor(P.get('n')||'',P.get('p')||''); else _qNew(); return; }
  if(P.get('tab')==='cust') S.tab='cust';
  list();
}).catch(function(){});
})();
</script>
</body>
</html>
