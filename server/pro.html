<style>
:root{
  --p:#1e3a8a;--p2:#1e40af;--p3:#172554;
  --gold:#1d4ed8;--gold-d:#1e40af;--gold-l:#eff4ff;--gold-soft:#bfdbfe;
  --text:#1e293b;--text2:#374151;--muted:#64748b;--hint:#94a3b8;
  --border:#e6eefb;--bg:#f0f5ff;--white:#FFFFFF;
  --green:#16A34A;--green-l:#DCFCE7;
  --sky:#0ea5e9;--star:#F0A500;
  --shadow:0 2px 8px rgba(37,99,235,.05);
  --shadow-md:0 4px 16px rgba(37,99,235,.1);
}
[data-theme="dark"]{
  --p:#3b82f6;--p2:#60a5fa;--p3:#1e3a8a;
  --gold:#3b82f6;--gold-d:#2563eb;--gold-l:#172136;--gold-soft:#1e40af;
  --text:#e2e8f0;--text2:#cbd5e1;--muted:#94a3b8;--hint:#64748b;
  --border:rgba(148,163,184,0.2);--bg:#0f172a;--white:#1e293b;
  --green:#22c55e;--green-l:#14251c;
  --sky:#38bdf8;--star:#fbbf24;
  --shadow:0 2px 8px rgba(0,0,0,.25);
  --shadow-md:0 4px 16px rgba(0,0,0,.35);
}
[data-theme="dark"] .tb-distinguished{background:#172136;color:#94a3b8;border-color:rgba(148,163,184,0.2)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.nav{background:var(--p3);height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:3px solid var(--sky)}
.back{display:flex;align-items:center;gap:5px;color:rgba(255,255,255,.75);font-size:13px;font-weight:700;border:none;background:none;font-family:inherit;cursor:pointer;padding:6px 10px;border-radius:8px;transition:.15s}
.back:hover{background:rgba(255,255,255,.1);color:#fff}
.logo{font-family:'Cairo',sans-serif;font-size:17px;font-weight:900;color:#fff;display:flex;align-items:center;gap:5px;text-decoration:none}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--sky)}
.nav-in{padding:7px 16px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s}
.nav-in:hover{filter:brightness(1.08)}
.cover{height:180px;background:linear-gradient(135deg,#172554 0%,#1e3a8a 45%,#2952a3 100%);position:relative;overflow:hidden}
.cover-net{position:absolute;inset:0;opacity:.14}
.cover-bar{position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,var(--sky),transparent)}
.profile-sec{max-width:680px;margin:0 auto;padding:0 16px}
.profile-top{display:flex;align-items:flex-end;justify-content:space-between;margin-top:-50px;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.av-wrap{position:relative;flex-shrink:0}
.av{width:110px;height:110px;border-radius:50%;border:4px solid var(--white);background:var(--p-light,#dbeafe);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:var(--p);overflow:hidden;box-shadow:var(--shadow-md)}
.av img{width:100%;height:100%;object-fit:cover}
.ver-dot{position:absolute;bottom:4px;left:4px;display:flex;filter:drop-shadow(0 1px 3px rgba(0,0,0,.25))}
.profile-actions{display:flex;gap:8px;padding-bottom:8px;flex-wrap:wrap}
.btn-call{display:flex;align-items:center;gap:6px;padding:10px 20px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:none;border-radius:22px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;text-decoration:none;box-shadow:0 2px 8px rgba(29,78,216,.3);transition:.15s}
.btn-call:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-wa{display:flex;align-items:center;gap:6px;padding:10px 20px;background:#16A34A;color:#fff;border:none;border-radius:22px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;text-decoration:none;box-shadow:0 2px 8px rgba(22,163,74,.25);transition:.15s}
.btn-wa:hover{background:#15803D;transform:translateY(-1px)}
.btn-msg{display:flex;align-items:center;gap:6px;padding:10px 20px;background:var(--white);color:var(--p);border:1.5px solid var(--p);border-radius:22px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s}
.btn-msg:hover{background:var(--p);color:#fff}
.btn-share{display:flex;align-items:center;gap:6px;padding:10px 20px;background:var(--white);color:var(--muted);border:1.5px solid var(--border);border-radius:22px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.btn-share:hover{border-color:var(--p);color:var(--p)}
.profile-card{background:var(--white);border-radius:16px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.pname{font-family:'Cairo',sans-serif;font-size:24px;font-weight:900;color:var(--p);line-height:1.2;margin-bottom:4px}
.pbiz{font-size:15px;font-weight:700;color:var(--p);margin-bottom:6px}
.phead{font-size:14px;color:var(--text2);margin-bottom:10px;line-height:1.5}
.pinfo-row{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);margin-bottom:4px}
.pinfo-row svg{flex-shrink:0}
.ver-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(14,165,233,.08);border:1px solid rgba(14,165,233,.25);color:var(--sky);font-size:11px;font-weight:800;padding:4px 12px;border-radius:20px;margin-bottom:10px}
.pbadges{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px}
.pbadges .ver-badge{margin-bottom:0}
.tier-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 12px;border-radius:20px;line-height:1}
.tier-badge svg{flex-shrink:0}
.tb-expert{background:#fdf1cf;color:#97710d;border:1px solid #ecd58a}
.tb-distinguished{background:#eceff3;color:#5b6b7d;border:1px solid #cfd6df}
.tb-active{background:#f6ead9;color:#9a6a2e;border:1px solid #e6cfae}
.tb-new{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}
.vchk{display:inline-flex;vertical-align:middle;margin:0 3px 4px 0}
.vchk svg{display:block}
.apill{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800}
.a-now{background:var(--green-l);color:var(--green)}
.a-rec{background:var(--gold-l);color:var(--p)}
.a-old{background:var(--bg);color:var(--muted)}
.rat-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.stars{font-size:16px;letter-spacing:1px}
.rat-n{font-size:16px;font-weight:900;color:var(--text)}
.rat-c{font-size:12px;color:var(--muted)}
.stats-card{background:var(--white);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-radius:10px;overflow:hidden}
.stat{background:var(--white);padding:14px 8px;text-align:center}
.sv{font-size:24px;font-weight:900;color:var(--text);line-height:1}
.sv.gold{color:var(--p)}
.sl{font-size:10px;color:var(--muted);font-weight:600;margin-top:4px}
.specs-card{background:var(--white);border-radius:16px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-family:'Cairo',sans-serif;font-size:15px;font-weight:900;color:var(--p);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title-ic{width:28px;height:28px;border-radius:8px;background:var(--p);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.specs-list{display:flex;gap:8px;flex-wrap:wrap}
.spec-tag{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--bg);border:1px solid var(--border);border-radius:22px;font-size:12px;font-weight:700;color:var(--text)}
.spec-tag svg{flex-shrink:0;stroke:var(--sky)}
.bio-card{background:var(--white);border-radius:16px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.bio-text{font-size:13px;color:var(--text2);line-height:2;white-space:pre-line}
.exp-tag{display:inline-flex;align-items:center;gap:6px;background:var(--gold-l);border:1px solid var(--gold-soft);color:var(--p);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-top:12px}
.social-card{background:var(--white);border-radius:16px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.social-link{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-radius:12px;text-decoration:none;margin-bottom:8px;font-size:13px;font-weight:800;transition:.15s}
.social-link:last-child{margin-bottom:0}
.social-link:hover{transform:translateY(-1px);filter:brightness(1.05)}
.social-link span{display:flex;align-items:center;gap:9px}
.social-wa{background:#25D366;color:#fff}
.social-yt{background:#FF0000;color:#fff}
.social-ig{background:linear-gradient(135deg,#E1306C,#833AB4);color:#fff}
.social-tw{background:#000;color:#fff}
.social-sn{background:#FFFC00;color:#1a1a1a}
.social-tt{background:#010101;color:#fff}
.social-map{background:#1A73E8;color:#fff}
.social-web{background:var(--p);color:#fff}
.port-card{background:var(--white);border-radius:16px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.port-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.port-img{border-radius:10px;overflow:hidden;aspect-ratio:1;cursor:pointer;position:relative;background:var(--bg)}
.port-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.port-img:hover img{transform:scale(1.06)}
.port-img-overlay{position:absolute;inset:0;background:rgba(0,0,0,0);transition:.2s;display:flex;align-items:center;justify-content:center}
.port-img:hover .port-img-overlay{background:rgba(0,0,0,.25)}
.port-zoom{opacity:0;transition:.2s;color:#fff;font-size:22px}
.port-img:hover .port-zoom{opacity:1}
.rev-card{background:var(--white);border-radius:16px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.rev-summary{display:flex;align-items:center;gap:16px;padding:16px;background:var(--bg);border-radius:12px;margin-bottom:16px}
.rev-big-num{font-family:'Cairo',sans-serif;font-size:48px;font-weight:900;color:var(--p);line-height:1}
.rev-stars-big{font-size:22px;letter-spacing:3px;margin-bottom:4px}
.rev-based{font-size:11px;color:var(--muted)}
.rev{padding:14px 0;border-bottom:1px solid var(--border)}
.rev:last-child{border-bottom:none;padding-bottom:0}
.rev-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rev-av{width:38px;height:38px;border-radius:50%;background:var(--p-light,#dbeafe);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:var(--p);flex-shrink:0;overflow:hidden}
.rev-av img{width:100%;height:100%;object-fit:cover}
.rev-name{font-size:13px;font-weight:800;color:var(--text)}
.rev-date{font-size:10px;color:var(--muted);margin-top:1px}
.rev-stars{margin-right:auto;font-size:13px;color:var(--star);letter-spacing:1px}
.rev-req{font-size:11px;color:var(--hint);margin-top:2px}
.rev-comment{font-size:13px;color:var(--text2);line-height:1.9;padding-right:48px;margin-top:6px}
.rev-imgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-right:48px}
.rev-img{width:60px;height:60px;border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid var(--border)}
.rev-img img{width:100%;height:100%;object-fit:cover}
.rev-reply{margin-top:8px;margin-right:48px;background:var(--gold-l);border-radius:10px;padding:9px 13px;border-right:3px solid var(--p)}
.rev-reply-label{font-size:10px;font-weight:800;color:var(--p);margin-bottom:3px}
.rev-reply-text{font-size:12px;color:var(--text2);line-height:1.7}
.cta-card{background:linear-gradient(135deg,var(--p3),var(--p));border-radius:16px;padding:24px 20px;margin-bottom:14px;text-align:center;border-bottom:3px solid var(--sky);box-shadow:var(--shadow-md)}
.qr-card{display:flex;align-items:center;gap:20px;background:var(--white);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.qr-card::before{content:'';position:absolute;top:0;right:0;width:120px;height:120px;background:radial-gradient(circle at top right,var(--p-light),transparent 70%);opacity:.6}
.qr-side{flex:1;min-width:0;position:relative;z-index:1}
.qr-title{font-family:'Cairo',sans-serif;font-size:17px;font-weight:900;color:var(--p);margin-bottom:7px}
.qr-sub{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:14px;font-weight:500}
.qr-brand{display:inline-flex;align-items:center;gap:6px;font-family:'Cairo',sans-serif;font-weight:900;font-size:14px;color:var(--text)}
.qr-foot{display:flex;align-items:center;justify-content:flex-start;gap:12px;margin-top:16px}
.qr-share-btn{margin-top:0}
.qr-share-btn{display:inline-flex;align-items:center;justify-content:center;margin-top:14px;width:42px;height:42px;background:var(--p);color:#fff;border:none;border-radius:12px;cursor:pointer;transition:.18s;box-shadow:0 4px 12px rgba(29,78,216,.25)}
.qr-share-btn:hover{background:var(--p2,#2563eb);transform:translateY(-1px)}
.qr-share-btn:active{transform:translateY(0)}
.qr-box{flex-shrink:0;background:#fff;padding:12px;border-radius:14px;border:1px solid var(--border);box-shadow:0 6px 18px rgba(29,78,216,.12)}
.qr-box img{display:block;width:130px;height:130px;border-radius:6px}
@media(max-width:560px){.qr-card{flex-direction:column;text-align:center;gap:16px}.qr-side{text-align:center}.qr-brand{margin:0 auto}}
.cta-logo{font-family:'Cairo',sans-serif;font-size:20px;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px}
.cta-text{font-size:13px;color:rgba(255,255,255,.6);line-height:1.8;margin-bottom:16px}
.cta-btn{display:inline-block;padding:13px 32px;background:linear-gradient(135deg,var(--sky),var(--p2));color:#fff;border:none;border-radius:22px;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit;text-decoration:none;box-shadow:0 4px 14px rgba(14,165,233,.4);transition:.15s}
.cta-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.viewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:9999;align-items:center;justify-content:center;padding:16px}
.viewer.on{display:flex}
.viewer img{max-width:100%;max-height:90vh;border-radius:12px;object-fit:contain}
.vcl{position:absolute;top:14px;right:14px;width:40px;height:40px;background:rgba(255,255,255,.1);border:none;border-radius:50%;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.vcl:hover{background:rgba(255,255,255,.2)}
.sk{background:linear-gradient(90deg,#eaf1fc 25%,#dbe6fa 50%,#eaf1fc 75%);background-size:200%;animation:sk 1.3s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200%}100%{background-position:-200%}}
.wrap{max-width:680px;margin:0 auto;padding:12px 16px 40px}
.foot{text-align:center;font-size:11px;color:var(--muted);padding:12px}
@media(max-width:560px){.cover{height:140px}.av{width:90px;height:90px;font-size:32px}.pname{font-size:20px}.profile-actions{gap:6px}.btn-call,.btn-wa,.btn-msg,.btn-share{padding:9px 14px;font-size:12px}}

/* ═══ صفحة المزوّد — تصميم 2026 ═══ */
body{background:var(--bg)}
.pp-hero{background:linear-gradient(160deg,#1e3a8a,#2554c7);color:#fff;padding:22px 16px 70px;position:relative}
.pp-hin{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:15px}
.pp-av{position:relative;flex-shrink:0}
.pp-av .im{width:86px;height:86px;border-radius:26px;background:linear-gradient(135deg,#f8fafc,#dbe7ff);color:#1e3a8a;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;border:3px solid rgba(255,255,255,.35);overflow:hidden;cursor:pointer}
.pp-av .im img{width:100%;height:100%;object-fit:cover}
.pp-av .vd{position:absolute;bottom:-4px;left:-4px;width:28px;height:28px;border-radius:28px;background:#16a34a;border:3px solid #1e3a8a;display:flex;align-items:center;justify-content:center}
.pp-hname{font-family:'Cairo',sans-serif;font-size:21px;font-weight:900;line-height:1.3;margin:0}
.pp-hbiz{font-size:12.5px;font-weight:800;color:#c9d8ff}
.pp-hsp{font-size:13px;font-weight:700;color:#c9d8ff;margin-top:3px}
.pp-hb{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.pp-pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pp-hmeta{max-width:680px;margin:14px auto 0;display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;font-weight:800;color:#dbe7ff}
.pp-share{position:absolute;top:14px;left:max(16px, calc(50% - 324px));width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pp-share:hover{background:rgba(255,255,255,.25)}
.pp-body{max-width:680px;margin:-50px auto 0;padding:0 16px 110px;display:flex;flex-direction:column;gap:12px;position:relative}
.pp-trust{background:var(--white);border:1px solid var(--border);border-radius:20px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));box-shadow:0 10px 26px rgba(30,58,138,.10)}
.pp-ts{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 2px;text-align:center}
.pp-ts+.pp-ts{border-right:1px solid var(--border)}
.pp-ts b{font-family:'Cairo',sans-serif;font-size:19px;font-weight:900;line-height:1.15;color:var(--text)}
.pp-ts span{font-size:11px;font-weight:700;color:var(--muted)}
.pp-card{background:var(--white);border:1px solid var(--border);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.pp-h{font-family:'Cairo',sans-serif;font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px;color:var(--text)}
.pp-h .lk{margin-right:auto;font-family:'Tajawal',sans-serif;font-size:12.5px;font-weight:800;color:#1d4ed8;background:none;border:0;cursor:pointer;padding:0}
.pp-ct{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pp-btn{border:0;border-radius:14px;padding:13px;font-family:inherit;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;cursor:pointer}
.pp-wa{background:#16a34a;color:#fff}.pp-call{background:#1d4ed8;color:#fff}
.pp-msg{border:1.5px solid var(--border);background:var(--white);color:var(--p);border-radius:12px;padding:10px;font-family:inherit;font-weight:800;font-size:13.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.pp-gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:118px;gap:6px}
.pp-gal .g{border-radius:14px;overflow:hidden;position:relative;cursor:pointer;background:var(--bg)}
.pp-gal .g img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.pp-gal .g:hover img{transform:scale(1.04)}
.pp-gal .g.big{grid-column:span 2;grid-row:span 2}
.pp-gal .g .more{position:absolute;inset:0;background:rgba(15,23,42,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900}
.pp-gal.all{grid-auto-rows:110px}
.pp-gal.one{grid-template-columns:1fr;grid-auto-rows:220px}
.pp-gal.two{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:150px}
.pp-rs{display:flex;align-items:center;gap:16px;background:#fffbeb;border-radius:14px;padding:12px 14px}
[data-theme="dark"] .pp-rs{background:#2a2412}
.pp-rs .big{font-family:'Cairo',sans-serif;font-size:34px;font-weight:900;line-height:1;color:var(--text)}
.pp-bar{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;color:var(--muted)}
.pp-bar .t{flex:1;height:7px;border-radius:7px;background:var(--border);overflow:hidden}
.pp-bar .t i{display:block;height:100%;background:#f59e0b;border-radius:7px}
.pp-rv{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.pp-rv:last-of-type{border-bottom:0;padding-bottom:0}
.pp-rv .top{display:flex;align-items:center;gap:8px}
.pp-rv .rav{width:34px;height:34px;border-radius:11px;background:var(--gold-l);color:var(--p);display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden;flex-shrink:0}
.pp-rv .rav img{width:100%;height:100%;object-fit:cover}
.pp-rv .vf{font-size:11.5px;font-weight:800;color:#15803d}
.pp-rv p{font-size:14px;line-height:1.85;color:var(--text2);margin:0}
.pp-rv .rp{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--text2)}
.pp-rv .ims{display:flex;gap:6px;flex-wrap:wrap}
.pp-rv .ims span{width:64px;height:64px;border-radius:10px;overflow:hidden;cursor:pointer}
.pp-rv .ims img{width:100%;height:100%;object-fit:cover}
.pp-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pp-fact{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:7px;text-decoration:none;min-width:0}
.pp-fact span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-chips{display:flex;gap:6px;flex-wrap:wrap}
.pp-chip{font-size:12.5px;font-weight:800;padding:7px 12px;border-radius:999px;background:var(--gold-l);color:var(--p);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.pp-sim{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pp-sim a{border:1px solid var(--border);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--text);min-width:0}
.pp-sim a:hover{border-color:#93c5fd}
.pp-sim .sa{width:40px;height:40px;border-radius:12px;background:#1e3a8a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden}
.pp-sim .sa img{width:100%;height:100%;object-fit:cover}
.pp-sim b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-sim small{font-size:11.5px;color:var(--muted);font-weight:700}
.pp-cta{background:linear-gradient(135deg,#1e3a8a,#2563eb);border-radius:20px;padding:20px;color:#fff;display:flex;flex-direction:column;gap:10px;text-align:center}
.pp-cta b{font-family:'Cairo',sans-serif;font-size:18px;font-weight:900}
.pp-cta p{font-size:13.5px;color:#dbe7ff;line-height:1.7;margin:0}
.pp-cta button{border:0;background:#fff;color:#1e3a8a;border-radius:12px;padding:12px;font-family:inherit;font-weight:900;font-size:14.5px;cursor:pointer}
.pp-qr{display:flex;align-items:center;gap:14px}
.pp-qr img{width:84px;height:84px;border-radius:10px;background:#fff;padding:4px;flex-shrink:0}
.pp-sticky{position:fixed;bottom:0;right:0;left:0;z-index:90;background:var(--white);border-top:1px solid var(--border);padding:10px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(30,58,138,.08);transform:translateY(110%);transition:transform .25s}
.pp-sticky.on{transform:none}
.pp-sticky .in{max-width:680px;margin:0 auto;display:flex;gap:8px}
.pp-sticky .pp-btn{flex:1;padding:12px;font-size:14.5px;border-radius:13px}
@media(min-width:720px){.pp-gal{grid-auto-rows:150px}.pp-sim{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>

<script>
var API='https://manaqasati-production.up.railway.app';
function getId(){var slug=location.pathname.split('/').pop();var m=slug.match(/(\d+)$/);if(m)return m[1];return new URLSearchParams(location.search).get('id')||'';}
function oImg(s){document.getElementById('vi').src=s;document.getElementById('viewer').classList.add('on');document.body.style.overflow='hidden';}
function cImg(){document.getElementById('viewer').classList.remove('on');document.body.style.overflow='';}
function mkStars(n,col,sz){var h='',c=col||'#F0A500',s=sz||'15px';for(var i=1;i<=5;i++)h+='<span style="color:'+(i<=Math.round(n)?c:'#E6E2D9')+';font-size:'+s+'">&#9733;</span>';return h;}
function pill(d){var m=d?Math.floor((Date.now()-new Date(d))/60000):9999;if(m<60)return '<span class="apill a-now">&#9679; نشط الآن</span>';if(m<1440)return '<span class="apill a-rec">&#9679; نشط منذ '+Math.floor(m/60)+' ساعة</span>';return '<span class="apill a-old">&#9679; آخر نشاط منذ '+Math.floor(m/1440)+' يوم</span>';}
function ph966(p){if(!p)return'';var n=p.replace(/\D/g,'');if(n.startsWith('966'))return n;if(n.startsWith('0'))return '966'+n.slice(1);return '966'+n;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ago(d){if(!d)return'';var m=Math.floor((Date.now()-new Date(d))/60000);if(m<2)return'نشط الآن';if(m<60)return'منذ '+m+' د';var h=Math.floor(m/60);if(h<24)return'منذ '+h+' ساعة';return'منذ '+Math.floor(h/24)+' يوم';}

function openExternal(e,url){
  try{
    var w=window.open(url,'_blank','noopener,noreferrer');
    if(w){e.preventDefault();return false;}
  }catch(err){}
  // لو window.open فشل (WebView)، نترك السلوك الافتراضي (target=_blank)
  return true;
}
function tierBadge(t){
  if(!t||t==='new')return '';
  var map={expert:{l:'خبير معتمد',bg:'#fbbf24',c:'#422006'},distinguished:{l:'مزود مميّز',bg:'rgba(255,255,255,.9)',c:'#1e3a8a'},active:{l:'مزود نشط',bg:'rgba(134,239,172,.25)',c:'#dcfce7'}};
  var d=map[t];if(!d)return '';
  return '<span class="pp-pill" style="background:'+d.bg+';color:'+d.c+'">'+esc(d.l)+'</span>';
}
var _IC={
  wa:'<svg width="17" height="17" fill="currentColor" viewBox="0 0 24 24"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.7.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35M12.05 21.8h-.01a9.87 9.87 0 01-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 01-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 012.89 6.99c0 5.45-4.44 9.88-9.88 9.88M20.46 3.49A11.82 11.82 0 0012.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 005.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.16-3.48-8.41"/></svg>',
  call:'<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>',
  msg:'<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>',
  share:'<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>',
  chk:'<svg width="14" height="14" fill="none" stroke="#fff" stroke-width="3.2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
};
function _ppShare(){
  var p=window._proData||{},pid=getId();
  var nm=p.business_name||p.name||'مزود';
  var refUrl='https://www.manaqasa.com/pro/'+pid+'?ref=pro'+pid;
  var msg='✨ '+nm+' على منصة مناقصة\n\nشوف الأعمال والتقييمات وتواصل مباشرة:\n'+refUrl;
  if(navigator.share){navigator.share({title:nm+' — مناقصة',text:msg,url:refUrl}).catch(function(){});}
  else if(navigator.clipboard){navigator.clipboard.writeText(msg).then(function(){_ppToast('تم نسخ رابط الصفحة');});}
}
function _ppToast(t){var d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:800;z-index:9999';document.body.appendChild(d);setTimeout(function(){d.remove();},1800);}
function _ppMsg(){
  var pid=getId();var u=null;try{u=JSON.parse(localStorage.getItem('user')||'null');}catch(e){}
  var t=localStorage.getItem('token')||'';
  if(u&&t){try{localStorage.setItem('pending_contact_provider',pid);}catch(e){}location.href='/dashboard-client.html';}
  else{location.href='/auth.html?redirect=msg&provider_id='+pid;}
}
function _ppGalAll(){var g=document.getElementById('pp-gal');if(!g)return;g.innerHTML=_ppGalHtml(window._ppPorts||[],true);g.className='pp-gal all';var b=document.getElementById('pp-gal-more');if(b)b.style.display='none';_ppBindImgs();}
function _ppGalHtml(ports,all){
  var h='';
  if(all||ports.length<=3){ports.forEach(function(s,i){h+='<div class="g" data-s="'+esc(s)+'"><img src="'+esc(s)+'" loading="lazy" alt="عمل '+(i+1)+'"></div>';});return h;}
  h+='<div class="g big" data-s="'+esc(ports[0])+'"><img src="'+esc(ports[0])+'" loading="lazy" alt="عمل 1"></div>';
  h+='<div class="g" data-s="'+esc(ports[1])+'"><img src="'+esc(ports[1])+'" loading="lazy" alt="عمل 2"></div>';
  var rest=ports.length-3;
  h+='<div class="g" '+(rest>0?'onclick="_ppGalAll()"':'data-s="'+esc(ports[2])+'"')+'><img src="'+esc(ports[2])+'" loading="lazy" alt="عمل 3">'+(rest>0?'<div class="more">+'+rest+'</div>':'')+'</div>';
  return h;
}
function _ppBindImgs(){
  document.querySelectorAll('[data-s]').forEach(function(el){if(el._b)return;el._b=1;el.addEventListener('click',function(){oImg(el.getAttribute('data-s'));});});
}
function _ppRevHtml(rv){
  var ra=rv.reviewer_image?'<img src="'+esc(rv.reviewer_image)+'" alt="">':esc((rv.reviewer_name||'ع').charAt(0));
  var h='<div class="pp-rv"><div class="top"><span class="rav">'+ra+'</span><div style="min-width:0"><b style="font-size:14px;color:var(--text)">'+esc(rv.reviewer_name||'عميل')+'</b><div>'+mkStars(rv.rating,'#F0A500','13px')+'</div></div><span style="margin-right:auto;font-size:11.5px;color:var(--muted);font-weight:700">'+ago2(rv.created_at)+'</span></div>';
  if(rv.request_title)h+='<div class="vf">✓ مشروع منفّذ عبر مناقصة · '+esc(rv.request_title)+'</div>';
  if(rv.comment)h+='<p>'+esc(rv.comment)+'</p>';
  if(rv.images&&rv.images.length){h+='<div class="ims">';rv.images.forEach(function(im){h+='<span data-s="'+esc(im)+'"><img src="'+esc(im)+'" loading="lazy" alt=""></span>';});h+='</div>';}
  if(rv.provider_reply)h+='<div class="rp"><b>رد المزوّد:</b> '+esc(rv.provider_reply)+'</div>';
  return h+'</div>';
}
function ago2(d){if(!d)return'';var dd=Math.floor((Date.now()-new Date(d))/86400000);if(dd<1)return'اليوم';if(dd<2)return'أمس';if(dd<7)return'قبل '+dd+' أيام';if(dd<30)return'قبل '+Math.floor(dd/7)+' أسبوع';if(dd<365)return'قبل '+Math.floor(dd/30)+' شهر';return'قبل '+Math.floor(dd/365)+' سنة';}
function _ppRevAll(){var w=document.getElementById('pp-revs');if(!w)return;var h='';(window._ppRevs||[]).forEach(function(r){h+=_ppRevHtml(r);});w.innerHTML=h;var b=document.getElementById('pp-rev-more');if(b)b.remove();_ppBindImgs();}
function _ppSimilar(pid){
  try{fetch(API+'/api/providers/'+pid+'/similar').then(function(r){return r.json();}).then(function(list){
    var w=document.getElementById('pp-sim-card');if(!w||!Array.isArray(list)||!list.length)return;
    var city=(window._proData&&window._proData.city)||'';
    var h='<div class="pp-h">مزوّدين مشابهين'+(city?' في '+esc(city):'')+'</div><div class="pp-sim">';
    list.forEach(function(s){
      var nm=s.business_name||s.name||'مزود';
      var av=s.profile_image?'<img src="'+esc(s.profile_image)+'" alt="" loading="lazy">':esc(nm.charAt(0));
      var slug=encodeURIComponent(String(nm).replace(/\s+/g,'-'))+'-'+s.id;
      var r=parseFloat(s.avg_rating)||0;
      h+='<a href="/pro/'+slug+'?id='+s.id+'"><span class="sa">'+av+'</span><b>'+esc(nm)+'</b><small>'+(r>0?'★ '+r.toFixed(1)+' · ':'')+(s.completed_projects||0)+' مشروع</small></a>';
    });
    w.innerHTML=h+'</div>';w.style.display='';
  }).catch(function(){});}catch(e){}
}
function render(p,rat){
  window._proData=p;
  var avg=parseFloat(p.avg_rating)||0,cnt=parseInt(p.review_count)||0;
  if(rat){if(!avg)avg=parseFloat(rat.average)||0;if(!cnt)cnt=parseInt(rat.count)||0;}
  var vrf=(p.badge==='verified'||p.badge==='موثق')||!!(p.profile_image&&p.bio&&(p.specialties||[]).length>0&&cnt>=3);
  var last=p.last_active||p.last_bumped_at||p.created_at,ph=p.phone||'';
  var revs=(rat&&rat.reviews)||[],ports=(p.portfolio_images||[]).filter(function(x){return x;}),sp=p.specialties||[];
  var nm=p.business_name||p.name||'مزود',city=p.city||'السعودية',url=location.href,pid=getId();
  var pgT=nm+(sp[0]?' — '+sp[0]:'')+(city!='السعودية'?' في '+city:'')+' | مناقصة';
  var pgD=nm+' مزود خدمة في '+city+(sp.length?'، متخصص في '+sp.join('، '):'')+(avg>0?'، تقييم '+avg.toFixed(1)+' من 5':'')+'. تواصل معه الآن.';
  document.title=pgT;
  try{var md=document.querySelector('meta[name="description"]');if(md)md.setAttribute('content',pgD);}catch(e){}
  var sc={"@context":"https://schema.org","@type":"LocalBusiness","name":nm,"description":pgD,"url":url,"address":{"@type":"PostalAddress","addressLocality":city,"addressCountry":"SA"}};
  if(ph)sc.telephone=ph;
  if(avg>0)sc.aggregateRating={"@type":"AggregateRating","ratingValue":avg.toFixed(1),"reviewCount":cnt,"bestRating":"5"};
  document.getElementById('ld').textContent=JSON.stringify(sc);

  // ── الواجهة ──
  var avHtml=p.profile_image?'<img src="'+esc(p.profile_image)+'" alt="'+esc(nm)+'" loading="eager">':esc(nm.charAt(0));
  var hero='<button class="pp-share" onclick="_ppShare()" aria-label="مشاركة الصفحة">'+_IC.share+'</button>';
  hero+='<div class="pp-hin"><div class="pp-av"><div class="im"'+(p.profile_image?' data-s="'+esc(p.profile_image)+'"':'')+'>'+avHtml+'</div>'+(vrf?'<span class="vd" title="موثّق">'+_IC.chk+'</span>':'')+'</div>';
  hero+='<div style="min-width:0">';
  if(p.business_name&&p.name&&p.business_name!==p.name)hero+='<div class="pp-hbiz">'+esc(p.name)+'</div>';
  hero+='<h1 class="pp-hname">'+esc(nm)+'</h1>';
  if(sp.length)hero+='<div class="pp-hsp">'+esc(sp.slice(0,4).join(' · '))+'</div>';
  var bd=(vrf?'<span class="pp-pill" style="background:rgba(255,255,255,.16);color:#fff">موثّق ✓</span>':'')+tierBadge(p.tier);
  if(bd)hero+='<div class="pp-hb">'+bd+'</div>';
  hero+='</div></div>';
  var m=last?Math.floor((Date.now()-new Date(last))/60000):99999;
  var act=m<60?'<span style="color:#86efac">● نشط الآن</span>':(m<1440?'<span style="color:#bbf7d0">● نشط اليوم</span>':(m<10080?'<span>● نشط هذا الأسبوع</span>':''));
  hero+='<div class="pp-hmeta"><span>📍 '+esc(city)+'</span>'+act+'</div>';
  document.getElementById('pp-hero').innerHTML=hero;

  var h='';
  // ── شريط الثقة ──
  var yrs=parseInt(p.experience_years)||0, since=p.created_at?new Date(p.created_at).getFullYear():'';
  h+='<div class="pp-trust">';
  h+='<div class="pp-ts"><b style="color:#d97706">'+(avg>0?avg.toFixed(1):'—')+'</b><span>'+(cnt?cnt+' تقييم':'بدون تقييم')+'</span></div>';
  h+='<div class="pp-ts"><b>'+(parseInt(p.completed_projects)||0)+'</b><span>مشروع منجز</span></div>';
  h+='<div class="pp-ts"><b>'+(yrs?yrs:'—')+'</b><span>سنوات خبرة</span></div>';
  h+='<div class="pp-ts"><b>'+(since||'—')+'</b><span>عضو منذ</span></div>';
  h+='</div>';

  // ── التواصل ──
  h+='<div class="pp-card" style="gap:10px">';
  if(ph){
    h+='<div class="pp-ct"><a class="pp-btn pp-wa" href="https://wa.me/'+ph966(ph)+'" target="_blank" rel="noopener noreferrer">'+_IC.wa+'واتساب</a><a class="pp-btn pp-call" href="tel:'+esc(ph)+'">'+_IC.call+'اتصال</a></div>';
  }
  h+='<button class="pp-msg" onclick="_ppMsg()">'+_IC.msg+'رسالة عبر المنصة</button>';
  h+='</div>';

  // ── معرض الأعمال ──
  window._ppPorts=ports;
  if(ports.length){
    var gc=ports.length===1?'pp-gal one':(ports.length===2?'pp-gal two':'pp-gal');
    h+='<div class="pp-card"><div class="pp-h">معرض الأعمال'+(ports.length>3?'<button class="lk" id="pp-gal-more" onclick="_ppGalAll()">عرض الكل '+ports.length+'</button>':'<span class="lk" style="cursor:default;color:var(--muted)">'+ports.length+' صور</span>')+'</div>';
    h+='<div class="'+gc+'" id="pp-gal">'+_ppGalHtml(ports,false)+'</div></div>';
  }

  // ── التقييمات ──
  window._ppRevs=revs;
  if(revs.length){
    h+='<div class="pp-card"><div class="pp-h">وش يقولون عملاؤه<span class="lk" style="cursor:default;color:var(--muted)">'+cnt+' تقييم</span></div>';
    h+='<div class="pp-rs"><div style="text-align:center;flex-shrink:0"><div class="big">'+avg.toFixed(1)+'</div><div>'+mkStars(avg,'#F0A500','14px')+'</div></div><div style="flex:1;display:flex;flex-direction:column;gap:5px">';
    for(var s=5;s>=1;s--){var n=revs.filter(function(r){return Math.round(r.rating)===s;}).length;var pct=revs.length?Math.round(n/revs.length*100):0;h+='<div class="pp-bar"><span style="width:10px;text-align:center">'+s+'</span><span class="t"><i style="width:'+pct+'%;'+(s<=2?'background:#dc2626':'')+'"></i></span><span style="width:22px">'+n+'</span></div>';}
    h+='</div></div><div id="pp-revs" style="display:flex;flex-direction:column;gap:12px">';
    revs.slice(0,3).forEach(function(r){h+=_ppRevHtml(r);});
    h+='</div>';
    if(revs.length>3)h+='<button class="pp-msg" id="pp-rev-more" onclick="_ppRevAll()">كل التقييمات ('+revs.length+')</button>';
    h+='</div>';
  }

  // ── عن المزوّد ──
  var facts='';
  if(yrs)facts+='<div class="pp-fact">🧰 <span>'+yrs+' سنة خبرة</span></div>';
  facts+='<div class="pp-fact">📍 <span>'+esc(city)+'</span></div>';
  function _u(x){x=String(x||'').trim();return /^https?:\/\//i.test(x)?x:'https://'+x;}
  if(p.location_url)facts+='<a class="pp-fact" href="'+esc(_u(p.location_url))+'" target="_blank" rel="noopener noreferrer" onclick="return openExternal(event,this.href)">🗺️ <span>الموقع على الخريطة</span></a>';
  if(p.website)facts+='<a class="pp-fact" href="'+esc(_u(p.website))+'" target="_blank" rel="noopener noreferrer" onclick="return openExternal(event,this.href)">🌐 <span>الموقع الإلكتروني</span></a>';
  var socs=[['instagram','انستقرام','#fdf2f8','#be185d'],['tiktok','تيك توك','#f1f5f9','#0f172a'],['snapchat','سناب','#fefce8','#854d0e'],['twitter','X','#f1f5f9','#0f172a'],['youtube','يوتيوب','#fef2f2','#b91c1c']];
  var sh='';socs.forEach(function(x){if(p[x[0]])sh+='<a class="pp-chip" style="background:'+x[2]+';color:'+x[3]+'" href="'+esc(_u(p[x[0]]))+'" target="_blank" rel="noopener noreferrer" onclick="return openExternal(event,this.href)">'+x[1]+'</a>';});
  h+='<div class="pp-card"><div class="pp-h">عن المزوّد</div>';
  if(p.bio)h+='<div style="font-size:14px;line-height:1.95;color:var(--text2);white-space:pre-line">'+esc(p.bio)+'</div>';
  h+='<div class="pp-facts">'+facts+'</div>';
  if(sp.length){h+='<div class="pp-chips">';sp.forEach(function(x){h+='<span class="pp-chip">'+esc(x)+'</span>';});h+='</div>';}
  if(sh)h+='<div class="pp-chips">'+sh+'</div>';
  h+='</div>';

  // ── مزوّدين مشابهين (يتعبّى بعدين) ──
  h+='<div class="pp-card" id="pp-sim-card" style="display:none"></div>';

  // ── دعوة للنشر ──
  h+='<div class="pp-cta"><b>تبي تقارن أكثر من سعر؟</b><p>انشر مشروعك مجاناً وتوصلك عروض من عدة مزوّدين خلال ساعات</p><button onclick="location.href=\'/?ref=pro'+pid+'\'">انشر مشروعك الآن</button></div>';

  // ── رمز الصفحة ──
  var _qrUrl='https://www.manaqasa.com/pro/'+pid;
  var _qrImg='https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=0&data='+encodeURIComponent(_qrUrl);
  h+='<div class="pp-card"><div class="pp-qr"><img src="'+_qrImg+'" alt="رمز QR لصفحة '+esc(nm)+'" loading="lazy"><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:900;color:var(--text);margin-bottom:4px">رمز الصفحة</div><div style="font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.7">امسحه بالكاميرا للوصول السريع لأعماله وتقييماته</div><button class="pp-msg" style="margin-top:8px;padding:8px 12px;font-size:12.5px" onclick="_ppShare()">'+_IC.share.replace('width="18" height="18"','width="14" height="14"')+'مشاركة الصفحة</button></div></div></div>';
  h+='<div class="foot">&#169; مناقصة — جميع الحقوق محفوظة</div>';
  document.getElementById('wrap').innerHTML=h;

  // ── الشريط الثابت ──
  var st=document.getElementById('pp-sticky');
  if(st){
    st.innerHTML='<div class="in">'+(ph?'<a class="pp-btn pp-wa" href="https://wa.me/'+ph966(ph)+'" target="_blank" rel="noopener noreferrer">'+_IC.wa+'واتساب</a><a class="pp-btn pp-call" href="tel:'+esc(ph)+'">'+_IC.call+'اتصال</a>':'<button class="pp-btn pp-call" onclick="_ppMsg()">'+_IC.msg+'راسله عبر المنصة</button>')+'</div>';
    var onS=function(){st.classList.toggle('on',window.scrollY>320);};
    window.addEventListener('scroll',onS,{passive:true});onS();
  }
  _ppBindImgs();
  if(pid){try{fetch(API+'/api/pro/'+pid+'/view',{method:'POST'}).catch(function(){});}catch(e){}}
  _ppSimilar(pid);
}
(function(){
  var id=getId();
  if(!id){document.getElementById('wrap').innerHTML='<p style="padding:40px;text-align:center;color:var(--muted)">رابط غير صحيح</p>';return;}
  var d1=null,d2=null,done=0,rendered=false;
  function tryRender(){done++;if(done<2||rendered)return;rendered=true;if(!d1){document.getElementById('wrap').innerHTML='<p style="padding:40px;text-align:center;color:var(--muted)">المزود غير موجود</p>';return;}render(d1,d2||{});}
  setTimeout(function(){if(rendered)return;rendered=true;if(d1)render(d1,d2||{});else document.getElementById('wrap').innerHTML='<p style="padding:40px;text-align:center;color:var(--muted)">تعذر التحميل</p>';},8000);
  var x1=new XMLHttpRequest();x1.open('GET',API+'/api/providers/'+id,true);x1.timeout=10000;
  x1.onload=function(){try{d1=JSON.parse(x1.responseText);}catch(e){d1=null;}tryRender();};
  x1.onerror=x1.ontimeout=function(){tryRender();};x1.send();
  var x2=new XMLHttpRequest();x2.open('GET',API+'/api/ratings/provider/'+id,true);x2.timeout=10000;
  x2.onload=function(){try{d2=JSON.parse(x2.responseText);}catch(e){d2=null;}tryRender();};
  x2.onerror=x2.ontimeout=function(){d2={};tryRender();};x2.send();
})();

</script>

<script>
// رجوع ذكي: يعود للصفحة السابقة داخل الموقع، وإلا للرئيسية
function _smartBack(){
  // الأولوية دائماً لـ history.back(): انتقال فوري بلا إعادة تحميل (يمنع ومضات الصفحات)
  var ref=document.referrer||'';
  var same = ref && ref.indexOf(location.origin)===0 && ref!==location.href;
  if(same && history.length>1){ history.back(); return; }
  // بديل نادر: لا تاريخ صالح — استبدل الصفحة (replace يمنع تراكم التاريخ)
  location.replace(same?ref:'/');
}
// اضبط نص الزر حسب مصدر الزيارة
(function(){
  var lbl=document.getElementById('backLbl'); if(!lbl)return;
  var ref=document.referrer||'';
  if(ref.indexOf(location.origin)===0){
    if(/\/project\//.test(ref)) lbl.textContent='المشروع';
    else if(/\/dashboard-client/.test(ref)) lbl.textContent='لوحتي';
    else if(/\/chat/.test(ref)) lbl.textContent='المحادثة';
    else lbl.textContent='رجوع';
  } else lbl.textContent='الرئيسية';
})();
</script>
