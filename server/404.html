<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>الصفحة غير موجودة — مناقصة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:#eef3fb;color:#14223d;min-height:100vh}
a{color:#1d4ed8;text-decoration:none}
.hd{background:#172554;color:#fff;padding:13px 16px;display:flex;align-items:center;gap:10px}
.hd .logo{font-family:'Cairo',sans-serif;font-size:18px;font-weight:900;color:#fff}
.hd .home{margin-right:auto;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:#c9d8ff}
.hd .home:hover{color:#fff}
.wrap{max-width:460px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;gap:12px}
.top{text-align:center;margin-bottom:4px}
.code{font-family:'Cairo',sans-serif;font-size:64px;font-weight:900;color:#1d4ed8;line-height:1}
h1{font-family:'Cairo',sans-serif;font-size:19px;font-weight:900;margin-top:6px}
.sub{font-size:13.5px;color:#5b6b85;font-weight:700;margin-top:6px;line-height:1.8}
.srch{display:flex;gap:8px}
.in{flex:1;min-width:0;border:1.5px solid #dbe5f5;border-radius:13px;padding:12px 14px;font-family:inherit;font-size:14px;background:#fff;color:#14223d;outline:none}
.in:focus{border-color:#1d4ed8}
.sb{border:0;background:#1d4ed8;color:#fff;border-radius:13px;padding:0 18px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer}
.sb:hover{background:#1e3a8a}
.lk{background:#fff;border:1px solid #e1e9f6;border-radius:14px;padding:13px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:13.5px;color:#14223d}
.lk:hover{border-color:#bcd0f2;color:#14223d}
.lk .i{width:36px;height:36px;border-radius:11px;background:#eef3ff;color:#1d4ed8;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
</style>
</head>
<body>
<div class="hd">
  <a href="/" class="logo">مناقصة</a>
  <a href="/" class="home">الرئيسية <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></a>
</div>
<div class="wrap">
  <div class="top">
    <div class="code">404</div>
    <h1>الصفحة اللي تدوّرها مو موجودة</h1>
    <div class="sub">ممكن الرابط قديم أو المشروع انحذف. جرّب تبحث أو اختر من تحت.</div>
  </div>
  <form class="srch" onsubmit="return go404(event)">
    <input class="in" id="q404" type="search" maxlength="120" placeholder="ابحث عن خدمة أو مشروع…" aria-label="بحث">
    <button class="sb" type="submit">بحث</button>
  </form>
  <a class="lk" href="/new.html"><span class="i">＋</span>انشر مشروعك واستقبل عروض أسعار</a>
  <a class="lk" id="lk-browse" href="/"><span class="i">📋</span>تصفّح المشاريع المفتوحة</a>
  <a class="lk" href="/dalil"><span class="i">👷</span>دليل المزوّدين حسب المدينة</a>
  <a class="lk" id="lk-wa" href="https://wa.me/966594011313" target="_blank" rel="noopener"><span class="i">💬</span>تواصل مع الدعم</a>
</div>
<script>
// البحث: نفس مسار بحث الرئيسية (معالج النشر يستقبل ?q)
function go404(e){
  if(e)e.preventDefault();
  var q=String(document.getElementById('q404').value||'').trim();
  location.href=q?'/new.html?q='+encodeURIComponent(q.slice(0,120)):'/';
  return false;
}
// المزوّد المسجّل: تصفّح المشاريع من لوحته
try{
  var _u=JSON.parse(localStorage.getItem('user')||'{}');
  if(localStorage.getItem('token')&&_u&&_u.role==='provider') document.getElementById('lk-browse').href='/dashboard-provider.html#browse';
}catch(e){}
// رقم الدعم من الإعدادات (الافتراضي احتياط)
fetch((window.API||'https://manaqasati-production.up.railway.app')+'/api/support-contact').then(function(r){return r.json();}).then(function(d){
  var n=String(d&&d.whatsapp||'').replace(/[^0-9]/g,''); if(!n)return;
  if(n.charAt(0)==='0')n='966'+n.slice(1); else if(n.slice(0,3)!=='966')n='966'+n;
  document.getElementById('lk-wa').href='https://wa.me/'+n;
}).catch(function(){});
</script>
</body>
</html>
