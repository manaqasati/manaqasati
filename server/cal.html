  // الجوال: قائمة اليوم حسب الفني
  var mob='';
  if(!wk){ mob='<div class="mob tabs"><button class="'+(!S.tf?'on':'')+'" onclick="_cF(0)">الكل</button>'+D.techs.map(function(t){ return '<button class="'+(S.tf===t.id?'on':'')+'" onclick="_cF('+t.id+')">'+esc(t.name)+(onLeave(t.id,S.from)?' 🌴':'')+'</button>'; }).join('')+'</div>';
    var L=D.jobs.filter(function(j){ return ymdOf(j.at)===S.from&&(!S.tf||j.tech_id===S.tf); });
    mob+='<div class="card mob" style="padding:8px 14px">'+(L.length?L.map(function(j){ return '<div class="mli" data-lp="'+j.id+'"><span class="mu" style="width:48px;flex:none">'+h12(minOf(j.at))+'</span><div class="ev '+cls(j)+'" style="position:relative;inset:auto;flex:1">'+esc(j.title)+'<small>'+esc([tname(j.tech_id)||'بدون فني',j.status_t].filter(Boolean).join(' · '))+'</small></div>'+(movable(j)?'<button class="btn sec" style="padding:6px 10px;font-size:12px" onclick="_cOpen('+j.id+')">نقل</button>':'')+'</div>'; }).join(''):'<div class="mu" style="padding:12px 0">ما فيه مواعيد هاليوم</div>')+'</div><div class="mu mob" style="text-align:center">اضغط مطوّلاً على أي موعد عشان تنقله</div>'; }
  else { mob='<div class="mob" style="display:flex;flex-direction:column;gap:10px">'+[0,1,2,3,4,5,6].map(function(k){ var y=addD(S.from,k), L=D.jobs.filter(function(j){ return ymdOf(j.at)===y; }); return '<div class="card" style="padding:10px 14px"><b style="color:#172554">'+dlab(y,true)+'</b>'+(L.length?L.map(function(j){ return '<div class="mli"><span class="mu" style="width:48px;flex:none">'+h12(minOf(j.at))+'</span><div class="ev '+cls(j)+'" style="position:relative;inset:auto;flex:1">'+esc(j.title)+'<small>'+esc(tname(j.tech_id)||'بدون فني')+'</small></div>'+(movable(j)?'<button class="btn sec" style="padding:6px 10px;font-size:12px" onclick="_cOpen('+j.id+')">نقل</button>':'')+'</div>'; }).join(''):'<div class="mu" style="padding:6px 0">—</div>')+'</div>'; }).join('')+'</div>'; }
  A.innerHTML=h+mob+'<div class="calw"><div class="calg desk">'+grid+'</div><div class="side">'+side+'</div></div>';
  MNQ_BR.bar(document.getElementById('brbar'),function(){ load(); });
  wire(h0);
}
window._cV=function(v){ S.view=v; load(); };
window._cN=function(n){ S.from=addD(S.from,n*(S.view==='week'?7:1)); load(); };
window._cT=function(){ S.from=ymdOf(new Date()); load(); };
window._cF=function(t){ S.tf=t; draw(); };
function jobOf(id){ return (S.D.jobs.concat(S.D.unscheduled)).filter(function(j){return j.id===id;})[0]; }
// السحب والإفلات (كمبيوتر) + الضغط المطوّل (جوال)
function wire(h0){
  [].forEach.call(A.querySelectorAll('.mli[data-lp]'),function(el){ var t=null; el.addEventListener('touchstart',function(){ t=setTimeout(function(){ var j=jobOf(+el.getAttribute('data-lp')); if(j&&movable(j)) _cOpen(j.id); },550); },{passive:true}); ['touchend','touchmove','touchcancel'].forEach(function(e){ el.addEventListener(e,function(){ clearTimeout(t); },{passive:true}); }); });
  [].forEach.call(A.querySelectorAll('.calg .ev[data-j], .side .uj[data-j]'),function(el){
    el.addEventListener('pointerdown',function(ev){ if(ev.button!==0||ev.target.closest('button')) return; var id=+el.getAttribute('data-j'), j=jobOf(id); if(!j) return; var r=el.getBoundingClientRect(), off=el.getAttribute('data-u')?0:ev.clientY-r.top, sx=ev.clientX, sy=ev.clientY, g=null, tgt=null;
      if(!movable(j)){ var up0=function(){ document.removeEventListener('pointerup',up0); location.href='/jobs.html?id='+id; }; document.addEventListener('pointerup',up0); return; }
      ev.preventDefault();
      function mv(e){ if(!g&&Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)<6) return; if(!g){ g=el.cloneNode(true); g.classList.add('ghost'); g.style.height=Math.max(40,r.height)+'px'; document.body.appendChild(g); el.style.opacity='.35'; }
        g.style.left=(e.clientX-90)+'px'; g.style.top=(e.clientY-off)+'px'; var c=document.elementFromPoint(e.clientX,e.clientY); c=c&&c.closest('.ccol'); if(tgt&&tgt!==c) tgt.classList.remove('tgt'); tgt=c; if(c) c.classList.add('tgt'); }
      function up(e){ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); el.style.opacity='';
        if(!g){ _cOpen(id); return; } g.remove(); if(!tgt) return; tgt.classList.remove('tgt');
        var cr=tgt.getBoundingClientRect(), m=h0*60+Math.round(((e.clientY-off)-cr.top)/RH*60/30)*30; m=Math.max(0,Math.min(23*60+30,m));
        var day=tgt.getAttribute('data-day'), tech=S.view==='week'?(j.tech_id||null):(+tgt.getAttribute('data-col')||null);
        _cOpen(id,{tech:tech,at:atOf(day,m)}); }
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    }); });
}
// ورقة النقل: الفني والوقت والمدة + التحذيرات + «نبلغ العميل؟»
window._cRoute=function(tid){ var go=function(){ MQROUTE.open(tid,S.from,function(){ load(); }); }; if(window.MQROUTE) return go(); var s=document.createElement('script'); s.src='/mqroute.js?v=1'; s.onload=go; document.head.appendChild(s); };
window._cOpen=function(id,want){ var j=jobOf(id); if(!j) return; want=want||{}; var at=want.at||(j.at?new Date(j.at):atOf(S.from,9*60)), tech=want.tech!==undefined?want.tech:(j.tech_id||null), notify=true;
  var o=document.createElement('div'); o.className='sheet-ov'; o.id='sh'; o.onclick=function(e){ if(e.target===o)o.remove(); };
  var durs=[30,60,90,120,180,240,300,360,480];
  o.innerHTML='<div class="sheet f"><div class="row sb"><b style="font-size:17px;color:#172554">'+(j.at?'نقل':'جدولة')+' «'+esc(j.title)+'»</b><a class="mu" href="/jobs.html?id='+j.id+'">افتح المشروع</a></div>'
    +'<div class="grid2" style="flex-direction:row"><div><label for="mv-t">الفني</label><select id="mv-t"><option value="">بدون فني</option>'+S.D.techs.map(function(t){ return '<option value="'+t.id+'"'+(t.id===tech?' selected':'')+'>'+esc(t.name)+'</option>'; }).join('')+'</select></div><div><label for="mv-u">المدة</label><select id="mv-u">'+durs.map(function(d){ return '<option value="'+d+'"'+(d===(j.dur||120)?' selected':'')+'>'+(d<60?d+' دقيقة':(d/60)+' ساعة')+'</option>'; }).join('')+'</select></div></div>'
    +'<div class="grid2" style="flex-direction:row"><div><label for="mv-d">اليوم</label><input id="mv-d" type="date" value="'+ymdOf(at)+'"></div><div><label for="mv-h">الوقت</label><input id="mv-h" type="time" step="1800" value="'+String(Math.floor(minOf(at)/60)).padStart(2,'0')+':'+String(minOf(at)%60).padStart(2,'0')+'"></div></div>'
    +'<button type="button" class="btn sec" id="mv-s">✨ اقترح أفضل فني لهالوقت</button><div id="mv-sl"></div><div id="mv-w"></div>'
    +'<div class="card" id="mv-n" style="padding:12px;display:none"><div class="row sb" style="flex-wrap:nowrap"><b style="color:#172554">نبلغ العميل بالموعد الجديد؟</b><button type="button" class="tg on" id="mv-nt" aria-label="إبلاغ العميل"></button></div><div class="mu" id="mv-nx" style="margin-top:4px"></div></div>'
    +'<button class="btn pri" id="mv-go">تأكيد</button></div>';
  document.body.appendChild(o);
  var $=function(i){ return document.getElementById(i); };
  function cur(){ var hh=($('mv-h').value||'09:00').split(':'); return { tech:+$('mv-t').value||null, at:atOf($('mv-d').value, (+hh[0])*60+(+hh[1]||0)), dur:+$('mv-u').value }; }
  function chk(){ var c=cur(); if(isNaN(c.at)) return; api('/api/cal/move',{method:'POST',body:JSON.stringify({job_id:j.id,tech_id:c.tech,at:c.at.toISOString(),dur:c.dur,dry:true})}).then(function(r){
      $('mv-w').innerHTML=r.warnings.length?'<div class="wl">⚠️ '+r.warnings.map(esc).join('<br>⚠️ ')+'</div>':(c.tech?'<div class="okl">✓ '+esc(tname(c.tech))+' فاضي هذا الوقت</div>':'');
      var moved=!j.at||new Date(j.at).getTime()!==c.at.getTime(); $('mv-n').style.display=r.has_client&&moved?'':'none';
      $('mv-nx').textContent='يوصل '+(j.client||'العميل')+': «تغيّر موعد زيارتك إلى '+dlab(ymdOf(c.at),true)+' '+h12(minOf(c.at))+(c.tech?' — الفني '+tname(c.tech):'')+'»';
      $('mv-go').textContent=r.warnings.length?'تأكيد رغم التنبيه':'تأكيد'; }).catch(function(e){ if(e)$('mv-w').innerHTML='<div class="wl">'+esc(e.message)+'</div>'; }); }
  ['mv-t','mv-d','mv-h','mv-u'].forEach(function(i){ $(i).onchange=chk; }); chk();
  $('mv-nt').onclick=function(){ notify=!notify; this.classList.toggle('on',notify); };
  $('mv-s').onclick=function(){ var c=cur(); $('mv-sl').innerHTML='<div class="mu">جارٍ البحث…</div>'; api('/api/cal/suggest?job_id='+j.id+'&at='+encodeURIComponent(c.at.toISOString())).then(function(r){
      $('mv-sl').innerHTML=r.items.length?'<div class="card" style="padding:8px 12px">'+r.items.map(function(x,i){ return '<button type="button" class="mli" style="width:100%;border:0;background:none;font-family:inherit;text-align:right;cursor:pointer" data-t="'+x.id+'"><span style="width:26px;height:26px;border-radius:50%;background:#1e3a8a;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none">'+(i+1)+'</span><span style="flex:1"><b style="color:#172554">'+esc(x.name)+'</b><span class="mu" style="display:block">فاضي '+h12(minOf(x.at))+(x.km!=null?' · يبعد '+x.km+' كم عن مواعيده':'')+' · عنده '+x.jobs_n+' مواعيد هاليوم</span></span></button>'; }).join('')+'</div>':'<div class="wl">ما فيه فني فاضي هذا الوقت — جرّب وقت ثاني</div>';
      [].forEach.call($('mv-sl').querySelectorAll('[data-t]'),function(b){ b.onclick=function(){ $('mv-t').value=b.getAttribute('data-t'); $('mv-sl').innerHTML=''; chk(); }; }); }).catch(function(e){ if(e)toast(e.message); }); };
  $('mv-go').onclick=function(){ var b=this, c=cur(); b.disabled=true; api('/api/cal/move',{method:'POST',body:JSON.stringify({job_id:j.id,tech_id:c.tech,at:c.at.toISOString(),dur:c.dur,confirm:true,notify:notify})}).then(function(r){ o.remove(); toast(r.told?'انتقل الموعد ✅ وبلّغنا العميل':'انتقل الموعد ✅'); load(); }).catch(function(e){ b.disabled=false; if(e)toast(e.message); }); };
};
MNQ_BR.load().then(load);
})();
