<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172554">
<title>مهام الفني — مناقصة</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Cairo:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,sans-serif;background:#f0f5ff;color:#1e293b;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit}
.top{height:62px;background:#172554;border-bottom:3px solid #0ea5e9;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff;position:sticky;top:0;z-index:20}
.top b{font-size:21px;font-weight:900}.top b i{color:#38bdf8;font-style:normal}
.top a{color:#fff;text-decoration:none;font-size:13px;font-weight:800;opacity:.85}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 110px;display:flex;flex-direction:column;gap:14px}
.h1{font-size:22px;font-weight:900;color:#172554}.mu{color:#64748b;font-size:12.5px;font-weight:700}
.card{background:#fff;border:1px solid #e6eefb;border-radius:18px;box-shadow:0 2px 10px rgba(30,58,138,.05);padding:18px}
.h3{font-size:15px;font-weight:900;color:#172554}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 15px;font-weight:800;font-size:13.5px;border:0;cursor:pointer;white-space:nowrap;text-decoration:none}
.pri{background:#1e3a8a;color:#fff}.sec{background:#fff;border:1.5px solid #e2e8f0;color:#1e293b}.wa{background:#16a34a;color:#fff}.dan{background:#fff;border:1.5px solid #fecdca;color:#b42318}.gold{background:#fffbeb;border:1.5px solid #fde68a;color:#1e3a8a}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sb{justify-content:space-between}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1.5px solid #e2e8f0;background:#fff;color:#475467;border-radius:99px;padding:7px 13px;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:#172554;color:#fff;border-color:#172554}
.pill{display:inline-flex;align-items:center;gap:4px;height:23px;border-radius:99px;padding:0 10px;font-size:11.5px;font-weight:800;white-space:nowrap}
.p-b{background:#eff4ff;color:#1e3a8a}.p-g{background:#ecfdf3;color:#067647}.p-gr{background:#f2f4f7;color:#475467}.p-y{background:#fffaeb;color:#b54708}.p-r{background:#fef3f2;color:#b42318}
.ql{display:flex;flex-direction:column;gap:10px}
.qi{display:flex;gap:12px;align-items:center;cursor:pointer;text-align:right;width:100%;border:1px solid #e6eefb;background:#fff;border-radius:16px;padding:14px;color:inherit}
.qi:hover{border-color:#bfd3fe}
.qi .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.qi b{font-size:14.5px;color:#172554}
.amt{font-family:Cairo,sans-serif;font-weight:900;color:#172554;white-space:nowrap}
.f label{display:block;font-size:12.5px;font-weight:800;color:#334766;margin-bottom:5px}
.f input,.f textarea,.f select{width:100%;border:1.5px solid #e2e8f0;border-radius:11px;padding:10px 12px;font-size:14.5px;background:#fff;color:#1e293b}
.f textarea{min-height:80px;resize:vertical}
.grid2{display:flex;gap:12px}.grid2>*{flex:1;min-width:0}
.ed{display:flex;gap:16px;align-items:flex-start}.ed .main{flex:1.7;min-width:0;display:flex;flex-direction:column;gap:14px}.ed .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;position:sticky;top:76px}
.seg{display:flex;background:#e2e8f0;border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:800;font-size:13px;color:#64748b;cursor:pointer}
.seg button.on{background:#fff;color:#172554;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.opt{border:1.5px solid #e2e8f0;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.opt.rec{border-color:#1e3a8a;background:#f8faff}
.it{display:flex;gap:6px;align-items:center}
.it input{border:1.5px solid #e2e8f0;border-radius:10px;padding:9px 10px;font-size:14px;min-width:0;background:#fff}
.it .t{flex:1}.it .q{width:58px;text-align:center}.it .p{width:96px}
.x{border:0;background:#fef3f2;color:#b42318;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:16px;flex:none}
.chk{display:flex;gap:8px;font-size:13px;font-weight:700;align-items:flex-start;line-height:1.6}
.attb{width:170px;height:170px;border-radius:50%;margin:8px auto;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:inherit;font-weight:900;color:#fff;font-size:20px;background:radial-gradient(circle at 35% 30%,#22c55e,#15803d);box-shadow:0 14px 32px rgba(21,128,61,.35);cursor:pointer}.attb small{font-size:12px;font-weight:700;opacity:.92}.attb.out{background:radial-gradient(circle at 35% 30%,#3b82f6,#1e3a8a);box-shadow:0 14px 32px rgba(30,58,138,.35)}.attb.done{background:#f1f5f9;color:#475467;box-shadow:none;cursor:default}.attb:disabled{opacity:.6}
.sheet-ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.sheet-ov{align-items:center}}
.sheet{background:#fff;width:min(480px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
@media(min-width:700px){.sheet{border-radius:20px}}
.bar{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid #e2e8f0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:15;box-shadow:0 -6px 20px rgba(30,58,138,.08)}
.bar .in{max-width:1180px;margin:0 auto;display:flex;gap:8px;align-items:center}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#172554;color:#fff;padding:11px 18px;border-radius:12px;font-weight:800;font-size:13.5px;z-index:99;display:none}
.empty{text-align:center;padding:40px 16px}
@media(max-width:820px){.ed{flex-direction:column}.ed .side{position:static;width:100%}.ed .main{width:100%}.grid2{flex-direction:column}}
.steps{display:flex;align-items:flex-start}.steps div{flex:1;text-align:center;font-size:11.5px;font-weight:800;color:#94a3b8;position:relative;padding-top:24px}.steps div:before{content:'';position:absolute;top:6px;left:50%;width:100%;height:3px;background:#e2e8f0}.steps div:first-child:before{display:none}.steps div i{position:absolute;top:0;right:calc(50% - 8px);width:16px;height:16px;border-radius:50%;background:#e2e8f0;z-index:1}.steps div.on{color:#1e3a8a}.steps div.on i,.steps div.on:before{background:#1e3a8a}
.ck{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #f1f5f9;font-size:14px;font-weight:700}.ck .b{width:28px;height:28px;border-radius:8px;border:2px solid #cbd5e1;background:#fff;flex:none;color:#fff;font-size:15px;cursor:pointer;font-weight:900}.ck.done .b{background:#16a34a;border-color:#16a34a}.ck.done .t{color:#94a3b8;text-decoration:line-through}
.phs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ph{width:84px;height:84px;border-radius:12px;background:#e2e8f0 center/cover;position:relative;display:block}.ph span{position:absolute;bottom:4px;right:4px;background:rgba(15,23,42,.7);color:#fff;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px}
.stars{display:flex;gap:6px;justify-content:center}.stars button{border:0;background:none;font-size:34px;color:#e2e8f0;cursor:pointer;line-height:1}.stars button.on{color:#f59e0b}
.wrap{max-width:680px}
</style>

<body>
<div class="top"><b>مناقصة <i>•</i></b><a href="/">الرئيسية</a></div>
<div class="wrap" id="app"><div class="mu">جارٍ التحميل…</div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
var TOK=''; try{TOK=localStorage.getItem('token')||'';}catch(e){}
var A=document.getElementById('app'), P=new URLSearchParams(location.search), S={items:[],j:null};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function login(){ try{localStorage.setItem('_after_login',location.pathname+location.search);}catch(e){} location.href='/auth.html'; }
if(!TOK){ A.innerHTML='<div class="card empty"><div style="font-size:40px">👷</div><b style="display:block;font-size:17px;margin-top:6px;color:#172554">مهام الفني</b><div class="mu" style="margin-top:8px;line-height:1.9">سجّل دخولك أو أنشئ حساباً <b>بنفس رقم جوالك</b> اللي أضافته المؤسسة، وتطلع لك مهامك هنا.</div><button class="btn pri" style="width:100%;margin-top:14px" id="lg">تسجيل الدخول</button></div>'; document.getElementById('lg').onclick=login; return; }
function api(p,o){o=o||{};o.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+TOK},o.headers||{});
  return fetch(p,o).then(function(r){ if(r.status===401){ login(); throw 0; } return r.json().then(function(j){ if(!r.ok){ var e=new Error(j.message||'حدث خطأ'); throw e; } return j; }); });}
function toast(t){ var e=document.getElementById('toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){e.style.display='none';},2600); }
function dt(x){ if(!x)return ''; try{ return new Date(x).toLocaleString('ar-SA-u-nu-latn-ca-gregory',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } }
var WATCH=null, LAST=0, WL=null, NBG=null;
// التطبيق (النسخة الجديدة) يكمّل إرسال الموقع حتى لو الشاشة مقفولة — الصفحة تطلب منه، والنسخ القديمة تكمّل بالطريقة العادية
function _nat(){ return !!(window.ReactNativeWebView&&window.MNQ_NATIVE&&window.MNQ_NATIVE.bgLoc); }
function _natSend(o){ try{ window.ReactNativeWebView.postMessage(JSON.stringify(o)); }catch(e){} }
function natStart(jid){ if(!_nat()||NBG===jid) return; NBG=jid; _natSend({type:'mnq_bg_loc',action:'start',job:jid,token:TOK,api:location.origin,title:(S.j&&S.j.title)||''}); }
function natStop(){ if(!window.ReactNativeWebView) return; NBG=null; _natSend({type:'mnq_bg_loc',action:'stop'}); }
window.addEventListener('mnq-native',function(ev){ var d=ev.detail||{}; if(d.type!=='bg_loc') return; var e=document.getElementById('shr');
  if(d.ok===false){ NBG=null; if(e) e.innerHTML='<b style="color:#b45309">الموقع يوصل بس والصفحة مفتوحة — للمشاركة والشاشة مقفولة اسمح لمناقصة بالموقع «دائماً» من الإعدادات</b>'; }
  else if(d.ok===true&&e){ e.textContent='نشارك موقعك حتى لو قفلت الشاشة — يوقف تلقائياً لما توصل'; } });
function stopShare(){ if(WATCH!==null&&navigator.geolocation){ navigator.geolocation.clearWatch(WATCH); } WATCH=null; try{ if(WL){ WL.release(); WL=null; } }catch(e){} }
function startShare(){ if(!S.j) return; natStart(S.j.id); if(WATCH!==null||!navigator.geolocation) return; var jid=S.j.id;
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){ WL=w; }).catch(function(){}); }catch(e){}
  WATCH=navigator.geolocation.watchPosition(function(pos){ var e=document.getElementById('shr'); if(Date.now()-LAST<30000) return; LAST=Date.now();
    api('/api/tech/jobs/'+jid,{method:'POST',body:JSON.stringify({act:'loc',lat:pos.coords.latitude,lng:pos.coords.longitude,acc:Math.round(pos.coords.accuracy||0)})}).then(function(){ if(e) e.textContent='آخر تحديث للموقع: الحين'; }).catch(function(){}); },
    function(err){ var e=document.getElementById('shr'); if(e) e.innerHTML='<b style="color:#b42318">ما قدرنا نوصل لموقعك — فعّل خدمة الموقع وسمح لمناقصة</b>'; }, {enableHighAccuracy:true,maximumAge:15000,timeout:20000}); }
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&S.j&&S.j.enroute_at&&!S.j.arrived_at){ LAST=0; stopShare(); startShare(); } });
function setUrl(q){ try{ history.replaceState(null,'',q?'?'+q:location.pathname); }catch(e){} }
function list(){
  setUrl(''); S.j=null;
  api('/api/tech/jobs').then(function(r){ S.items=r.items||[];
    if(!r.tech){ A.innerHTML='<div class="card empty"><div style="font-size:40px">👷</div><b style="display:block;font-size:17px;margin-top:6px;color:#172554">ما فيه مؤسسة أضافتك كفني</b><div class="mu" style="margin-top:8px;line-height:1.9">اطلب من المؤسسة تضيف رقم جوالك في «الفريق». لازم يكون نفس الرقم المسجّل في حسابك.</div></div>'; return; }
    var h='<div><div class="h1">مهام الفني</div><div class="mu" style="margin-top:3px">'+(S.items.length?S.items.length+' مهمة':'ما فيه مهام الحين')+'</div></div>';
    if(!S.items.length) h+='<div class="card empty"><div style="font-size:38px">✅</div><b style="display:block;margin-top:6px">ما عندك مهام الحين</b><div class="mu" style="margin-top:6px">يوصلك إشعار لما تنضاف لك مهمة.</div></div>';
    else h+='<div id="route"></div><div class="ql">'+S.items.map(function(j){ var dn=j.tasks.filter(function(t){return t.done;}).length;
      return '<button class="qi" onclick="_tOpen('+j.id+')"><div class="c"><div class="row" style="gap:6px"><b>'+esc(j.title)+'</b>'+(j.status==='active'?'<span class="pill p-g">قيد التنفيذ</span>':(j.status==='delivered'?'<span class="pill p-gr">انسلّم</span>':''))+'</div><span class="mu">'+esc(j.provider_name)+(j.sched_at?' · 🗓 '+dt(j.sched_at):'')+'</span><span class="mu">'+esc(j.address||'')+' · المهام '+dn+' من '+j.tasks.length+'</span></div><span style="font-size:20px;color:#94a3b8">‹</span></button>'; }).join('')+'</div>';
    A.innerHTML='<div id="att"></div>'+h; route(); att();
  }).catch(function(e){ if(e) A.innerHTML='<div class="card empty"><b>'+esc(e.message)+'</b></div>'; });
}
// ═══ الحضور والانصراف (لو المؤسسة مفعّلته) ═══
var DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function _tm(x){ try{ return new Date(x).toLocaleTimeString('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Riyadh'}); }catch(e){ return ''; } }
function _dd(y){ try{ return new Date(y+'T12:00:00Z').toLocaleDateString('ar-SA-u-nu-latn-ca-gregory',{weekday:'short',day:'numeric',month:'short'}); }catch(e){ return y; } }
function _hm(n){ n=Math.round(n||0); var h=Math.floor(n/60), m=n%60; return [h?h+'س':'',(m||!h)?m+'د':''].filter(Boolean).join(' '); }
function _h12(s){ var p=String(s||'').split(':'), h=+p[0], m=p[1]||'00'; return (h%12||12)+':'+m+(h<12?' ص':' م'); }
function att(){ api('/api/tech/att').then(function(r){ var el=document.getElementById('att'); if(!el||!r.items||!r.items.length) return; S.att=r.items;
  el.innerHTML=r.items.map(function(a){ var t=a.today, sc=a.sched, wd=sc.days.map(function(d){return DN[d];}).join('، ');
    var big=!t?'<button class="attb" onclick="_aIn('+a.tech_id+')"><span>بدأت دوامي</span><small>اضغط للتسجيل</small></button>':(!t.out_at?'<button class="attb out" onclick="_aOut('+a.tech_id+')"><span>خلّصت دوامي</span><small>حضرت '+_tm(t.in_at)+(t.late_min?' · متأخر '+_hm(t.late_min):'')+'</small></button>':'<div class="attb done"><span>✓ انتهى دوامك</span><small>'+_tm(t.in_at)+' – '+_tm(t.out_at)+' · '+_hm(t.mins)+'</small></div>');
    var ok=a.last.filter(function(x){return !x.late_min;}).length;
    var last=a.last.length?'<div class="card"><div class="row sb"><b style="color:#172554">'+(a.last.length===1?'آخر يوم':'آخر '+a.last.length+' أيام')+'</b><span class="pill '+(ok===a.last.length?'p-g':'p-y')+'">ملتزم '+ok+' من '+a.last.length+'</span></div>'+a.last.map(function(x){ return '<div class="row" style="padding:9px 0;border-top:1px solid #f1f5f9;flex-wrap:nowrap"><span style="width:9px;height:9px;border-radius:50%;background:'+(x.late_min?'#d97706':'#16a34a')+';flex:none"></span><div style="flex:1"><b style="font-size:13.5px">'+esc(new Date(x.day+'T12:00:00Z').toLocaleDateString('ar-SA-u-nu-latn-ca-gregory',{weekday:'long',day:'numeric',month:'short'}))+'</b><div class="mu">'+_tm(x.in_at)+(x.out_at?' – '+_tm(x.out_at)+' · '+_hm(x.mins):' – …')+'</div></div><span class="pill '+(x.late_min?'p-y':'p-g')+'">'+(x.late_min?'تأخير '+_hm(x.late_min):'بالوقت')+'</span></div>'; }).join('')+'</div>':'';
    var lv=(a.leaves||[]).slice(0,3).map(function(l){ return '<div class="row sb" style="padding:7px 0;border-top:1px solid #f1f5f9"><span style="font-size:13px;font-weight:800">🌴 '+esc(l.d1===l.d2?_dd(l.d1):_dd(l.d1)+' ← '+_dd(l.d2))+'</span><span class="pill '+({pending:'p-y',approved:'p-g',rejected:'p-r'}[l.status])+'">'+({pending:'بانتظار الرد',approved:'معتمدة',rejected:'مرفوضة'}[l.status])+'</span></div>'; }).join('');
    return '<div class="card" style="text-align:center;display:flex;flex-direction:column;gap:6px"><div class="mu" style="text-align:right">'+(r.items.length>1?'<b style="color:#172554">'+esc(a.pname)+'</b> · ':'')+'دوامك: '+esc(wd)+' · '+_h12(sc.from)+' – '+_h12(sc.to)+'</div>'+big+'<div class="mu">📍 يتسجّل وقت وموقع الضغطة</div></div>'+last
      +'<div class="card" style="padding:12px 14px"><div class="row sb"><b style="color:#172554">🌴 الإجازات</b><button class="btn sec" style="padding:7px 12px" onclick="_aLv('+a.tech_id+')">اطلب إجازة</button></div>'+lv+'</div>'
      +(!t?'<div class="mu" style="background:#f5f8ff;border:1px dashed #c7d6f5;border-radius:12px;padding:10px 12px;line-height:1.7">نسيت تسجّل؟ أول ما تضغط «وصلت» على أول مشروع تنحسب بداية دوامك تلقائياً.</div>':''); }).join('');
}).catch(function(){}); }
function _aGeo(cb){ var done=false, f=function(p){ if(done)return; done=true; cb(p); }; if(!navigator.geolocation) return f(null); navigator.geolocation.getCurrentPosition(function(p){ f({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)}); },function(){ f(null); },{enableHighAccuracy:true,timeout:6000,maximumAge:60000}); setTimeout(function(){ f(null); },7000); }
function _aPost(b,msg){ return api('/api/tech/att',{method:'POST',body:JSON.stringify(b)}).then(function(r){ toast(r.message||msg); att(); }).catch(function(e){ if(e)toast(e.message); att(); }); }
window._aIn=function(tid){ var b=event&&event.currentTarget; if(b)b.disabled=true; _aGeo(function(g){ _aPost(Object.assign({tech_id:tid,act:'in'},g||{}),'سجّلنا حضورك ✅ — يومك سعيد'); }); };
window._aOut=function(tid){ if(!confirm('تسجّل نهاية دوامك؟'))return; _aGeo(function(g){ _aPost(Object.assign({tech_id:tid,act:'out'},g||{}),'سجّلنا انصرافك — يعطيك العافية'); }); };
window._aLv=function(tid){ var o=document.createElement('div'); o.className='sheet-ov'; o.id='sh'; o.onclick=function(e){ if(e.target===o)o.remove(); };
  var td=new Date(Date.now()+864e5).toISOString().slice(0,10);
  o.innerHTML='<div class="sheet f"><b style="font-size:17px;color:#172554">🌴 اطلب إجازة</b><div class="grid2"><div><label for="lv1">من</label><input id="lv1" type="date" value="'+td+'"></div><div><label for="lv2">إلى</label><input id="lv2" type="date" value="'+td+'"></div></div><div><label for="lvr">السبب (اختياري)</label><input id="lvr" maxlength="200" placeholder="مثال: موعد في المستشفى"></div><button class="btn pri" id="lvgo">أرسل الطلب للمشرف</button><button class="btn sec" onclick="document.getElementById(\'sh\').remove()">إلغاء</button></div>';
  document.body.appendChild(o);
  document.getElementById('lvgo').onclick=function(){ this.disabled=true; var d1=document.getElementById('lv1').value; _aPost({tech_id:tid,act:'leave',d1:d1,d2:document.getElementById('lv2').value||d1,reason:document.getElementById('lvr').value},'وصل طلبك للمشرف').then(function(){ o.remove(); }); };
};
// زيارات اليوم مرتبة حسب الأقرب
function route(){ if(!window.MNQ_ROUTE) return; var td=new Date().toDateString();
  var T=S.items.filter(function(j){ return j.sched_at&&new Date(j.sched_at).toDateString()===td&&['new','scheduled','active'].indexOf(j.status)>=0&&!j.arrived_at; });
  if(T.length<2) return;
  MNQ_ROUTE.here(function(me){ var r=MNQ_ROUTE.plan(T,me); var el=document.getElementById('route'); if(!r||!el) return;
    var save=r.base-r.km;
    el.innerHTML='<div class="card" style="background:linear-gradient(135deg,#172554,#1e3a8a);color:#fff;border:0"><b style="font-size:15.5px">🧭 رتّبنا زيارات اليوم حسب الأقرب</b><div style="font-size:12.5px;opacity:.85;font-weight:700;margin-top:4px">المسافة تقريباً '+r.km+' كم'+(save>1?' بدل '+r.base+' كم — توفّر '+save+' كم':'')+'</div>'
      +'<div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">'+r.order.map(function(j,i){ return '<button onclick="_tOpen('+j.id+')" style="display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.1);border:0;border-radius:12px;padding:9px 10px;color:#fff;font-family:inherit;text-align:right;cursor:pointer"><span style="width:26px;height:26px;border-radius:50%;background:#fbbf24;color:#172554;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none">'+(i+1)+'</span><span style="flex:1;min-width:0"><b style="display:block;font-size:13.5px">'+esc(j.title)+'</b><span style="font-size:11.5px;opacity:.8">'+esc(j.address||'')+(j.sched_at?' · '+dt(j.sched_at):'')+'</span></span><span style="font-size:11.5px;opacity:.8">'+r.legs[i]+' كم</span></button>'; }).join('')+'</div>'
      +'<a class="btn" style="background:#fbbf24;color:#172554;margin-top:10px;width:100%" target="_blank" rel="noopener" href="'+r.url+'">افتح المسار كامل في خرائط Google</a>'+(r.skipped.length?'<div style="font-size:11.5px;opacity:.75;margin-top:6px">'+r.skipped.length+' زيارة بدون موقع على الخريطة — ما دخلت في الترتيب</div>':'')+'</div>'; }); }
window._tOpen=function(id){ setUrl('id='+id); api('/api/tech/jobs/'+id).then(function(j){ S.j=j; draw(); }).catch(function(e){ if(e){ toast(e.message); list(); } }); };
function draw(){
  var j=S.j, open=['new','scheduled','active'].indexOf(j.status)>=0, dn=j.tasks.filter(function(t){return t.done;}).length;
  var h='<div class="row" style="gap:8px"><button class="btn sec" style="padding:7px 11px" onclick="_tBack()">‹ المهام</button></div><div><div class="mu">'+esc(j.provider_name)+(j.sched_at?' · '+dt(j.sched_at):'')+'</div><div class="h1" style="font-size:20px">'+esc(j.title)+'</div><div class="mu">'+esc(j.client_name||'')+(j.address?' · '+esc(j.address):'')+'</div></div>';
  h+='<div class="row" style="flex-wrap:nowrap">'+(j.maps?'<a class="btn sec" style="flex:1" target="_blank" rel="noopener" href="'+esc(j.maps)+'">📍 الموقع</a>':'')+(j.client_phone?'<a class="btn sec" style="flex:1" href="tel:'+esc(j.client_phone)+'">📞 اتصال بالعميل</a>':'')+'</div>';
  if(!open) h+='<div class="card" style="background:#f8fafc"><b>انسلّم المشروع — شكراً لك</b></div>';
  else if(!j.arrived_at){ if(!j.enroute_at) h+='<button class="btn sec" style="padding:13px;font-size:15px" id="enr" onclick="_tEnr()">🚗 في الطريق</button>';
    else h+='<div class="card" style="background:#eff4ff;border-color:#bfd3fe;padding:12px 14px"><b style="color:#1e3a8a">📍 نشارك موقعك مع المؤسسة والعميل لين توصل</b><div class="mu" style="margin-top:3px">خلّ الصفحة مفتوحة · يوقف تلقائياً لما تضغط «وصلت»</div><div class="mu" id="shr" style="margin-top:3px">جاري تحديد موقعك…</div></div>';
    h+='<button class="btn" style="background:#16a34a;color:#fff;padding:14px;font-size:16px" id="arr" onclick="_tArr()">✓ وصلت الموقع</button>'; }
  else h+='<div class="pill p-g" style="align-self:flex-start;height:28px">📍 وصلت '+dt(j.arrived_at)+'</div>';
  h+='<div class="card"><div class="row sb" style="margin-bottom:4px"><span class="h3">المهام</span><span class="pill p-b">'+dn+' من '+j.tasks.length+'</span></div>'+j.tasks.map(function(t){ return '<button class="ck'+(t.done?' done':'')+'" style="width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:right;cursor:pointer;font-family:inherit;color:inherit" '+(open?'onclick="_tTask(\''+esc(t.id)+'\')"':'disabled')+'><span class="b">'+(t.done?'✓':'')+'</span><span class="t" style="flex:1">'+esc(t.t)+'</span></button>'; }).join('')+'</div>';
  h+='<div class="card"><div class="row sb"><span class="h3">الصور</span></div><div class="phs">'+j.photos.map(function(p){ return '<a href="'+esc(p.url)+'" target="_blank" rel="noopener" class="ph" style="background-image:url(&quot;'+esc(p.url)+'&quot;)"><span>'+(p.kind==='before'?'قبل':'بعد')+'</span></a>'; }).join('')+'</div>'+(open?'<div class="row" style="margin-top:10px;flex-wrap:nowrap"><label class="btn sec" style="flex:1;cursor:pointer">📷 صورة قبل<input type="file" accept="image/*" capture="environment" style="display:none" onchange="_tPh(this,\'before\')"></label><label class="btn sec" style="flex:1;cursor:pointer">📷 صورة بعد<input type="file" accept="image/*" capture="environment" style="display:none" onchange="_tPh(this,\'after\')"></label></div>':'')+'</div>';
  (j.extras||[]).forEach(function(e){ h+='<div class="row sb card" style="padding:12px 14px;font-size:13.5px;font-weight:700"><span>عمل إضافي: '+esc(e.descr)+'</span><span class="pill '+({tech:'p-y',sent:'p-y',approved:'p-g',declined:'p-r',dropped:'p-gr'}[e.status]||'p-gr')+'">'+({tech:'عند المؤسسة',sent:'عند العميل',approved:'وافق العميل',declined:'رفض العميل',dropped:'ملغي'}[e.status]||'')+'</span></div>'; });
  if((j.costs||[]).length) h+='<div class="card"><span class="h3">مصاريفك على المشروع</span>'+j.costs.map(function(c){ return '<div class="row sb" style="padding:8px 0;border-top:1px solid #f1f5f9;font-size:13.5px;font-weight:700"><span>'+esc(c.title)+(c.photo?' · <a href="'+esc(c.photo)+'" target="_blank" rel="noopener" style="color:#1e3a8a">📎 الفاتورة</a>':'')+'</span><b>'+Number(c.amount).toLocaleString('en-US')+' ر.س</b></div>'; }).join('')+'</div>';
  if(open) h+='<button class="btn sec" style="padding:13px" onclick="_tCost()">+ مصروف (مواد، نقل…)</button>';
  if(open) h+='<button class="btn sec" style="padding:13px" onclick="_tDev()">+ سجّل جهاز عند العميل</button><button class="btn sec" style="padding:13px" onclick="_tExtra()">+ عمل إضافي (يحتاج موافقة)</button>'+(j.finished_at?'<div class="pill p-b" style="align-self:center;height:28px">🏁 بلّغت المؤسسة إنك خلّصت</div>':'<button class="btn pri" style="padding:14px;font-size:15px" onclick="_tFin()">خلّصت — أبلغ المؤسسة</button>');
  A.innerHTML=h;
  if(open&&j.enroute_at&&!j.arrived_at) startShare(); else stopShare();
}
function act(b){ return api('/api/tech/jobs/'+S.j.id,{method:'POST',body:JSON.stringify(b)}); }
function re(msg){ return api('/api/tech/jobs/'+S.j.id).then(function(j){ S.j=j; draw(); if(msg)toast(msg); }); }
window._tBack=function(){ stopShare(); list(); };
window._tEnr=function(){ var b=document.getElementById('enr'); b.disabled=true; act({act:'enroute'}).then(function(){ re('بلّغنا العميل إنك في الطريق'); }).catch(function(e){ b.disabled=false; if(e)toast(e.message); }); };
window._tArr=function(){ var b=document.getElementById('arr'); b.disabled=true; stopShare(); natStop(); var go=function(p){ return act(Object.assign({act:'arrive'},p||{})); }; (window.MNQ_ROUTE?new Promise(function(ok){ if(!navigator.geolocation) return ok(null); var dn=0; setTimeout(function(){ if(!dn){dn=1;ok(null);} },4000); navigator.geolocation.getCurrentPosition(function(x){ if(dn)return; dn=1; ok({lat:x.coords.latitude,lng:x.coords.longitude,acc:x.coords.accuracy}); },function(){ if(dn)return; dn=1; ok(null); },{enableHighAccuracy:true,timeout:3800,maximumAge:60000}); }):Promise.resolve(null)).then(go).then(function(){ re('تم — بلّغنا المؤسسة والعميل'); }).catch(function(e){ b.disabled=false; if(e)toast(e.message); }); };
window._tTask=function(tid){ act({act:'task',tid:tid}).then(function(){ re(); }).catch(function(e){ if(e)toast(e.message); }); };
window._tFin=function(){ var left=S.j.tasks.filter(function(t){return !t.done;}).length; if(!confirm(left?'باقي '+left+' مهام ما علّمت عليها. تبلّغ إنك خلّصت؟':'تبلّغ المؤسسة إنك خلّصت؟'))return; act({act:'finish'}).then(function(){ re('بلّغنا المؤسسة'); }).catch(function(e){ if(e)toast(e.message); }); };
function shrink(f,cb){ var rd=new FileReader(); rd.onload=function(){ var im=new Image(); im.onload=function(){ var w=Math.min(1280,im.width), c=document.createElement('canvas'); c.width=w; c.height=Math.round(im.height*w/im.width); c.getContext('2d').drawImage(im,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.8)); }; im.src=rd.result; }; rd.readAsDataURL(f); }
window._tPh=function(inp,k){ var f=inp.files&&inp.files[0]; if(!f)return; toast('جارٍ الرفع…'); shrink(f,function(d){ act({act:'photo',data:d,kind:k}).then(function(){ re('انرفعت'); }).catch(function(e){ if(e)toast(e.message); }); }); };
window._tDev=function(){ var o=document.createElement('div'); o.className='sheet-ov'; o.id='sh'; o.onclick=function(e){ if(e.target===o)o.remove(); };
  o.innerHTML='<div class="sheet f"><b style="font-size:17px;color:#172554">جهاز عند العميل</b><div><label for="dv-n">نوع الجهاز</label><input id="dv-n" maxlength="100" placeholder="مثال: مكيف سبليت"></div><div class="grid2"><div><label for="dv-b">الماركة</label><input id="dv-b" maxlength="60"></div><div><label for="dv-q">العدد</label><input id="dv-q" inputmode="numeric" maxlength="3" value="1"></div></div><div><label for="dv-p">المكان</label><input id="dv-p" maxlength="80" placeholder="مثال: الصالة"></div><button class="btn pri" id="dv-go">حفظ</button><button class="btn" style="background:transparent;color:#64748b" onclick="document.getElementById(\'sh\').remove()">رجوع</button></div>';
  document.body.appendChild(o);
  document.getElementById('dv-go').onclick=function(){ var b=this; b.disabled=true; act({act:'device',name:document.getElementById('dv-n').value,brand:document.getElementById('dv-b').value,qty:document.getElementById('dv-q').value,place:document.getElementById('dv-p').value}).then(function(){ o.remove(); re('انحفظ الجهاز'); }).catch(function(e){ b.disabled=false; if(e)toast(e.message); }); };
};
window._tCost=function(){ var o=document.createElement('div'); o.className='sheet-ov'; o.id='sh'; o.onclick=function(e){ if(e.target===o)o.remove(); }; var PH=null;
  o.innerHTML='<div class="sheet f" style="display:flex;flex-direction:column;gap:12px"><b style="font-size:17px;color:#172554">مصروف على المشروع</b><div class="mu">يشوفه صاحب المؤسسة بس — العميل ما يشوفه</div><div><label>البند</label><input id="cs-t" maxlength="120" placeholder="مثال: نحاس وعوازل"></div><div><label>المبلغ (ر.س)</label><input id="cs-a" inputmode="decimal" maxlength="9"></div><label class="btn sec" style="cursor:pointer" id="cs-pl">📎 صورة الفاتورة (اختياري)<input type="file" accept="image/*" style="display:none" id="cs-p"></label><button class="btn pri" id="cs-go">إضافة</button></div>';
  document.body.appendChild(o);
  document.getElementById('cs-p').onchange=function(){ var f=this.files&&this.files[0]; if(!f)return; shrink(f,function(d){ PH=d; document.getElementById('cs-pl').firstChild.textContent='✓ انرفقت الفاتورة'; }); };
  document.getElementById('cs-go').onclick=function(){ var b=this; b.disabled=true; var a=String(document.getElementById('cs-a').value||'').replace(/[٠-٩]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'.indexOf(c);}).replace(/[^\d.]/g,'');
    act({act:'cost',title:document.getElementById('cs-t').value,amount:a,photo:PH}).then(function(){ o.remove(); re('انضاف المصروف'); }).catch(function(e){ b.disabled=false; if(e)toast(e.message); }); };
};
window._tExtra=function(){ var o=document.createElement('div'); o.className='sheet-ov'; o.id='sh'; o.onclick=function(e){ if(e.target===o)o.remove(); };
  o.innerHTML='<div class="sheet f"><b style="font-size:17px;color:#172554">عمل إضافي</b><div class="mu">المؤسسة تحدد السعر وترسله للعميل يوافق.</div><div><label for="ex-d">وش العمل الإضافي؟</label><textarea id="ex-d" maxlength="200" placeholder="مثال: المكثف في الوحدة 3 تالف ويحتاج تغيير"></textarea></div><label class="btn sec" style="cursor:pointer" id="ex-pl">📷 صورة (اختياري)<input type="file" accept="image/*" capture="environment" style="display:none" id="ex-f"></label><button class="btn pri" id="ex-go">أرسل للمؤسسة</button><button class="btn" style="background:transparent;color:#64748b" onclick="document.getElementById(\'sh\').remove()">رجوع</button></div>';
  document.body.appendChild(o); var ph=null;
  document.getElementById('ex-f').onchange=function(){ var f=this.files&&this.files[0]; if(f) shrink(f,function(d){ ph=d; document.getElementById('ex-pl').firstChild.textContent='✓ الصورة جاهزة '; }); };
  document.getElementById('ex-go').onclick=function(){ var b=this; b.disabled=true; act({act:'extra',descr:document.getElementById('ex-d').value,photo:ph}).then(function(){ o.remove(); re('أُرسل للمؤسسة'); }).catch(function(e){ b.disabled=false; if(e)toast(e.message); }); };
};
var id=parseInt(P.get('id')); if(id) _tOpen(id); else list();
})();
</script>
