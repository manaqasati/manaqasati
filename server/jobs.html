<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Cairo:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,sans-serif;background:#f0f5ff;color:#1e293b;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit}
.top{height:62px;background:#172554;border-bottom:3px solid #0ea5e9;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff;position:sticky;top:0;z-index:20}
.top b{font-size:21px;font-weight:900}.top b i{color:#38bdf8;font-style:normal}
.top a{color:#fff;text-decoration:none;font-size:13px;font-weight:800;opacity:.85}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 110px;display:flex;flex-direction:column;gap:14px}
.h1{font-size:22px;font-weight:900;color:#172554}.mu{color:#64748b;font-size:12.5px;font-weight:700}
.card{background:#fff;border:1px solid #e6eefb;border-radius:18px;box-shadow:0 2px 10px rgba(30,58,138,.05);padding:18px}
.h3{font-size:15px;font-weight:900;color:#172554}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 15px;font-weight:800;font-size:13.5px;border:0;cursor:pointer;white-space:nowrap;text-decoration:none}
.pri{background:#1e3a8a;color:#fff}.sec{background:#fff;border:1.5px solid #e2e8f0;color:#1e293b}.wa{background:#16a34a;color:#fff}.dan{background:#fff;border:1.5px solid #fecdca;color:#b42318}.gold{background:#fffbeb;border:1.5px solid #fde68a;color:#1e3a8a}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sb{justify-content:space-between}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1.5px solid #e2e8f0;background:#fff;color:#475467;border-radius:99px;padding:7px 13px;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:#172554;color:#fff;border-color:#172554}
.pill{display:inline-flex;align-items:center;gap:4px;height:23px;border-radius:99px;padding:0 10px;font-size:11.5px;font-weight:800;white-space:nowrap}
.p-b{background:#eff4ff;color:#1e3a8a}.p-g{background:#ecfdf3;color:#067647}.p-gr{background:#f2f4f7;color:#475467}.p-y{background:#fffaeb;color:#b54708}.p-r{background:#fef3f2;color:#b42318}
.ql{display:flex;flex-direction:column;gap:10px}
.qi{display:flex;gap:12px;align-items:center;cursor:pointer;text-align:right;width:100%;border:1px solid #e6eefb;background:#fff;border-radius:16px;padding:14px;color:inherit}
.qi:hover{border-color:#bfd3fe}
.qi .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.qi b{font-size:14.5px;color:#172554}
.amt{font-family:Cairo,sans-serif;font-weight:900;color:#172554;white-space:nowrap}
.f label{display:block;font-size:12.5px;font-weight:800;color:#334766;margin-bottom:5px}
.f input,.f textarea,.f select{width:100%;border:1.5px solid #e2e8f0;border-radius:11px;padding:10px 12px;font-size:14.5px;background:#fff;color:#1e293b}
.f textarea{min-height:80px;resize:vertical}
.grid2{display:flex;gap:12px}.grid2>*{flex:1;min-width:0}
.ed{display:flex;gap:16px;align-items:flex-start}.ed .main{flex:1.7;min-width:0;display:flex;flex-direction:column;gap:14px}.ed .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;position:sticky;top:76px}
.seg{display:flex;background:#e2e8f0;border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:800;font-size:13px;color:#64748b;cursor:pointer}
.seg button.on{background:#fff;color:#172554;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.opt{border:1.5px solid #e2e8f0;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.opt.rec{border-color:#1e3a8a;background:#f8faff}
.it{display:flex;gap:6px;align-items:center}
.it input{border:1.5px solid #e2e8f0;border-radius:10px;padding:9px 10px;font-size:14px;min-width:0;background:#fff}
.it .t{flex:1}.it .q{width:58px;text-align:center}.it .p{width:96px}
.x{border:0;background:#fef3f2;color:#b42318;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:16px;flex:none}
.chk{display:flex;gap:8px;font-size:13px;font-weight:700;align-items:flex-start;line-height:1.6}
.sheet-ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.sheet-ov{align-items:center}}
.sheet{background:#fff;width:min(480px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
@media(min-width:700px){.sheet{border-radius:20px}}
.bar{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid #e2e8f0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:15;box-shadow:0 -6px 20px rgba(30,58,138,.08)}
.bar .in{max-width:1180px;margin:0 auto;display:flex;gap:8px;align-items:center}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#172554;color:#fff;padding:11px 18px;border-radius:12px;font-weight:800;font-size:13.5px;z-index:99;display:none}
.empty{text-align:center;padding:40px 16px}
@media(max-width:820px){.ed{flex-direction:column}.ed .side{position:static;width:100%}.ed .main{width:100%}.grid2{flex-direction:column}}
.steps{display:flex;align-items:flex-start}.steps div{flex:1;text-align:center;font-size:11.5px;font-weight:800;color:#94a3b8;position:relative;padding-top:24px}.steps div:before{content:'';position:absolute;top:6px;left:50%;width:100%;height:3px;background:#e2e8f0}.steps div:first-child:before{display:none}.steps div i{position:absolute;top:0;right:calc(50% - 8px);width:16px;height:16px;border-radius:50%;background:#e2e8f0;z-index:1}.steps div.on{color:#1e3a8a}.steps div.on i,.steps div.on:before{background:#1e3a8a}
.ck{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #f1f5f9;font-size:14px;font-weight:700}.ck .b{width:28px;height:28px;border-radius:8px;border:2px solid #cbd5e1;background:#fff;flex:none;color:#fff;font-size:15px;cursor:pointer;font-weight:900}.ck.done .b{background:#16a34a;border-color:#16a34a}.ck.done .t{color:#94a3b8;text-decoration:line-through}
.phs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ph{width:84px;height:84px;border-radius:12px;background:#e2e8f0 center/cover;position:relative;display:block}.ph span{position:absolute;bottom:4px;right:4px;background:rgba(15,23,42,.7);color:#fff;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px}
</style>
<script>/* تطبيق الأيفون: بدون روابط لشراء الاشتراك (قاعدة Apple) */(function(){try{if(window.ReactNativeWebView&&/iPhone|iPad|iPod/i.test(navigator.userAgent||"")&&!(window.MNQ_NATIVE&&window.MNQ_NATIVE.iap)){var st=document.createElement("style");st.textContent='a[href="/plan.html"],a[href^="/plan.html?"]{display:none!important}';document.head.appendChild(st);}}catch(e){}})();</script><script src="/branch.js?v=1"></script><script src="/route.js?v=1"></script></head>
<body>
<div class="top"><b>مناقصة <i>•</i></b><a href="/dashboard-provider.html">‹ لوحة التحكم</a></div>
<div class="wrap" id="app"><div class="mu">جارٍ التحميل…</div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
var TOK=''; try{TOK=localStorage.getItem('token')||'';}catch(e){}
if(!TOK){ try{localStorage.setItem('_after_login',location.pathname+location.search);}catch(e){} location.href='/auth.html'; return; }
var A=document.getElementById('app'), P=new URLSearchParams(location.search);
var S={tab:'open', items:[], live:false, limit:0, j:null, team:null};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function api(p,o){o=o||{};o.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+TOK},window.MNQ_BR?MNQ_BR.h():{},o.headers||{});
  return fetch(p,o).then(function(r){ if(r.status===401){ try{localStorage.setItem('_after_login',location.pathname+location.search);}catch(e){} location.href='/auth.html'; throw 0; } return r.json().then(function(j){ if(!r.ok){ var e=new Error(j.message||'حدث خطأ'); e.j=j; throw e; } return j; }); });}
function toast(t){ var e=document.getElementById('toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){e.style.display='none';},2600); }
function m(v){ return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:2}); }
function dt(x){ if(!x)return ''; try{ return new Date(x).toLocaleString('ar-SA-u-nu-latn-ca-gregory',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } }
function wa(ph){ ph=String(ph||'').replace(/\D/g,''); if(ph.indexOf('05')===0)ph='966'+ph.slice(1); else if(ph.length===9&&ph[0]==='5')ph='966'+ph; return ph; }
function setUrl(q){ try{ history.replaceState(null,'',q?'?'+q:location.pathname); }catch(e){} }
var STC={new:'p-y',scheduled:'p-b',active:'p-g',delivered:'p-y',done:'p-gr',cancelled:'p-gr'};
var STEPS=[['موافقة','new'],['موعد','scheduled'],['قيد التنفيذ','active'],['تسليم','delivered'],['مكتمل','done']];
function steps(st){ var k=['new','scheduled','active','delivered','done'].indexOf(st); return '<div class="steps">'+STEPS.map(function(s,i){ return '<div class="'+(i<=k?'on':'')+'"><i></i>'+s[0]+'</div>'; }).join('')+'</div>'; }
function _ll(){ if(window.L) return Promise.resolve(); if(window._llP) return window._llP; window._llP=new Promise(function(ok,no){ var c=document.createElement('link'); c.rel='stylesheet'; c.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(c); var s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); return window._llP; }
function _ago(x){ var s=Math.max(0,Math.round((Date.now()-new Date(x))/1000)); return s<60?'قبل '+s+' ثانية':'قبل '+Math.round(s/60)+' دقيقة'; }
var _mp=null,_mt=null;
window._jMap=function(){ S.view='map'; setUrl('map=1'); clearTimeout(_mt);
  api('/api/jobs/map').then(function(r){ if(S.view!=='map') return;
    var h='<div class="row sb"><div class="row" style="gap:8px"><button class="btn sec" style="padding:7px 11px" onclick="_jBack()">‹ رجوع</button><span class="h1" style="font-size:19px">🗺 الخريطة اللايف</span></div><span class="mu">'+r.items.length+' في الطريق · تتحدّث كل 20 ثانية</span></div>';
    h+='<div class="ed"><div class="main"><div class="card" style="padding:0;overflow:hidden"><div id="lmap" style="height:520px;background:#e2e8f0"></div></div></div><div class="side"><div class="card"><span class="h3">في الطريق</span>'+(r.items.length?r.items.map(function(x){ return '<div class="ck" style="cursor:pointer" onclick="_jOpen('+x.id+')"><span style="font-size:20px">🚗</span><div style="flex:1;min-width:0"><b style="display:block">'+esc(x.tech_name||'فني')+'</b><span class="mu">'+esc(x.title)+(x.at?' · '+_ago(x.at):' · ننتظر أول موقع')+'</span></div></div>'; }).join(''):'<div class="mu" style="padding:8px 0">ما فيه فنيين في الطريق الحين. لما يضغط الفني «في الطريق» يظهر هنا.</div>')+'</div>';
    // أفضل مسار لكل فني (حسب الأقرب)
    var byT={}; r.today.forEach(function(x){ if(x.arrived_at||!x.tech_id) return; (byT[x.tech_id]=byT[x.tech_id]||[]).push(x); });
    Object.keys(byT).forEach(function(k){ var p=window.MNQ_ROUTE&&MNQ_ROUTE.plan(byT[k],null); if(!p) return; h+='<div class="card"><span class="h3">🧭 أفضل مسار — '+esc(byT[k][0].tech_name||'')+'</span><div class="mu" style="margin-top:2px">'+p.km+' كم تقريباً'+(p.base-p.km>1?' بدل '+p.base+' كم':'')+'</div>'+p.order.map(function(x,i){ return '<div class="ck" style="cursor:pointer" onclick="_jOpen('+x.id+')"><span style="width:24px;height:24px;border-radius:50%;background:#1e3a8a;color:#fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none">'+(i+1)+'</span><div style="flex:1;min-width:0"><b style="display:block;font-size:13.5px">'+esc(x.title)+'</b><span class="mu">'+esc(x.address||'')+' · '+dt(x.sched_at)+'</span></div></div>'; }).join('')+'<a class="btn sec" style="margin-top:8px;width:100%" target="_blank" rel="noopener" href="'+p.url+'">افتح المسار في خرائط Google</a></div>'; });
    h+='<div class="card"><span class="h3">مواعيد اليوم</span>'+(r.today.length?r.today.map(function(x){ return '<div class="ck" style="cursor:pointer" onclick="_jOpen('+x.id+')"><span>'+(x.arrived_at?'✅':'🗓')+'</span><div style="flex:1;min-width:0"><b style="display:block;font-size:13.5px">'+esc(x.title)+'</b><span class="mu">'+dt(x.sched_at)+(x.tech_name?' · '+esc(x.tech_name):'')+(x.arrived_at?' · وصل':'')+'</span></div></div>'; }).join(''):'<div class="mu" style="padding:8px 0">ما فيه مواعيد اليوم</div>')+'</div><div class="mu">نعرض آخر موقع بس وقت «في الطريق» — ما نحفظ مسار الفني، وينمسح بعد 24 ساعة.</div></div></div>';
    A.innerHTML=h;
    _ll().then(function(){ var el=document.getElementById('lmap'); if(!el||!window.L) return; var pts=r.items.filter(function(x){return x.lat;});
      _mp=L.map(el).setView(pts.length?[pts[0].lat,pts[0].lng]:[24.7136,46.6753],pts.length?12:10); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(_mp);
      pts.forEach(function(x){ L.marker([x.lat,x.lng],{icon:L.divIcon({className:'',html:'<div style="width:36px;height:36px;border-radius:50%;background:#1e3a8a;color:#fff;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-weight:900;font-family:Tajawal">'+esc((x.tech_name||'ف')[0])+'</div>',iconSize:[36,36],iconAnchor:[18,18]})}).addTo(_mp).bindPopup('<b>'+esc(x.tech_name||'')+'</b><br>'+esc(x.title)+'<br>'+_ago(x.at)); });
      if(pts.length>1) _mp.fitBounds(pts.map(function(x){return [x.lat,x.lng];}),{padding:[40,40]}); }).catch(function(){ var el=document.getElementById('lmap'); if(el) el.innerHTML='<div class="mu" style="padding:20px">تعذّر تحميل الخريطة</div>'; });
    _mt=setTimeout(function(){ if(S.view==='map') _jMap(); },20000);
  }).catch(function(e){ if(!e) return; A.innerHTML='<div class="row" style="gap:8px"><button class="btn sec" style="padding:7px 11px" onclick="_jBack()">‹ رجوع</button></div><div class="card" style="background:linear-gradient(135deg,#172554,#1e3a8a);color:#fff;border:0"><div style="font-size:17px;font-weight:900">الخريطة اللايف من مزايا باقة مؤسسة</div><div style="font-size:13.5px;opacity:.85;font-weight:700;line-height:1.9;margin-top:6px">شوف فنيينك على الخريطة وهم في الطريق لعملائك. زر «في الطريق» وإشعار العميل شغّالين في باقتك الحين.</div><a class="btn" style="background:#fbbf24;color:#172554;margin-top:12px" href="/plan.html">الاشتراك والباقة</a></div>'; });
};
function load(){ return api('/api/jobs').then(function(r){ S.items=r.items||[]; S.live=!!r.live; S.limit=r.limit||0; }); }
function lockCard(){ return '<div class="card" style="background:linear-gradient(135deg,#172554,#1e3a8a);color:#fff;border:0"><div style="font-size:17px;font-weight:900">المشاريع والفريق من مزايا الاشتراك</div><div style="font-size:13.5px;opacity:.85;font-weight:700;line-height:1.9;margin-top:6px">تابع مشاريعك وفنيينك: مواعيد، مهام، صور، عمل إضافي بموافقة العميل، وتسليم بتأكيد وتقييم.</div><a class="btn" style="background:#fbbf24;color:#172554;margin-top:12px" href="/plan.html">الاشتراك والباقة</a></div>'; }
// ───── القائمة ─────
function list(){
  S.view='list'; setUrl(S.tab==='team'?'tab=team':'');
  var open=S.items.filter(function(j){return ['new','scheduled','active','delivered'].indexOf(j.status)>=0;}), done=S.items.filter(function(j){return ['done','cancelled'].indexOf(j.status)>=0;});
  var h='<div class="row sb"><div><div class="h1">مشاريع العملاء</div><div class="mu" style="margin-top:3px">من عروض الأسعار اللي وافق عليها العميل، أو أضفها يدوي</div><div id="brbar" style="margin-top:8px;display:none"></div></div><div class="row">'+(S.live?'<button class="btn sec" onclick="_jMap()">🗺 الخريطة اللايف</button><button class="btn pri" onclick="_jNew()">+ مشروع يدوي</button>':'')+'</div></div>';
  if(!S.live) h+=lockCard();
  h+='<div class="tabs"><button class="'+(S.tab==='open'?'on':'')+'" onclick="_jTab(\'open\')">المفتوحة ('+open.length+')</button><button class="'+(S.tab==='done'?'on':'')+'" onclick="_jTab(\'done\')">المكتملة ('+done.length+')</button><button class="'+(S.tab==='team'?'on':'')+'" onclick="_jTab(\'team\')">الفريق</button></div>';
  if(S.tab==='team'){ A.innerHTML=h+'<div id="team"><div class="mu">جارٍ التحميل…</div></div>'; _brb(); team(); return; }
  var L=S.tab==='open'?open:done;
  if(!L.length) h+='<div class="card empty"><div style="font-size:38px">🧰</div><b style="display:block;margin-top:6px">'+(S.tab==='open'?'ما فيه مشاريع مفتوحة':'ما فيه مشاريع مكتملة')+'</b><div class="mu" style="margin-top:6px">لما يوافق عميل على عرض سعر يصير مشروع هنا تلقائياً.</div></div>';
  else h+='<div class="ql">'+L.map(function(j){ var dn=(j.tasks||[]).filter(function(t){return t.done;}).length;
    return '<button class="qi" onclick="_jOpen('+j.id+')"><div class="c"><div class="row" style="gap:6px"><b>'+esc(j.title||'مشروع')+'</b>'+MNQ_BR.tag(j.branch_id)+'<span class="pill '+(STC[j.status]||'p-gr')+'">'+esc(j.status_t)+'</span>'+(j.extra_wait?'<span class="pill p-r">عمل إضافي ينتظرك</span>':'')+'</div><span class="mu">'+esc(j.client_name||'')+(j.sched_at?' · 🗓 '+dt(j.sched_at):'')+(j.tech_name?' · 👷 '+esc(j.tech_name):'')+'</span><span class="mu">المهام '+dn+' من '+(j.tasks||[]).length+'</span></div><div class="amt">'+m((j.value||0)+(j.extra_total||0))+' <small style="font-size:11px;color:#64748b">ر.س</small></div></button>'; }).join('')+'</div>';
  A.innerHTML=h; _brb();
}
window._jTab=function(t){ S.tab=t; list(); };
function _brb(){ MNQ_BR.bar(document.getElementById('brbar'),function(){ load().then(list).catch(function(){}); }); }
// نقل بين الفروع (المالك ومدير الحساب)
function _brMove(kind,id,cur){ if(!MNQ_BR.multi||MNQ_BR.forced) return ''; var c=MNQ_BR.of(cur); return '<select class="mnq-br-sel" style="padding:6px 8px;font-size:12px" onchange="_brMv(\''+kind+'\','+id+',this)" aria-label="نقل لفرع"><option value="">نقل لفرع…</option>'+MNQ_BR.list.filter(function(b){return b.id!==c&&!b.paused;}).map(function(b){return '<option value="'+b.id+'">'+esc(b.name)+'</option>';}).join('')+'</select>'; }
window._brMv=function(kind,id,el){ var to=parseInt(el.value); if(!to)return; api('/api/branches/move',{method:'POST',body:JSON.stringify({kind:kind,id:id,to:to})}).then(function(r){ toast(r.message||'انتقل'); if(kind==='job') reload(); else team(); }).catch(function(e){ if(e)toast(e.message); el.value=''; }); };
function team(){
  api('/api/team').then(function(r){ S.team=r; var el=document.getElementById('team'); if(!el)return;
    var h='<div class="card f" style="display:flex;flex-direction:column;gap:10px"><div class="row sb"><span class="h3">أضف فني</span><span class="mu">'+r.items.length+' من '+r.limit+' في باقتك</span></div><div class="grid2"><div><label for="t-n">اسم الفني</label><input id="t-n" maxlength="80" placeholder="مثال: عمران"></div><div><label for="t-p">جواله</label><input id="t-p" dir="ltr" inputmode="tel" maxlength="15" placeholder="05xxxxxxxx" style="text-align:right"></div></div>'+MNQ_BR.field('t-b',0,'الفرع')+'<button class="btn pri" id="t-add" onclick="_tAdd()"'+(S.live?'':' disabled')+'>أضف للفريق</button><div class="mu">الفني يدخل مناقصة بنفس رقم جواله ويلقى مهامه في «مهام الفني». ما يشوف الأسعار.</div></div>';
    if(!r.items.length) h+='<div class="card empty"><div style="font-size:36px">👷</div><b style="display:block;margin-top:6px">ما أضفت فنيين للحين</b></div>';
    else h+='<div class="ql">'+r.items.map(function(t){ return '<div class="qi" style="cursor:default"><span style="width:38px;height:38px;border-radius:12px;background:#ecfdf3;color:#067647;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none">'+esc((t.name||'ف')[0])+'</span><div class="c"><b>'+esc(t.name)+MNQ_BR.tag(t.branch_id)+'</b><span class="mu" dir="ltr" style="text-align:right">'+esc(t.phone)+'</span><span class="mu">'+(t.user_id?'<span style="color:#067647">✓ دخل مناقصة</span>':'<span style="color:#b54708">ما سجّل للحين</span>')+' · '+t.open_n+' مشروع مفتوح</span></div><div class="row">'+(!t.user_id?'<a class="btn wa" style="padding:8px 12px" target="_blank" rel="noopener" href="https://wa.me/'+wa(t.phone)+'?text='+encodeURIComponent('السلام عليكم '+t.name+'، أضفتك كفني في مناقصة. سجّل بنفس رقم جوالك من هنا وتلقى مهامك في «مهام الفني»: '+location.origin+'/tech.html')+'">ادعه</a>':'')+_brMove('tech',t.id,t.branch_id)+'<button class="btn dan" style="padding:8px 12px" onclick="_tDel('+t.id+')">إزالة</button></div></div>'; }).join('')+'</div>';
    el.innerHTML=h; }).catch(function(e){ if(e)toast(e.message); });
}
window._tAdd=function(){ var b=document.getElementById('t-add'); b.disabled=true; api('/api/team',{method:'POST',body:JSON.stringify({name:document.getElementById('t-n').value,phone:document.getElementById('t-p').value,branch_id:MNQ_BR.val('t-b')})}).then(function(r){ toast(r.linked?'انضاف للفريق':'انضاف — أرسل له دعوة يسجّل'); team(); }).catch(function(e){ b.disabled=false; if(e)toast(e.message); }); };
window._tDel=function(id){ if(!confirm('تزيل الفني من الفريق؟'))return; api('/api/team/'+id,{method:'DELETE'}).then(function(){ toast('انشال'); team(); }).catch(function(e){ if(e)toast(e.message); }); };
// ───── مشروع يدوي ─────
window._jNew=function(){ S.view='new'; setUrl('new=1');
  A.innerHTML='<div class="row" style="gap:8px"><button class="btn sec" style="padding:7px 11px" onclick="_jBack()">‹ رجوع</button><span class="h1" style="font-size:19px">مشروع يدوي</span></div><div class="card f" style="display:flex;flex-direction:column;gap:12px"><div class="grid2"><div><label for="n-cn">اسم العميل</label><input id="n-cn" maxlength="80"></div><div><label for="n-cp">جوال العميل</label><input id="n-cp" dir="ltr" inputmode="tel" maxlength="15" placeholder="05xxxxxxxx" style="text-align:right"></div></div><div><label for="n-t">عنوان المشروع</label><input id="n-t" maxlength="120" placeholder="مثال: تركيب مكيف سبليت"></div><div class="grid2"><div><label for="n-a">العنوان / الحي</label><input id="n-a" maxlength="200"></div><div><label for="n-v">القيمة (ر.س)</label><input id="n-v" inputmode="decimal" maxlength="9"></div></div><div><label for="n-k">المهام (كل مهمة في سطر)</label><textarea id="n-k" placeholder="تركيب الوحدة\nتمديد النحاس\nتجربة التشغيل"></textarea></div>'+MNQ_BR.field('n-b',0,'الفرع')+'<button class="btn pri" id="n-go">إنشاء المشروع</button><div class="mu">المشاريع اليدوية النشطة في باقتك: حتى '+S.limit+'. مشاريع عروض الأسعار ما تنحسب.</div></div>';
  document.getElementById('n-go').onclick=function(){ var b=this; b.disabled=true; api('/api/jobs',{method:'POST',body:JSON.stringify({branch_id:MNQ_BR.val('n-b'),client_name:document.getElementById('n-cn').value,client_phone:document.getElementById('n-cp').value,title:document.getElementById('n-t').value,address:document.getElementById('n-a').value,value:String(document.getElementById('n-v').value).replace(/[٠-٩]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'.indexOf(c);}),tasks:document.getElementById('n-k').value.split('\n')})}).then(function(r){ S.items.unshift(r.job); openJob(r.job.id); }).catch(function(e){ b.disabled=false; if(e)toast(e.message); }); };
};
window._jBack=function(){ clearTimeout(_mt);  load().then(list).catch(function(){}); };
// ───── تفاصيل المشروع ─────
window._jOpen=function(id){ openJob(id); };
function openJob(id){ S.view='job'; setUrl('id='+id); api('/api/jobs/'+id).then(function(j){ S.j=j; job(); }).catch(function(e){ if(e){ toast(e.message); list(); } }); }
function isoLocal(d){ if(!d)return ''; d=new Date(d); var p=function(n){return (n<10?'0':'')+n;}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
function job(){
  var j=S.j, cl=['done','cancelled'].indexOf(j.status)>=0, dn=j.tasks.filter(function(t){return t.done;}).length, tot=(j.value||0)+(j.extra_total||0);
  var h='<div class="row sb"><div style="min-width:0"><div class="row" style="gap:8px"><button class="btn sec" style="padding:7px 11px" onclick="_jBack()">‹ رجوع</button><span class="pill '+(STC[j.status]||'p-gr')+'">'+esc(j.status_t)+'</span></div><div class="h1" style="font-size:20px;margin-top:8px">'+esc(j.title)+'</div><div class="mu">'+(j.client_phone?'<a href="/customers.html?ph='+encodeURIComponent(j.client_phone)+'" style="color:#1e3a8a;font-weight:800">'+esc(j.client_name)+'</a>':esc(j.client_name))+(j.address?' · '+esc(j.address):'')+' · <b class="amt">'+m(tot)+'</b> ر.س'+(j.extra_total?' (منها '+m(j.extra_total)+' عمل إضافي)':'')+'</div></div><div class="row">'+(j.client_phone?'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+wa(j.client_phone)+'">واتساب العميل</a>':'')+(j.quote_id?'<a class="btn sec" href="/quotes.html?id='+j.quote_id+'">العرض</a>':'')+(j.client_phone?'<a class="btn sec" href="/stickers.html?ph='+encodeURIComponent(j.client_phone)+'">🏷 ملصقات QR</a>':'')+(!cl&&j.status!=='delivered'?'<button class="btn pri" id="dlv" onclick="_jDeliver()">سلّم المشروع</button>':'')+'</div></div>';
  h+='<div class="card">'+steps(j.status==='cancelled'?'new':j.status)+'</div>';
  if(j.status==='delivered') h+='<div class="card" style="background:#fffaeb;border-color:#fde68a"><b style="color:#b54708">بانتظار تأكيد العميل</b><div class="mu" style="margin-top:4px">سلّمت '+dt(j.delivered_at)+' — إذا ما رد خلال 3 أيام يتأكد تلقائياً.</div></div>';
  if(j.status==='done') h+='<div class="card" style="background:#f6fef9;border-color:#a6f4c5"><b style="color:#067647">اكتمل المشروع'+(j.rating?' · قيّمك '+j.rating+' من 5 ★':'')+'</b><div class="mu" style="margin-top:4px">'+(j.auto_confirmed?'تأكّد تلقائياً ':'أكّد العميل ')+dt(j.confirmed_at)+'</div></div>';
  h+='<div class="ed"><div class="main">';
  // المهام
  h+='<div class="card"><div class="row sb" style="margin-bottom:6px"><span class="h3">المهام</span><span class="pill p-b">'+dn+' من '+j.tasks.length+'</span></div>'+j.tasks.map(function(t){ return '<div class="ck'+(t.done?' done':'')+'"><button class="b" '+(cl?'disabled':'')+' onclick="_jTask(\''+esc(t.id)+'\')" aria-label="تم">'+(t.done?'✓':'')+'</button><span class="t" style="flex:1">'+esc(t.t)+'</span>'+(t.done&&t.by?'<span class="mu">'+esc(t.by)+'</span>':'')+(!cl?'<button class="x" style="width:28px;height:28px" onclick="_jTDel(\''+esc(t.id)+'\')">×</button>':'')+'</div>'; }).join('')+(!cl?'<div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="t-new" maxlength="120" placeholder="مهمة جديدة" style="flex:1;border:1.5px solid #e2e8f0;border-radius:10px;padding:9px 11px;font-size:14px;min-width:0"><button class="btn sec" onclick="_jTAdd()">أضف</button></div>':'')+'</div>';
  // الصور
  h+='<div class="card"><div class="row sb"><span class="h3">الصور</span>'+(!cl?'<label class="btn sec" style="padding:7px 12px;font-size:12.5px;cursor:pointer">📷 أضف صورة<input type="file" accept="image/*" style="display:none" onchange="_jPhoto(this)"></label>':'')+'</div><div class="phs">'+(j.photos.length?j.photos.map(function(p){ return '<a href="'+esc(p.url)+'" target="_blank" rel="noopener" class="ph" style="background-image:url(&quot;'+esc(p.url)+'&quot;)"><span>'+(p.kind==='before'?'قبل':'بعد')+'</span></a>'; }).join(''):'<span class="mu">ما فيه صور للحين — الفني يرفعها من جواله</span>')+'</div></div>';
  h+='</div><div class="side">';
  // الموعد والفني
  h+='<div class="card f" style="display:flex;flex-direction:column;gap:10px"><span class="h3">الموعد والفني</span><div><label for="j-dt">الموعد</label><input id="j-dt" type="datetime-local" value="'+isoLocal(j.sched_at)+'"'+(cl?' disabled':'')+'></div><div><label for="j-tc">الفني</label><select id="j-tc"'+(cl?' disabled':'')+'><option value="">— اختر —</option>'+(j.team||[]).map(function(t){ return '<option value="'+t.id+'"'+(t.id===j.tech_id?' selected':'')+'>'+esc(t.name)+(t.user_id?'':' (ما سجّل)')+'</option>'; }).join('')+'</select>'+(!(j.team||[]).length?'<div class="mu" style="margin-top:4px">أضف فنيين من تبويب «الفريق»</div>':'')+'</div><div><label for="j-ad">العنوان</label><input id="j-ad" maxlength="200" value="'+esc(j.address||'')+'"'+(cl?' disabled':'')+'></div><div><label for="j-mp">رابط الموقع (قوقل ماب)</label><input id="j-mp" dir="ltr" maxlength="400" value="'+esc(j.maps||'')+'"'+(cl?' disabled':'')+'></div>'+(j.enroute_at&&!j.arrived_at?'<span class="pill p-b" style="align-self:flex-start">🚗 في الطريق من '+dt(j.enroute_at)+'</span>':'')+(j.arrived_at?'<span class="pill p-g" style="align-self:flex-start">📍 الفني وصل '+dt(j.arrived_at)+'</span>':'')+(j.finished_at?'<span class="pill p-b" style="align-self:flex-start">🏁 الفني خلّص '+dt(j.finished_at)+'</span>':'')+(!cl?'<button class="btn pri" id="j-sv" onclick="_jSave()">حفظ</button>':'')+'</div>';
  // العمل الإضافي
  var ex=j.extras||[], wait=ex.filter(function(e){return e.status==='tech';}), sent=ex.filter(function(e){return e.status==='sent';});
  h+='<div class="card f" style="display:flex;flex-direction:column;gap:10px"><span class="h3">العمل الإضافي</span>';
  wait.forEach(function(e){ h+='<div style="border:1.5px solid #fde68a;background:#fffcf5;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px"><b style="color:#b54708">طلب من الفني: '+esc(e.descr)+'</b>'+(e.photo?'<a href="'+esc(e.photo)+'" target="_blank" rel="noopener"><img src="'+esc(e.photo)+'" style="width:84px;height:84px;object-fit:cover;border-radius:10px"></a>':'')+'<div class="row" style="flex-wrap:nowrap"><input id="ex-p'+e.id+'" inputmode="decimal" maxlength="9" placeholder="السعر (ر.س)" style="flex:1;min-width:0;border:1.5px solid #e2e8f0;border-radius:10px;padding:9px 11px;font-size:14px"><button class="btn pri" onclick="_exSend('+e.id+')">أرسله للعميل</button><button class="btn sec" onclick="_exDrop('+e.id+')">تجاهل</button></div></div>'; });
  sent.forEach(function(e){ h+='<div class="row sb" style="font-size:13.5px;font-weight:700"><span>'+esc(e.descr)+' — '+m(e.price)+' ر.س'+(j.vat?' + ضريبة 15%':'')+'</span><span class="pill p-y">بانتظار العميل</span></div>'; });
  ex.filter(function(e){return e.status==='approved'||e.status==='declined';}).forEach(function(e){ h+='<div class="row sb" style="font-size:13.5px;font-weight:700"><span>'+esc(e.descr)+' — '+m(e.price)+' ر.س'+(j.vat?' + ضريبة 15%':'')+'</span><span class="pill '+(e.status==='approved'?'p-g':'p-r')+'">'+(e.status==='approved'?'وافق العميل':'رفض العميل')+'</span></div>'; });
  if(!cl&&j.status!=='delivered') h+=(j.client_id?'<div class="row" style="flex-wrap:nowrap"><input id="ex-d" maxlength="200" placeholder="وصف العمل الإضافي" style="flex:2;min-width:0;border:1.5px solid #e2e8f0;border-radius:10px;padding:9px 11px;font-size:14px"><input id="ex-pp" inputmode="decimal" maxlength="9" placeholder="السعر" style="flex:1;min-width:0;border:1.5px solid #e2e8f0;border-radius:10px;padding:9px 11px;font-size:14px"></div><button class="btn sec" onclick="_exNew()">أرسل للعميل يوافق</button>':'<div class="mu">العميل ما عنده حساب — اتفق معه على العمل الإضافي مباشرة.</div>');
  h+='</div>';
  // التكاليف والربح (للمؤسسة فقط — العميل والفني ما يشوفونها)
  var C=j.costs||[], ct=C.reduce(function(a,c){return a+c.amount;},0), pf=tot-ct;
  h+='<div class="card f" style="display:flex;flex-direction:column;gap:8px"><span class="h3">التكاليف والربح</span>'+C.map(function(c){ return '<div class="row sb" style="font-size:13.5px;font-weight:700;padding:6px 0;border-top:1px solid #f1f5f9;flex-wrap:nowrap"><div style="min-width:0"><b>'+esc(c.title)+'</b><div class="mu">أضافها '+esc(c.by||'')+(c.photo?' · <a href="'+esc(c.photo)+'" target="_blank" rel="noopener" style="color:#1e3a8a">📎 الفاتورة</a>':'')+'</div></div><div class="row" style="flex-wrap:nowrap"><b>'+m(c.amount)+'</b><button class="x" onclick="_cDel('+c.id+')" aria-label="حذف">×</button></div></div>'; }).join('')
    +'<div class="row" style="flex-wrap:nowrap"><input id="cs-t" maxlength="120" placeholder="البند (مواد، عمالة، نقل…)" style="flex:2;min-width:0"><input id="cs-a" inputmode="decimal" maxlength="9" placeholder="المبلغ" style="flex:1;min-width:0"><button class="btn sec" onclick="_cAdd()">+</button></div>'
    +'<div style="border-top:1px dashed #dbe4f3;padding-top:8px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:800"><div class="row sb"><span>القيمة + الإضافي</span><span>'+m(tot)+'</span></div><div class="row sb"><span>التكاليف</span><span style="color:#b42318">− '+m(ct)+'</span></div><div class="row sb" style="font-size:15.5px;color:'+(pf>=0?'#067647':'#b42318')+'"><span>الربح</span><span>'+m(pf)+(tot?' ('+Math.round(pf/tot*100)+'%)':'')+'</span></div></div></div>';
  // الفرع
  if(MNQ_BR.multi) h+='<div class="card"><span class="h3">الفرع</span><div class="row sb" style="margin-top:6px"><b>📍 '+esc(MNQ_BR.name(j.branch_id))+'</b>'+(!cl?_brMove('job',j.id,j.branch_id):'')+'</div></div>';
  // السجل
  h+='<div class="card"><span class="h3">سجل المشروع</span><div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">'+(j.log||[]).slice().reverse().map(function(l){ return '<span class="mu"><b style="color:#475467">'+dt(l.at)+'</b> · '+esc(l.t)+'</span>'; }).join('')+'</div></div>';
  if(!cl) h+='<button class="btn" style="background:transparent;color:#b42318" onclick="_jCancel()">إلغاء المشروع</button>';
  h+='</div></div>';
  A.innerHTML=h;
}
function nd(s){ return String(s==null?'':s).replace(/[٠-٩]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'.indexOf(c);}).replace(/[^\d.]/g,''); }
function act(body){ return api('/api/jobs/'+S.j.id,{method:'POST',body:JSON.stringify(body)}); }
function reload(msg){ return api('/api/jobs/'+S.j.id).then(function(j){ S.j=j; job(); if(msg)toast(msg); }); }
window._jTask=function(tid){ act({act:'task',tid:tid}).then(function(){ reload(); }).catch(function(e){ if(e)toast(e.message); }); };
window._jTDel=function(tid){ act({act:'task_del',tid:tid}).then(function(){ reload(); }).catch(function(e){ if(e)toast(e.message); }); };
window._jTAdd=function(){ var v=document.getElementById('t-new').value; act({act:'task_add',t:v}).then(function(){ reload(); }).catch(function(e){ if(e)toast(e.message); }); };
window._jSave=function(){ var b=document.getElementById('j-sv'); b.disabled=true; var dv=document.getElementById('j-dt').value;
  act({act:'save',sched_at:dv?new Date(dv).toISOString():null,tech_id:document.getElementById('j-tc').value||null,address:document.getElementById('j-ad').value,maps:document.getElementById('j-mp').value}).then(function(){ reload('انحفظ'); }).catch(function(e){ b.disabled=false; if(e)toast(e.message); }); };
window._jDeliver=function(){ var j=S.j, left=j.tasks.filter(function(t){return !t.done;}).length; if(!confirm((left?'باقي '+left+' مهام ما انتهت. ':'')+(j.client_id?'تسلّم المشروع؟ يوصل العميل يأكد الاستلام ويقيّمك.':'تسلّم المشروع؟')))return;
  act({act:'deliver'}).then(function(){ reload('انسلّم المشروع'); }).catch(function(e){ if(e)toast(e.message); }); };
window._cAdd=function(){ api('/api/jobs/'+S.j.id+'/costs',{method:'POST',body:JSON.stringify({title:document.getElementById('cs-t').value,amount:nd(document.getElementById('cs-a').value)})}).then(function(){ reload('انضافت'); }).catch(function(e){ if(e)toast(e.message); }); };
window._cDel=function(id){ if(!confirm('تحذف هذي التكلفة؟'))return; api('/api/jobs/'+S.j.id+'/costs',{method:'POST',body:JSON.stringify({del:id})}).then(function(){ reload(); }).catch(function(e){ if(e)toast(e.message); }); };
window._jCancel=function(){ if(!confirm('تلغي المشروع؟'))return; act({act:'cancel'}).then(function(){ reload('انلغى'); }).catch(function(e){ if(e)toast(e.message); }); };
window._exSend=function(eid){ api('/api/jobs/'+S.j.id+'/extras',{method:'POST',body:JSON.stringify({eid:eid,price:nd(document.getElementById('ex-p'+eid).value)})}).then(function(){ reload('أُرسل للعميل'); }).catch(function(e){ if(e)toast(e.message); }); };
window._exDrop=function(eid){ api('/api/jobs/'+S.j.id+'/extras',{method:'POST',body:JSON.stringify({eid:eid,act:'reject'})}).then(function(){ reload(); }).catch(function(e){ if(e)toast(e.message); }); };
window._exNew=function(){ api('/api/jobs/'+S.j.id+'/extras',{method:'POST',body:JSON.stringify({descr:document.getElementById('ex-d').value,price:nd(document.getElementById('ex-pp').value)})}).then(function(){ reload('أُرسل للعميل'); }).catch(function(e){ if(e)toast(e.message); }); };
window._jPhoto=function(inp){ var f=inp.files&&inp.files[0]; if(!f)return; shrink(f,function(d){ toast('جارٍ الرفع…'); act({act:'photo',data:d,kind:S.j.status==='active'||S.j.arrived_at?'after':'before'}).then(function(){ reload('انرفعت'); }).catch(function(e){ if(e)toast(e.message); }); }); };
function shrink(f,cb){ var rd=new FileReader(); rd.onload=function(){ var im=new Image(); im.onload=function(){ var w=Math.min(1280,im.width), c=document.createElement('canvas'); c.width=w; c.height=Math.round(im.height*w/im.width); c.getContext('2d').drawImage(im,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.8)); }; im.src=rd.result; }; rd.readAsDataURL(f); }
MNQ_BR.load().then(load).then(function(){ var id=parseInt(P.get('id')); if(id){ openJob(id); return; } if(P.get('map')){ _jMap(); return; } if(P.get('tab')==='team')S.tab='team'; if(P.get('new')&&S.live){ _jNew(); return; } list(); }).catch(function(e){ if(e) A.innerHTML='<div class="card empty"><b>'+esc(e.message)+'</b></div>'; });
})();
</script>
