<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>الكرت الرقمي — مناقصة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--p:#1e3a8a;--p2:#2563eb;--accent:#0ea5e9;--bg:#f0f5ff;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e6eefb;--green:#25D366}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px 14px 40px}
.wrap{width:100%;max-width:440px}
.card{background:var(--card);border-radius:22px;box-shadow:0 8px 40px rgba(20,20,50,.08);overflow:hidden}
.head{background:linear-gradient(135deg,var(--p),var(--p2));padding:26px 22px 46px;text-align:center;color:#fff;position:relative;overflow:hidden}
.head::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle, rgba(255,255,255,.13) 1.4px, transparent 1.4px);background-size:20px 20px;opacity:.55;pointer-events:none}
.head>*{position:relative;z-index:1}
.brand-tag{font-size:11px;opacity:.9;font-weight:800;letter-spacing:.6px;margin-bottom:12px}
.btn-vcard{background:#fff;color:var(--p);border:1.5px solid var(--border)}
.draft{background:#fffbeb;border-bottom:1px solid #fde68a;color:#92600a;text-align:center;padding:9px 14px;font-size:12.5px;font-weight:700}
.mkt{margin-top:16px;background:#f0f5ff;border:1px solid #cdddf9;border-radius:14px;padding:15px 16px}
.mkt h5{font-size:13.5px;color:#1e3a8a;font-weight:800;margin-bottom:7px}
.mkt p{font-size:12.5px;color:#3a4c6b;line-height:1.8}
.mkt b{color:#1e3a8a}
.av{width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;margin:0 auto 12px}
.name{font-size:22px;font-weight:800;line-height:1.3}
.cat{font-size:13.5px;opacity:.92;margin-top:5px;font-weight:500}
.rating{display:inline-flex;align-items:center;gap:5px;margin-top:12px;background:rgba(255,255,255,.16);padding:5px 13px;border-radius:20px;font-size:13px;font-weight:700}
.rating small{opacity:.8;font-weight:500;font-size:10.5px}
.body{padding:22px}
.btns{display:grid;gap:10px;margin-top:-34px;position:relative}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:15px;border-radius:14px;font-size:15px;font-weight:800;text-decoration:none;border:none;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn-wa{background:var(--green);color:#fff;box-shadow:0 6px 20px rgba(37,211,102,.35)}
.btn-call{background:var(--p);color:#fff}
.btn-map{background:#fff;color:var(--text);border:1.5px solid var(--border)}
.social{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.soc{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;text-decoration:none;color:#fff}
.s-ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366)}.s-sc{background:#FFFC00;color:#111}.s-tt{background:#111}.s-tw{background:#1DA1F2}.s-web{background:#334155}
.bio{margin-top:18px;background:var(--bg);border-radius:14px;padding:15px;font-size:14px;line-height:1.8;color:#3a4152;white-space:pre-wrap}
.qr-sec{margin-top:18px;text-align:center;background:var(--bg);border-radius:16px;padding:18px}
.qr-sec h4{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:12px}
#qr{display:inline-block;padding:10px;background:#fff;border-radius:12px}#qr img,#qr canvas{display:block}
.share{margin-top:12px;background:var(--accent);color:#fff;border:none;padding:11px 20px;border-radius:12px;font-size:13.5px;font-weight:800;cursor:pointer}
.cta{background:#eef4ff;border:1.5px solid #cdddf9;border-radius:16px;padding:16px;margin-top:18px;text-align:center}
.cta b{color:#1e3a8a}
.cta .cta-x{font-size:13.5px;color:#334155;line-height:1.7}
.cta-btn{display:inline-block;margin-top:12px;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:12px 30px;border-radius:12px;font-size:14.5px;font-weight:800;text-decoration:none}
.foot{margin-top:20px;text-align:center;font-size:12px;color:var(--muted)}
.foot a{color:var(--p);font-weight:700;cursor:pointer;text-decoration:none}
.brand{margin-top:22px;text-align:center;font-size:11.5px;color:var(--muted)}.brand b{color:var(--p)}
.edit{margin-top:16px;border:1.5px dashed var(--border);border-radius:16px;padding:16px;display:none}
.edit.on{display:block}
.edit label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:10px 0 5px}
.edit input,.edit textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:11px;font-size:13.5px;background:#fff;color:var(--text)}
.edit textarea{min-height:80px;resize:vertical;line-height:1.7}
.e-save{width:100%;margin-top:14px;background:var(--p);color:#fff;border:none;padding:13px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer}
.e-remove{width:100%;margin-top:8px;background:#fff;color:#dc2626;border:1.5px solid #fecaca;padding:11px;border-radius:12px;font-size:12.5px;font-weight:700;cursor:pointer}
.state{text-align:center;padding:70px 20px;color:var(--muted);font-size:15px}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--p);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 22px;border-radius:12px;font-size:13.5px;font-weight:700;opacity:0;transition:.3s;z-index:99}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><div class="state"><div class="spin"></div>جاري التحميل...</div></div>
  <div class="brand">مدعوم من <b>مناقصة</b> · منصّة الخدمات السعودية</div>
</div>
<div class="toast" id="toast"></div>
<script>
var TOKEN=(location.pathname.split('/').filter(Boolean).pop()||'').split('?')[0];
var CARD_URL=location.origin+'/card/'+TOKEN;
var _data=null;
var _logoData='';
function _setLogoPrev(src){ var p=document.getElementById('logoPrev'); if(p)p.innerHTML=src?'<img src="'+src+'" style="width:100%;height:100%;object-fit:cover">':'📷'; }
function _clearLogo(){ _logoData=''; _setLogoPrev(''); }
function _pickLogo(e){
  var f=e.target.files&&e.target.files[0]; if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=400,w=img.width,h=img.height;
      if(w>h){ if(w>max){h=Math.round(h*max/w);w=max;} } else { if(h>max){w=Math.round(w*max/h);h=max;} }
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      _logoData=c.toDataURL('image/jpeg',0.85);
      _setLogoPrev(_logoData);
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
}
function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':String(s));return d.innerHTML;}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2200);}
function normWa(p){if(!p)return'';var d=String(p).replace(/[^\d]/g,'');if(d.indexOf('966')===0)return d;if(d.indexOf('05')===0)return '966'+d.slice(1);if(d.indexOf('5')===0&&d.length===9)return '966'+d;if(d.indexOf('0')===0)return '966'+d.slice(1);return d;}

function render(d){
  _data=d;
  var wa=d.phone_norm||normWa(d.phone);
  var initial=esc((d.name||'?').trim().charAt(0)||'?');
  _logoData=d.logo||'';
  var avInner=d.logo?'<img src="'+esc(d.logo)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">':initial;
  var subtitle=[d.category,d.city].filter(Boolean).map(esc).join(' · ');
  var h='<div class="card"><div class="draft">✏️ مسودّة — معاينة خاصة بك · فعّلها لتصير رسمية</div><div class="head">'
    +'<div class="brand-tag">📇 بطاقة رقمية · مناقصة</div>'
    +'<div class="av">'+avInner+'</div>'
    +'<div class="name">'+esc(d.name||'مزود خدمة')+'</div>'
    +(subtitle?'<div class="cat">'+subtitle+'</div>':'')
    +(d.rating?'<div class="rating">⭐ '+Number(d.rating).toFixed(1)+(d.reviews_count?' ('+d.reviews_count+')':'')+' <small>من Google</small></div>':'')
    +'</div><div class="body">';
  h+='<div class="btns">';
  if(wa)h+='<a class="btn btn-wa" href="https://api.whatsapp.com/send?phone='+wa+'&text='+encodeURIComponent('السلام عليكم، شفت كرتك على مناقصة 👋')+'&type=phone_number&app_absent=0" target="_blank">💬 محادثة واتساب</a>';
  if(d.phone)h+='<a class="btn btn-call" href="tel:'+esc(d.phone)+'">📞 اتصال مباشر</a>';
  var maps=(d.links&&d.links.maps)||(d.website&&/google\.[^\/]+\/maps|maps\.app|goo\.gl\/maps/.test(d.website)?d.website:'')||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((d.name||'')+' '+(d.city||'')));
  h+='<a class="btn btn-map" href="'+esc(maps)+'" target="_blank">📍 الموقع على الخريطة</a>';
  h+='<button class="btn btn-vcard" onclick="saveVCard()">📇 حفظ جهة الاتصال</button>';
  h+='</div>';
  var L=d.links||{};
  var soc='';
  if(L.instagram)soc+='<a class="soc s-ig" href="'+esc(L.instagram)+'" target="_blank" aria-label="انستقرام">📷</a>';
  if(L.snapchat)soc+='<a class="soc s-sc" href="'+esc(L.snapchat)+'" target="_blank" aria-label="سناب شات">👻</a>';
  if(L.tiktok)soc+='<a class="soc s-tt" href="'+esc(L.tiktok)+'" target="_blank" aria-label="تيك توك">🎵</a>';
  if(L.twitter)soc+='<a class="soc s-tw" href="'+esc(L.twitter)+'" target="_blank" aria-label="إكس">𝕏</a>';
  var web=d.website&&!/google\.[^\/]+\/maps/.test(d.website)?d.website:'';
  if(web)soc+='<a class="soc s-web" href="'+esc(web)+'" target="_blank" aria-label="الموقع">🌐</a>';
  if(soc)h+='<div class="social">'+soc+'</div>';
  var demand=[d.category,d.city].filter(Boolean).map(esc).join(' في ');
  h+='<div class="mkt"><h5>ليش تفعّل صفحتك؟</h5><p>اليوم العملاء يدوّرون الخدمات في <b>قوقل</b> والجوال — مو بالكرت الورقي. لمّا تفعّل صفحتك تصير <b>ظاهرة في قوقل</b>'+(demand?' لكل من يبحث عن <b>'+demand+'</b>':'')+'، فيوصلك عملاء جدد بدل ما تنتظرهم.</p></div>';
  h+='<div class="cta"><div class="cta-x"><b>سجّل الآن</b> عشان تتفعّل صفحتك وتبدأ توصلك طلبات العملاء — <b>مجاناً</b>.</div>'
    +'<a class="cta-btn" href="/auth.html?ref=card&t='+encodeURIComponent(TOKEN)+'">✅ سجّل وفعّل صفحتي</a></div>';
  if(d.bio)h+='<div class="bio">'+esc(d.bio)+'</div>';
  h+='<div class="qr-sec"><h4>امسح الرمز للوصول لهذي الصفحة</h4><div id="qr"></div><br><button class="share" onclick="shareCard()">🔗 مشاركة الرابط</button></div>';
  if(d.views)h+='<div style="text-align:center;margin-top:14px;font-size:12.5px;color:var(--muted)">👁 انفتحت صفحتك <b style="color:var(--p)">'+d.views+'</b> مرة</div>';
  h+='<div class="foot">هذي بياناتك؟ <a onclick="toggleEdit()">✏️ عدّل صفحتك أو أخفِها</a></div>';
  h+='<div class="edit" id="editBox">'
    +'<label>الشعار / صورة</label>'
    +'<div style="display:flex;align-items:center;gap:12px">'
      +'<div id="logoPrev" style="width:60px;height:60px;border-radius:14px;background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">'+(d.logo?'<img src="'+esc(d.logo)+'" style="width:100%;height:100%;object-fit:cover">':'📷')+'</div>'
      +'<input type="file" id="e-logo-file" accept="image/*" onchange="_pickLogo(event)" style="flex:1;font-size:12px">'
      +'<button type="button" onclick="_clearLogo()" style="background:#fff;color:#dc2626;border:1px solid #fecaca;padding:8px 12px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer">إزالة</button>'
    +'</div>'
    +'<label>نبذة عنك</label><textarea id="e-bio" placeholder="مثال: متخصص في تكييف وصيانة السبليت، خبرة 10 سنوات، خدمة سريعة داخل الرياض.">'+esc(d.bio||'')+'</textarea>'
    +'<label>انستقرام (رابط)</label><input id="e-ig" dir="ltr" value="'+esc(L.instagram||'')+'" placeholder="https://instagram.com/...">'
    +'<label>سناب شات (رابط)</label><input id="e-sc" dir="ltr" value="'+esc(L.snapchat||'')+'" placeholder="https://snapchat.com/add/...">'
    +'<label>تيك توك (رابط)</label><input id="e-tt" dir="ltr" value="'+esc(L.tiktok||'')+'" placeholder="https://tiktok.com/@...">'
    +'<label>إكس / تويتر (رابط)</label><input id="e-tw" dir="ltr" value="'+esc(L.twitter||'')+'" placeholder="https://x.com/...">'
    +'<button class="e-save" onclick="saveCard()">حفظ التعديلات</button>'
    +'<button class="e-remove" onclick="removeCard()">أخفِ صفحتي نهائياً</button>'
    +'</div>';
  h+='</div></div>';
  document.getElementById('app').innerHTML=h;
  try{ new QRCode(document.getElementById('qr'),{text:CARD_URL,width:150,height:150,colorDark:'#1e3a8a',correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
}
function toggleEdit(){document.getElementById('editBox').classList.toggle('on');}
function saveVCard(){
  var d=_data||{}; var L=d.links||{};
  var v=['BEGIN:VCARD','VERSION:3.0','FN:'+(d.name||''),'ORG:'+(d.name||'')];
  if(d.category)v.push('TITLE:'+d.category);
  if(d.phone)v.push('TEL;TYPE=CELL:'+d.phone);
  if(d.city)v.push('ADR;TYPE=WORK:;;;'+d.city+';;;السعودية');
  v.push('URL:'+CARD_URL);
  ['website','instagram','tiktok','snapchat','twitter'].forEach(function(k){ if(L[k])v.push('URL:'+L[k]); });
  if(d.bio)v.push('NOTE:'+String(d.bio).replace(/\n/g,' '));
  v.push('END:VCARD');
  try{
    var blob=new Blob([v.join('\r\n')],{type:'text/vcard;charset=utf-8'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=((d.name||'contact').replace(/\s+/g,'_'))+'.vcf';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(a.href);},1500);
    toast('تم حفظ جهة الاتصال');
  }catch(e){ toast('تعذّر الحفظ'); }
}
function shareCard(){
  if(navigator.share){navigator.share({title:'الكرت الرقمي',url:CARD_URL}).catch(function(){});}
  else{navigator.clipboard.writeText(CARD_URL).then(function(){toast('تم نسخ الرابط');}).catch(function(){toast(CARD_URL);});}
}
function saveCard(){
  var body={bio:document.getElementById('e-bio').value,logo:_logoData,links:{
    instagram:document.getElementById('e-ig').value,snapchat:document.getElementById('e-sc').value,
    tiktok:document.getElementById('e-tt').value,twitter:document.getElementById('e-tw').value,
    website:(_data&&_data.website)||'',maps:(_data&&_data.links&&_data.links.maps)||''}};
  fetch('/api/card/'+TOKEN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json();}).then(function(){toast('تم الحفظ ✅');setTimeout(function(){location.reload();},900);})
    .catch(function(){toast('تعذّر الحفظ');});
}
function removeCard(){
  if(!confirm('إخفاء صفحتك نهائياً؟ لن تكون متاحة بالرابط.'))return;
  fetch('/api/card/'+TOKEN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({unpublish:true})})
    .then(function(r){return r.json();}).then(function(){location.reload();}).catch(function(){toast('تعذّر');});
}
fetch('/api/card/'+TOKEN).then(function(r){
  if(r.status===410){document.getElementById('app').innerHTML='<div class="state">🚫 هذي الصفحة غير متاحة حالياً.</div>';throw 0;}
  if(!r.ok){document.getElementById('app').innerHTML='<div class="state">لم نجد هذا الكرت. تأكّد من الرابط.</div>';throw 0;}
  return r.json();
}).then(function(d){render(d);}).catch(function(){});
</script>
</body>
</html>
