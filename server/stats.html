<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172554">
<title>الأرقام والتقارير — مناقصة</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Cairo:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,sans-serif;background:#f0f5ff;color:#1e293b;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.top{height:62px;background:#172554;border-bottom:3px solid #0ea5e9;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff}
.top b{font-size:21px;font-weight:900}.top b i{color:#38bdf8;font-style:normal}.top a{color:#fff;text-decoration:none;font-size:13px;font-weight:800;opacity:.85}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:14px}
.h1{font-size:23px;font-weight:900;color:#172554}.mu{color:#64748b;font-size:12.5px;font-weight:700}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{border:1.5px solid #e2e8f0;background:#fff;color:#475467;border-radius:99px;padding:7px 13px;font-weight:800;font-size:12.5px;cursor:pointer}.chip.on{background:#172554;color:#fff;border-color:#172554}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:9px 14px;font-weight:800;font-size:13px;border:0;cursor:pointer;text-decoration:none}.pri{background:#1e3a8a;color:#fff}.sec{background:#fff;border:1.5px solid #e2e8f0;color:#1e293b}
.card{background:#fff;border:1px solid #e6eefb;border-radius:18px;box-shadow:0 2px 10px rgba(30,58,138,.05);padding:16px 18px}
.kp{display:flex;gap:12px}.k{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.k .v{font-family:Cairo,sans-serif;font-size:27px;font-weight:900;color:#172554;line-height:1.3}
.dl{font-size:12px;font-weight:800;color:#64748b}.dl.up{color:#067647}.dl.dn{color:#b42318}
.grid{display:flex;gap:14px;align-items:flex-start}.main{flex:1.6;min-width:0;display:flex;flex-direction:column;gap:14px}.side{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sh b{font-size:15px;color:#172554}
.bars{display:flex;gap:8px;height:220px;align-items:flex-end;border-bottom:1px solid #e2e8f0}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;outline:none;cursor:default}
.bc .b{width:58%;max-width:56px;background:#93a8d8;border-radius:4px 4px 0 0}.bc .b.cur{background:#1e3a8a}.bc:hover .b,.bc:focus .b{background:#172554}
.bv{font-size:11.5px;font-weight:800;color:#475467}.bl{font-size:11.5px;font-weight:700;color:#64748b;padding-bottom:4px}
.fr{display:flex;align-items:center;gap:10px;padding:7px 0}.fr span{width:170px;font-size:13px;font-weight:700;flex:none}.fr b{width:34px;font-size:14px;text-align:left}
.ft{flex:1;background:#eef2f7;border-radius:6px;height:22px;overflow:hidden}.ft div{height:100%;background:#1e3a8a;border-radius:6px;min-width:2px}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid #f1f5f9}.li b{display:block;font-size:14px}.li .mu{display:block}
.av{width:36px;height:36px;border-radius:11px;background:#0e9384;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
@media(max-width:820px){.kp{flex-wrap:wrap}.k{flex:1 1 40%}.k .v{font-size:21px}.grid{flex-direction:column}.main,.side{width:100%}.fr span{width:120px;font-size:12px}}
@media print{body{background:#fff}.top,.noprint{display:none!important}.card{box-shadow:none;break-inside:avoid}.wrap{max-width:none;padding:0}}
</style>
<script src="/branch.js?v=1"></script></head>
<body>
<div class="top"><b>مناقصة <i>•</i></b><a href="/dashboard-provider.html">‹ لوحة التحكم</a></div>
<div class="wrap" id="app"><div class="mu">جارٍ التحميل…</div></div>
<script>
(function(){
var TOK=''; try{TOK=localStorage.getItem('token')||'';}catch(e){}
if(!TOK){ try{localStorage.setItem('_after_login',location.pathname+location.search);}catch(e){} location.href='/auth.html'; return; }
var A=document.getElementById('app'), P=new URLSearchParams(location.search), PER=P.get('period')||'month';
var MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function f(v){ return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:1}); }
function k(v){ v=Number(v||0); return v>=1000?(Math.round(v/100)/10).toLocaleString('en-US')+'k':f(v); }
function api(p){ return fetch(p,{headers:Object.assign({'Authorization':'Bearer '+TOK},window.MNQ_BR?MNQ_BR.h():{})}).then(function(r){ if(r.status===401){ location.href='/auth.html'; throw 0; } return r.json().then(function(j){ if(!r.ok) throw new Error(j.message||'حدث خطأ'); return j; }); }); }
function delta(c,p,pct){ if(c==null||p==null) return ''; if(pct){ var d=c-p; if(!d) return '<span class="dl">= مثل الفترة السابقة</span>'; return '<span class="dl '+(d>0?'up':'dn')+'">'+(d>0?'▲':'▼')+' من '+p+'%</span>'; }
  if(!p&&!c) return ''; if(!p) return '<span class="dl up">▲ جديد</span>'; var r=Math.round((c-p)/p*100); if(!r) return '<span class="dl">= مثل الفترة السابقة</span>'; if(r>=100) return '<span class="dl up">▲ '+(Math.round(c/p*10)/10)+' أضعاف الفترة السابقة</span>'; return '<span class="dl '+(r>0?'up':'dn')+'">'+(r>0?'▲ ':'▼ ')+Math.abs(r)+'% عن الفترة السابقة</span>'; }
var PL={month:'هذا الشهر',prev:'الشهر الماضي','3m':'آخر 3 شهور',year:'آخر سنة'};
function load(){ A.innerHTML='<div class="mu">جارٍ التحميل…</div>'; api('/api/provider/stats?period='+PER).then(draw).catch(function(e){ if(e) A.innerHTML='<div class="card"><b>'+esc(e.message)+'</b></div>'; }); }
window._sP=function(p){ PER=p; try{history.replaceState(null,'','?period='+p);}catch(e){} load(); };
function draw(s){
  var c=s.cur, p=s.prev, L=s.live, fr=new Date(s.from), to=new Date(s.to);
  var h='<div class="hd"><div><div class="h1">الأرقام والتقارير</div><div class="mu" style="margin-top:4px">'+PL[s.period]+' · '+fr.getDate()+' '+MN[fr.getMonth()]+' – '+to.getDate()+' '+MN[to.getMonth()]+' '+to.getFullYear()+' · مقارنة بالفترة السابقة</div><div id="brbar" class="noprint" style="margin-top:8px;display:none"></div>'+(s.branch?'<div class="mu" style="margin-top:4px">📍 '+esc(s.branch.name)+' — أرقام السوق والسعي للحساب كامل</div>':'')+'</div><div class="row noprint">'+Object.keys(PL).map(function(x){ return '<button class="chip'+(x===s.period?' on':'')+'" onclick="_sP(\''+x+'\')">'+PL[x]+'</button>'; }).join('')+'<button class="btn sec" onclick="window.print()">⬇ التقرير PDF</button></div></div>';
  var K=L?[['قيمة المشاريع المكتملة',f(c.jobs_value+c.market_value),'ر.س (عملاؤك + السوق)',delta(c.jobs_value+c.market_value,p.jobs_value+p.market_value)],['عروض الأسعار',f(c.quotes_sent),c.quote_rate!=null?'وافق '+c.quotes_ok+' ('+c.quote_rate+'%)':'ما أرسلت عروض',delta(c.quote_rate,p.quote_rate,1)],['عروضك في السوق',f(c.bids),c.win_rate!=null?'فزت بـ '+c.won+' ('+c.win_rate+'%)':'ما قدّمت عروض',delta(c.win_rate,p.win_rate,1)],['تقييمك',s.rating.avg!=null?s.rating.avg+' ★':'—','من '+s.rating.n+' تقييم'+(c.reviews_n?' · '+c.reviews_n+' جديد':''),'']]
    :[['عروضك في السوق',f(c.bids),'هذي الفترة',delta(c.bids,p.bids)],['فزت بها',f(c.won),c.win_rate!=null?'نسبة الفوز '+c.win_rate+'%':'—',delta(c.win_rate,p.win_rate,1)],['قيمة صفقاتك',f(c.market_value),'ر.س · '+c.market_deals+' صفقة',delta(c.market_value,p.market_value)],['تقييمك',s.rating.avg!=null?s.rating.avg+' ★':'—','من '+s.rating.n+' تقييم','']];
  h+='<div class="kp">'+K.map(function(x){ return '<div class="card k"><span class="mu">'+x[0]+'</span><div class="v">'+x[1]+'</div><span class="mu">'+x[2]+'</span>'+x[3]+'</div>'; }).join('')+'</div>';
  var mx=Math.max.apply(null,s.series.map(function(x){return x.v;}).concat([1]));
  var ch='<div class="card"><div class="sh"><b>'+(s.series_kind==='value'?'قيمة المشاريع المكتملة — آخر 6 شهور':'عروض فزت بها — آخر 6 شهور')+'</b><span class="mu">'+(s.series_kind==='value'?'ر.س':'عدد')+'</span></div><div class="bars" role="img" aria-label="رسم بياني">'+s.series.map(function(x,i){ var last=i===s.series.length-1; return '<div class="bc" tabindex="0" title="'+MN[x.m]+' '+x.y+': '+f(x.v)+(s.series_kind==='value'?' ر.س':'')+'"><span class="bv">'+(s.series_kind==='value'?k(x.v):f(x.v))+'</span><div class="b'+(last?' cur':'')+'" style="height:'+Math.max(2,Math.round(x.v/mx*170))+'px"></div><span class="bl">'+MN[x.m]+'</span></div>'; }).join('')+'</div></div>';
  var main=ch;
  // مقارنة الفروع
  if(L&&s.branches&&s.branches.length>1){ var bm=Math.max.apply(null,s.branches.map(function(b){return b.jobs_value;}).concat([1])), CL=['#1e3a8a','#0e9384','#c4320a','#6941c6','#475467'];
    main+='<div class="card"><div class="sh"><b>مقارنة الفروع</b><span class="mu">'+PL[s.period]+'</span></div><div class="mu" style="margin-bottom:4px">قيمة المشاريع المكتملة (ر.س)</div>'+s.branches.map(function(b,i){ return '<div class="fr"><span>'+esc(b.name)+'</span><div class="ft"><div style="width:'+Math.round(b.jobs_value/bm*100)+'%;background:'+CL[i%5]+'"></div></div><b>'+f(b.jobs_value)+'</b></div>'; }).join('')
      +'<div class="mu" style="margin:10px 0 4px">نسبة قبول عروض الأسعار</div>'+s.branches.map(function(b,i){ return '<div class="fr"><span>'+esc(b.name)+'</span><div class="ft"><div style="width:'+(b.quote_rate||0)+'%;background:'+CL[i%5]+'"></div></div><b>'+(b.quote_rate!=null?b.quote_rate+'%':'—')+'</b></div>'; }).join('')+'</div>'; }
  if(L){ var F=[['طلبات تسعيرة من صفحتك',c.qreqs],['عروض أسعار أرسلتها',c.quotes_sent],['وافق العميل',c.quotes_ok],['مشاريع مكتملة',c.jobs_done]], fm=Math.max.apply(null,F.map(function(x){return x[1];}).concat([1]));
    main+='<div class="card"><div class="sh"><b>من الطلب إلى التسليم</b><span class="mu">'+PL[s.period]+'</span></div>'+F.map(function(x){ return '<div class="fr"><span>'+x[0]+'</span><div class="ft"><div style="width:'+Math.round(x[1]/fm*100)+'%"></div></div><b>'+f(x[1])+'</b></div>'; }).join('')+'</div>'; }
  var side='';
  if(L){ side+='<div class="card"><div class="sh"><b>أداء الفريق</b></div>'+(s.team.length?s.team.map(function(t){ return '<div class="li"><span class="av">'+esc((t.name||'ف')[0])+'</span><div><b>'+esc(t.name)+'</b><span class="mu">'+t.done+' مشاريع'+(t.rating?' · متوسط التقييم '+t.rating+' ★':'')+' · '+t.late+' تأخير</span></div></div>'; }).join(''):'<div class="mu" style="padding:8px 0">ما فيه مشاريع مكتملة للفريق في هذي الفترة</div>')+'</div>';
    side+='<div class="card"><div class="sh"><b>الربح من مشاريع عملائك</b><span class="mu">'+PL[s.period]+'</span></div><div style="font-family:Cairo,sans-serif;font-size:26px;font-weight:900;color:'+(c.profit>=0?'#067647':'#b42318')+'">'+f(c.profit)+' <small style="font-size:13px">ر.س</small></div><div class="mu" style="line-height:1.9">القيمة '+f(c.jobs_value)+' − التكاليف '+f(c.costs)+(c.jobs_value?' · '+Math.round(c.profit/c.jobs_value*100)+'%':'')+'</div>'+(s.branches&&s.branches.length>1?s.branches.map(function(b){ return '<div class="li"><div><b>'+esc(b.name)+'</b><span class="mu">ربح '+f(b.profit)+' ر.س</span></div></div>'; }).join(''):'')+'</div>';
    side+='<div class="card"><div class="sh"><b>أكثر خدماتك</b></div>'+(s.top.length?s.top.map(function(t){ return '<div class="li"><div><b>'+esc(t.t)+'</b><span class="mu">'+t.n+' مرة · '+f(t.v)+' ر.س</span></div></div>'; }).join(''):'<div class="mu" style="padding:8px 0">—</div>')+'</div>';
    side+='<div class="card"><div class="sh"><b>خطط الصيانة</b></div><div class="mu" style="line-height:1.9">'+s.plans.active+' خطط فعّالة · '+s.plans.visits+' زيارات في هذي الفترة · '+s.plans.renew+' تجديد قريب</div></div>'; }
  side+='<div class="card"><div class="sh"><b>السعي</b></div><div class="mu" style="line-height:1.9">سدّدت '+f(c.saai_paid)+' ر.س في هذي الفترة'+(s.saai_due?' · <b style="color:#b54708">مستحق الحين '+f(s.saai_due)+' ر.س</b>':' · ما عليك مستحق')+'</div>'+(s.saai_due?'<a class="btn pri noprint" style="margin-top:10px" href="/dashboard-provider.html#saai">سدّد</a>':'')+'</div>';
  h+='<div class="grid"><div class="main">'+main+'</div><div class="side">'+side+'</div></div><div class="mu" style="text-align:center;margin-top:6px">أرقامك أنت بس · مناقصة</div>';
  A.innerHTML=h; if(window.MNQ_BR) MNQ_BR.bar(document.getElementById('brbar'),function(){ load(); });
}
load();
})();
</script>
<script src="/pnav.js?v=5" defer></script>
</body>
</html>
